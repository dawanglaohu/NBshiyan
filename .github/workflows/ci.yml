name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: 依赖漏洞扫描（high 及以上阻断）
        run: pnpm audit --audit-level high --prod
      - name: 模型体积门槛（普通 1MB，带动画 1.5MB）
        run: node scripts/check-model-size.mjs
      - name: 模型和封面路径必须存在（products.ts）
        run: node scripts/check-model-refs.mjs
      - name: 后台接口必须鉴权
        run: node scripts/check-admin-guard.mjs
      - name: Unit tests
        run: pnpm test
      - run: pnpm build
      - name: standalone 启动检查（缺 EDGE_AUTH_SECRET / DATABASE_URL / SMTP_PASS 都必须 exit 1；只用假值）
        run: STANDALONE_TEST=1 node --import tsx --test tests/standalone-start.test.ts
      # 固定 Chrome 版本，避免 runner 自带 Chrome 升级后与 Lighthouse 的 trace 格式不兼容（frame_sequence 报错）
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with: { chrome-version: stable, install-dependencies: true }
      - name: Lighthouse 性能门槛
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          pnpm start > /tmp/next.log 2>&1 &
          npx --yes wait-on@8 --timeout 120000 http://localhost:3000/en http://localhost:3000/en/products
          npx --yes @lhci/cli@0.15.x autorun

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: e2e }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # 只用于 CI 测试库的假值；不是生产密钥
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
      AUTH_SECRET: e2e-only-auth-secret-not-for-production-000
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: 'true'
      ADMIN_TOTP_KEY: ZTJlLW9ubHktdG90cC1rZXktMzItYnl0ZXMtMDAwMDA=
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      # standalone 下 req.url 是监听地址（http://0.0.0.0:3100），assertSameOrigin 只认
      # APP_ORIGIN，缺它所有改数据的后台请求一律 403
      APP_ORIGIN: http://localhost:3100
      NEXT_PUBLIC_ADMIN_API: http
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      TURNSTILE_VERIFY_URL: http://127.0.0.1:3999/siteverify
      NEXT_PUBLIC_TAWK_PROPERTY_ID: e2eprop
      NEXT_PUBLIC_TAWK_WIDGET_ID: e2ewidget
      CRON_SECRET: e2e-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma db push --skip-generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # next build 的 standalone 产物缺 .next/static 与 public，浏览器跑起来才会 404 样式和媒体。
      # playwright.config.ts 加载时也做同样的复制（本地跑 e2e 不必手动执行本步），这里显式列出来，CI 日志里能核到运行目录就位。
      - name: 准备 standalone 运行目录（复制 .next/static 与 public）
        run: |
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      # 全部 e2e 用例（含 e2e/brand-smoke.spec.ts）共用这一个真实构建产物服务 + 上面的 postgres service。
      # standalone 的 stdout 由 webServer 重定向到 .next/standalone-server.log，brand-smoke 从同一份文件核 RUM 脱敏日志。
      - name: Playwright（仅 Chromium；统一跑 .next/standalone/server.js + postgres service）
        run: pnpm test:e2e
      - name: 核对同次 standalone 服务的 RUM 脱敏日志
        run: |
          test -s .next/standalone-server.log
          grep -c '^{"type":"rum"' .next/standalone-server.log
          if grep '^{"type":"rum"' .next/standalone-server.log | grep -q '@'; then
            echo 'RUM 日志出现邮箱样式字段，脱敏白名单被破坏' >&2
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .next/standalone-server.log
          retention-days: 7

