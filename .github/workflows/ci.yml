          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const records = readFileSync('/tmp/pg-regressions.tap', 'utf8').split(/\r?\n/)
            .map(line => line.match(/# ACTION_GRANT_LOCK_EXPIRY_EVIDENCE (\{.*\})$/))
            .filter(Boolean).map(match => JSON.parse(match[1]));
          assert.equal(records.length, 4, 'Missing PostgreSQL lock-wait evidence');
          assert.deepEqual(records.map(r => `${r.lock}/${r.expiry}`).sort(), ['Device/device', 'Device/grant', 'User/device', 'User/grant']);
          for (const r of records) {
            assert.ok(Number.isInteger(r.blockerPid) && Number.isInteger(r.consumerPid) && r.blockerPid !== r.consumerPid);
            assert.ok(r.waitingAt < Date.parse(r.expiresAt) && r.releasedAt > Date.parse(r.expiresAt));
            assert.equal(r.consumed, false);
            assert.equal(r.usedAt, null);
            console.log(`ACTION_GRANT_LOCK_EXPIRY_EVIDENCE ${JSON.stringify(r)}`);
          }
          EOF
      - name: Provision Playwright browser and OS deps (transient mirror + bounded retry)
        shell: bash
        timeout-minutes: 20
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Transient GitHub runner only: point the Ubuntu official sources at the verified
          # HTTPS mirror for this job. Suites/Components/Signed-By stay as shipped; unknown
          # layouts hard-fail instead of being guessed. DNS/hosts/resolv.conf are not touched.
          UBU=/etc/apt/sources.list.d/ubuntu.sources
          [ -f "$UBU" ] || { echo 'APT_SOURCE_LAYOUT_UNKNOWN no-ubuntu.sources' >&2; exit 1; }
          grep -q '^Signed-By:' "$UBU" || { echo 'APT_SIGNED_BY_MISSING' >&2; exit 1; }
          grep -Eq '^URIs:.*((archive|security)\.ubuntu\.com|mirror\+file:)' "$UBU" \
            || { echo 'APT_SOURCE_URIS_UNEXPECTED' >&2; exit 1; }
          if grep -Eq '^[[:space:]]*deb[[:space:]]+http' /etc/apt/sources.list 2>/dev/null; then
            echo 'APT_LEGACY_SOURCES_PRESENT' >&2; exit 1
          fi
          sudo cp -a "$UBU" /tmp/ubuntu.sources.bak
          sudo sed -i -E 's#^URIs:.*#URIs: https://mirrors.edge.kernel.org/ubuntu/#' "$UBU"
          grep -q '^Signed-By:' "$UBU" || { echo 'APT_SIGNED_BY_MISSING_AFTER_REWRITE' >&2; exit 1; }
          grep -q '^Components:' "$UBU" || { echo 'APT_COMPONENTS_MISSING_AFTER_REWRITE' >&2; exit 1; }
          # apt-get update exits 0 while individual suites fail to download (W: Failed to
          # fetch), so a dead mirror still printed READY in run 44568993782. Judge freshness
          # from the exit status and from the English output (LC_ALL=C), but only for lines
          # about the archive hosts of the source under test: a flaky third-party repository
          # on the runner must not turn this step red. A stale mirror falls back once to the
          # runner's original signed sources; both unusable is a hard stop.
          apt_update() {
            local tag=$1 hostre=$2 rc=0 bad log="/tmp/apt-update-$1.log"
            sudo env LC_ALL=C apt-get update -o Acquire::Retries=3 -o Acquire::https::Timeout=30 \
              -o Acquire::https::Verify-Peer=true -o Acquire::https::Verify-Host=true >"$log" 2>&1 || rc=$?
            bad=$(grep -Ec "^E: |^(W: Failed to fetch|Err:[0-9]+) [^ ]*(${hostre})" "$log" || true)
            if [ "$rc" -eq 0 ] && [ "$bad" -eq 0 ]; then
              echo "APT_UPDATE_FRESH ${tag}"
              return 0
            fi
            echo "APT_UPDATE_INCOMPLETE ${tag} exit=${rc} issues=${bad}" >&2
            grep -E "^E: |^(W: Failed to fetch|Err:[0-9]+) [^ ]*(${hostre})" "$log" | head -n 8 | cut -c1-200 >&2 || true
            return 1
          }
          if apt_update mirror 'mirrors\.edge\.kernel\.org'; then
            echo 'APT_UBUNTU_MIRROR_READY https://mirrors.edge.kernel.org/ubuntu/'
          else
            sudo cp -a /tmp/ubuntu.sources.bak "$UBU"
            grep -q '^Signed-By:' "$UBU" || { echo 'APT_SIGNED_BY_MISSING_AFTER_RESTORE' >&2; exit 1; }
            if apt_update original 'archive\.ubuntu\.com|security\.ubuntu\.com|ports\.ubuntu\.com'; then
              echo 'APT_UBUNTU_MIRROR_FALLBACK_ORIGINAL_SOURCES'
            else
              echo 'APT_UBUNTU_SOURCES_UNAVAILABLE' >&2
              exit 1
            fi
          fi
          # Same lockfile-pinned @playwright/test and the same --with-deps contract. This is a
          # bounded mitigation on a transient runner, not a claim that runner DNS is solved.
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              echo "PLAYWRIGHT_PROVISION_OK attempt=$attempt"
              exit 0
            fi
            echo "PLAYWRIGHT_PROVISION_RETRY attempt=$attempt failed" >&2
            sleep $((attempt * 15))
          done
          echo 'PLAYWRIGHT_PROVISION_EXHAUSTED' >&2
          exit 1
      - name: Build e2e standalone and verify test identity
        shell: bash
        env:
          APP_ENV: test
          NEXT_PUBLIC_ADMIN_MAIL: http
        run: |
          pnpm build
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { appendFileSync, lstatSync, readFileSync } from 'node:fs';
          import { isDeepStrictEqual } from 'node:util';

          const sha256 = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const utf8 = new TextDecoder('utf-8', { fatal: true, ignoreBOM: true });

          function readBuildFile(file) {
            const stat = lstatSync(file);
            if (!stat.isFile() || stat.size === 0) throw new Error();
            return readFileSync(file);
          }

          function readStandaloneConfig(server) {
            const source = utf8.decode(server);
            const definitions = [...source.matchAll(/^const nextConfig = ([^\r\n]+)$/gm)];
            if (definitions.length !== 1) throw new Error();
            const [[declaration, json]] = definitions;
            // Next 15.5.28 emits this CommonJS bootstrap, including both uses of nextConfig.
            const bootstrap = source.replace(declaration, 'const nextConfig = <JSON>');
            if (sha256(bootstrap) !== '725d2150a28b8355d7b1e2cbaa32e9b80ea162fd027d247c9aa57e87b5aea2ea') throw new Error();
            const config = JSON.parse(json);
            // A JSON round trip rejects duplicate keys. Object literals give __proto__ special meaning.
            if (JSON.stringify(config) !== json || /"__proto__":/.test(json)) throw new Error();
            return config;
          }

          let buildId, rootBuildId, serverBytes, serverSha;
          try {
            const root = '.next/standalone';
            buildId = readBuildFile(`${root}/.next/BUILD_ID`).toString().trim();
            rootBuildId = readBuildFile('.next/BUILD_ID').toString().trim();
            const manifestText = utf8.decode(readBuildFile(`${root}/.next/required-server-files.json`));
            const manifest = JSON.parse(manifestText);
            const server = readBuildFile(`${root}/server.js`);
            const config = readStandaloneConfig(server);
            // The standalone emitter prefixes the manifest's default distDir with ./.
            if (!/^[A-Za-z0-9_-]{1,64}$/.test(buildId) || buildId !== rootBuildId ||
                JSON.stringify(manifest, null, 2) !== manifestText || manifest.config?.distDir !== '.next' ||
                !isDeepStrictEqual(config, { ...manifest.config, distDir: './.next' }) ||
                config.env?.APP_ENV_AT_BUILD !== 'test' || config.env?.NEXT_PUBLIC_ADMIN_MAIL !== 'http') {
              throw new Error();
            }
            serverBytes = server.length;
            serverSha = sha256(server);
          } catch {
            console.error('E2E_TEST_BUILD_IDENTITY_INVALID');
            process.exit(1);
          }

          try {
            appendFileSync(process.env.GITHUB_ENV, 'APP_ENV=test\nNEXT_PUBLIC_ADMIN_MAIL=http\n');
          } catch {
            console.error('E2E_TEST_BUILD_ENV_WRITE_FAILED');
            process.exit(1);
          }
          console.log(`E2E_TEST_BUILD_SOURCE root_build_id=${rootBuildId} standalone_build_id=${buildId} server_js_bytes=${serverBytes} server_js_sha256=${serverSha}`);
          console.log(`E2E_TEST_BUILD_OK build_id=${buildId} server_js_sha256=${serverSha}`);
          EOF
      # next build 的 standalone 产物缺 .next/static 与 public，浏览器跑起来才会 404 样式和媒体。
      # playwright.config.ts 加载时也做同样的复制（本地跑 e2e 不必手动执行本步），这里显式列出来，CI 日志里能核到运行目录就位。
      - name: 准备 standalone 运行目录（复制 .next/static 与 public）
        run: |
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      # M3-T20 真实 socket/Auth.js：同一构建产物就绪后跑同一文件，期望 17（DB-only 16 + 1 条 HTTP 全链）。
      # 专属 URL + require + 显式 CI 模式与 DB 步骤成对；不 fallback 通用 DATABASE_URL，不读真实 env。
      - name: M3-T20 真实 HTTP 回归（standalone 就绪后，17）
        env:
          B10_M3T20_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
          B10_M3T20_REQUIRE_DATABASE: 'true'
          B10_M3T20_CI_MODE: 'true'
          B10_M3T20_STANDALONE_DIR: ${{ github.workspace }}/.next/standalone
          CI: 'true'
        run: |
          set -o pipefail
          # 只给目录字符串不算就绪：先核产物真的在，再跑。
          test -f .next/standalone/server.js
          cat > /tmp/m3t20-http-gate.cjs <<'EOF'
          'use strict';
          module.exports = async function* httpGate(source) {
            const counts = new Map();
            for await (const event of source) {
              if (event.type !== 'test:summary' || !event.data?.file || !event.data.counts) continue;
              counts.set(String(event.data.file), event.data.counts);
            }
            const wanted = 'tests/admin-self-rebind.db.test.ts';
            const hit = [...counts.entries()].filter(([file]) => file.endsWith(wanted));
            if (hit.length !== 1) {
              console.error(`GATE missing ${wanted}`);
              return;
            }
            yield `${wanted}\tpass=${hit[0][1].passed}\tfail=${hit[0][1].failed}\tskip=${hit[0][1].skipped}\ttodo=${hit[0][1].todo}\tcancelled=${hit[0][1].cancelled}\n`;
          };
          EOF
          node --import tsx --test --test-concurrency=1 \
            --test-reporter=tap \
            --test-reporter=/tmp/m3t20-http-gate.cjs \
            --test-reporter-destination=/tmp/m3t20-http.tap \
            --test-reporter-destination=/tmp/m3t20-http-gate.txt \
            tests/admin-self-rebind.db.test.ts \
            || { status=$?; cat /tmp/m3t20-http.tap /tmp/m3t20-http-gate.txt; exit "$status"; }
          grep -qx '# skipped 0' /tmp/m3t20-http.tap
          grep -qx '# fail 0' /tmp/m3t20-http.tap
          # 精确 17：16（DB-only）或 18（重复执行）都不能被 pass>=1 的宽门吞掉。
          grep -Fqx $'tests/admin-self-rebind.db.test.ts\tpass=17\tfail=0\tskip=0\ttodo=0\tcancelled=0' /tmp/m3t20-http-gate.txt
      # 五段使用同一构建产物与 PG，各自重启 Playwright 管理的应用，隔离 memory 限流。
      # 建单源码预算 5/3/3，认证源码预算 29/7/7；不是服务器请求实测计数。
      - name: 核对 A3 收集分区并准备执行器（213 + 14 + 14 + 2 + 1 = 244）
        id: e2e_partition
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p e2e-evidence/collection
          split_pattern='admin-legacy-inquiries-visual\.spec\.ts .* (E1 真实 400：|A1 仅本用例合成询盘：|三尺寸完整流程：)'
          error_pattern='admin-legacy-inquiries-visual\.spec\.ts .* (E1 真实 400：|A1 仅本用例合成询盘：)'
          flow_pattern='admin-legacy-inquiries-visual\.spec\.ts .* 三尺寸完整流程：'
          # 同意写按客户端限流 20 次/10 分钟；同意密集的两组单独成段，各自用一个应用进程。
          mapfile -t main_files < <(ls e2e/*.spec.ts | grep -v -E '/(model-events|analytics-consent|consent-writes)\.spec\.ts$')
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-evidence/collection/all.json pnpm test:e2e --list --reporter=json
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-evidence/collection/main.json pnpm test:e2e --list --reporter=json "${main_files[@]}" --grep-invert "$split_pattern"
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-evidence/collection/model.json pnpm test:e2e e2e/model-events.spec.ts --list --reporter=json
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-evidence/collection/consent.json pnpm test:e2e e2e/analytics-consent.spec.ts e2e/consent-writes.spec.ts --list --reporter=json
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-evidence/collection/errors.json pnpm test:e2e e2e/admin-legacy-inquiries-visual.spec.ts --list --reporter=json --grep "$error_pattern"
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-evidence/collection/flow.json pnpm test:e2e e2e/admin-legacy-inquiries-visual.spec.ts --list --reporter=json --grep "$flow_pattern"
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const groups = {};
          for (const name of ['all', 'main', 'model', 'consent', 'errors', 'flow']) {
            const report = JSON.parse(readFileSync(`e2e-evidence/collection/${name}.json`, 'utf8'));
            assert.deepEqual(report.errors, [], `${name}: collection errors`);
            const rows = [];
            const visit = (suite, parents = []) => {
              for (const spec of suite.specs ?? []) for (const test of spec.tests ?? []) {
                rows.push({ key: JSON.stringify([test.projectName, spec.file, spec.line, spec.column, [...parents, suite.title], spec.title]), file: spec.file, title: spec.title });
              }
              for (const child of suite.suites ?? []) visit(child, [...parents, suite.title]);
            };
            for (const suite of report.suites) visit(suite);
            groups[name] = rows;
            assert.equal(new Set(rows.map(row => row.key)).size, rows.length, `${name}: duplicate tests`);
          }
          assert.deepEqual(Object.fromEntries(Object.entries(groups).map(([name, rows]) => [name, rows.length])), { all: 244, main: 213, model: 14, consent: 14, errors: 2, flow: 1 });
          const parts = [...groups.main, ...groups.model, ...groups.consent, ...groups.errors, ...groups.flow].map(row => row.key);
          assert.equal(new Set(parts).size, 244, 'Partitions overlap');
          assert.deepEqual(parts.sort(), groups.all.map(row => row.key).sort(), 'Partitions omit or change tests');
          const errors = [
            'E1 真实 400：搜索 101 字符 / 备注 5001 字符错误与纠正恢复',
            'A1 仅本用例合成询盘：原 privacy/export+delete 匿名化、PII 消失、只读与 409、history 保留',
          ];
          const flow = '三尺寸完整流程：列表→详情→状态/分配/备注写动作→刷新持久（1920/1440/390 真触控 tap，原生帧）';
          assert.deepEqual(groups.errors.map(row => row.title).sort(), errors.sort());
          assert.deepEqual(groups.flow.map(row => row.title), [flow]);
          for (const row of [...groups.errors, ...groups.flow]) assert.equal(row.file, 'admin-legacy-inquiries-visual.spec.ts');
          writeFileSync('e2e-evidence/collection/partition.json', JSON.stringify(groups, null, 2) + '\n');
          console.log('A3_COLLECTION all=244 main=213 model=14 consent=14 errors=2 flow=1 disjoint=true complete=true');
          EOF
          driver_dir=$(mktemp -d "${RUNNER_TEMP:?}/nbshiyan-e2e-a3.XXXXXXXX")
          cat > "$driver_dir/ports.cjs" <<'EOF'
          const net = require('node:net');
          (async () => {
            for (const [host, port] of [['0.0.0.0', Number(process.env.E2E_PORT ?? 3100)], ['127.0.0.1', 3999]]) {
              if (!Number.isInteger(port) || port < 1 || port > 65535) throw new Error('INVALID_E2E_PORT');
              await new Promise((resolve, reject) => {
                const server = net.createServer();
                server.once('error', () => reject(new Error(`A3_PORT_NOT_RELEASED:${port}`)));
                server.listen({ host, port, exclusive: true }, () => server.close(error => error ? reject(error) : resolve()));
              });
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          EOF
          cat > "$driver_dir/run.sh" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          segment=${1:?SEGMENT_REQUIRED}
          # 与收集步骤同一份文件清单：同意密集的两组各自成段，main 只跑其余文件。
          mapfile -t main_files < <(ls e2e/*.spec.ts | grep -v -E '/(model-events|analytics-consent|consent-writes)\.spec\.ts$')
          case "$segment" in
            main) args=("${main_files[@]}" --grep-invert "$A3_SPLIT_PATTERN") ;;
            model) args=(e2e/model-events.spec.ts) ;;
            consent) args=(e2e/analytics-consent.spec.ts e2e/consent-writes.spec.ts) ;;
            errors) args=(e2e/admin-legacy-inquiries-visual.spec.ts --grep "$A3_ERROR_PATTERN") ;;
            flow) args=(e2e/admin-legacy-inquiries-visual.spec.ts --grep "$A3_FLOW_PATTERN") ;;
            *) exit 1 ;;
          esac
          evidence="e2e-evidence/$segment"
          mkdir -p "$evidence"
          printf 'released=false\n' >> "$GITHUB_OUTPUT"
          archive_log() {
            if [[ -f .next/standalone-server.log && ! -e "$evidence/standalone-server.log" ]]; then
              mv .next/standalone-server.log "$evidence/standalone-server.log"
            fi
          }
          interrupted() {
            trap - INT TERM
            archive_log || true
            printf 'released=false\ninterrupted=true\n' >> "$GITHUB_OUTPUT"
            exit "$1"
          }
          trap 'interrupted 130' INT
          trap 'interrupted 143' TERM
          # Never reuse a listener or attribute a previous segment's stdout to this segment.
          node "$A3_DRIVER_DIR/ports.cjs" > "$evidence/port-before.log" 2>&1
          [[ ! -e .next/standalone-server.log && ! -e "$evidence/standalone-server.log" ]] || { echo 'A3_STALE_SERVER_LOG' >&2; exit 1; }
          export PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$segment"
          set +e
          pnpm test:e2e "${args[@]}" --output="test-results/$segment" 2>&1 | tee "$evidence/playwright.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          test_status=${statuses[0]}
          capture_status=${statuses[1]}
          printf 'test_exit=%s\ncapture_exit=%s\n' "$test_status" "$capture_status" >> "$GITHUB_OUTPUT"
          archive_log
          case "$test_status" in 130|137|143) interrupted "$test_status" ;; esac
          log_status=0
          [[ -s "$evidence/standalone-server.log" ]] || log_status=1
          rum_status=0
          # Check the main application's own archived stdout before another invocation can truncate the default log.
          if [[ "$segment" == main ]]; then
            if [[ "$log_status" != 0 ]] || ! grep -c '^{"type":"rum"' "$evidence/standalone-server.log" > "$evidence/rum-count.txt"; then
              rum_status=1
            elif grep -q '^{"type":"rum".*@' "$evidence/standalone-server.log"; then
              echo 'RUM 日志出现邮箱样式字段，脱敏白名单被破坏' >&2
              rum_status=1
            fi
          fi
          release_status=0
          node "$A3_DRIVER_DIR/ports.cjs" > "$evidence/port-after.log" 2>&1 || release_status=$?
          if [[ "$release_status" == 0 ]]; then printf 'released=true\n' >> "$GITHUB_OUTPUT"; fi
          printf 'test_exit=%s\ncapture_exit=%s\nlog_exit=%s\nrum_exit=%s\nrelease_exit=%s\n' "$test_status" "$capture_status" "$log_status" "$rum_status" "$release_status" > "$evidence/result.txt"
          if (( test_status != 0 || capture_status != 0 || log_status != 0 || rum_status != 0 || release_status != 0 )); then exit 1; fi
          EOF
          {
            printf 'A3_DRIVER_DIR=%s\n' "$driver_dir"
            printf 'A3_SPLIT_PATTERN=%s\n' "$split_pattern"
            printf 'A3_ERROR_PATTERN=%s\n' "$error_pattern"
            printf 'A3_FLOW_PATTERN=%s\n' "$flow_pattern"
          } >> "$GITHUB_ENV"
      - name: Playwright A3 主段（213例，含同次 RUM 检查）
        id: e2e_main
        shell: bash
        run: bash "$A3_DRIVER_DIR/run.sh" main
      - name: Playwright A3 模型事件段（14例，新应用进程）
        id: e2e_model
        if: ${{ !cancelled() && steps.e2e_partition.outcome == 'success' && steps.e2e_main.outputs.released == 'true' }}
        shell: bash
        run: bash "$A3_DRIVER_DIR/run.sh" model
      - name: Playwright A3 同意写段（14例，新应用进程）
        id: e2e_consent
        if: ${{ !cancelled() && steps.e2e_partition.outcome == 'success' && steps.e2e_model.outputs.released == 'true' }}
        shell: bash
        run: bash "$A3_DRIVER_DIR/run.sh" consent
      - name: Playwright A3 E1 + A1（2例，新应用进程）
        id: e2e_errors
        if: ${{ !cancelled() && steps.e2e_partition.outcome == 'success' && steps.e2e_consent.outputs.released == 'true' }}
        shell: bash
        run: bash "$A3_DRIVER_DIR/run.sh" errors
      - name: Playwright A3 三尺寸流程（1例，新应用进程）
        id: e2e_flow
        if: ${{ !cancelled() && steps.e2e_partition.outcome == 'success' && steps.e2e_errors.outputs.released == 'true' }}
        shell: bash
        run: bash "$A3_DRIVER_DIR/run.sh" flow
      - name: 汇总 A3 五段结果（失败或未执行均不通过）
        id: e2e_a3_summary
        if: ${{ !cancelled() && steps.e2e_partition.outcome == 'success' }}
        shell: bash
        env:
          MAIN_OUTCOME: ${{ steps.e2e_main.outcome }}
          MODEL_OUTCOME: ${{ steps.e2e_model.outcome }}
          CONSENT_OUTCOME: ${{ steps.e2e_consent.outcome }}
          ERRORS_OUTCOME: ${{ steps.e2e_errors.outcome }}
          FLOW_OUTCOME: ${{ steps.e2e_flow.outcome }}
          MAIN_RELEASED: ${{ steps.e2e_main.outputs.released }}
          MODEL_RELEASED: ${{ steps.e2e_model.outputs.released }}
          CONSENT_RELEASED: ${{ steps.e2e_consent.outputs.released }}
          ERRORS_RELEASED: ${{ steps.e2e_errors.outputs.released }}
          FLOW_RELEASED: ${{ steps.e2e_flow.outputs.released }}
        run: |
          for segment in MAIN MODEL CONSENT ERRORS FLOW; do
            outcome="${segment}_OUTCOME"
            released="${segment}_RELEASED"
            [[ ${!outcome} == success && ${!released} == true ]] || { echo "A3_SEGMENT_FAILED_OR_MISSING:$segment" >&2; exit 1; }
          done
      # Formal supplement (integrated R3): T10 state capture, wired per the PM re-review hand-off (CI-HANDOFF.md, CI-STEP.sh).
      # Starts only after the A3 summary step has itself succeeded (id e2e_a3_summary added to that step, nothing else in it
      # changed). Strictly private console/Playwright/server/check output under $RUNNER_TEMP/t10-private.*, tracing off,
      # no tee, no GitHub reporter; raw run under e2e-evidence/t10-acceptance (excluded from playwright-report); status
      # receipt (t10-receipt) and admitted 16-file set (t10-admitted-evidence, on success only) upload separately.
      # Final wiring: the 14-line source manifest (13 baseline blobs + the final R3 spec) and the three tools (select / check /
      # admission) are pinned by two separate digests that live only in this workflow, never read back from the files they
      # check. Both manifests are verified before capture and again before any of the three tools runs. The 16 admitted files
      # (15 PNG + the RUN json) go to their own artifact only after the step itself succeeded; the status receipt stays separate.
      # T10_STATE_CAPTURE=1 is set only on the Playwright child process below; by default the spec registers 0 cases (A3 stays 244/213).
      - name: T10 state capture (dedicated empty PostgreSQL database)
        id: t10_capture
        if: ${{ success() && steps.e2e_partition.outcome == 'success' && steps.e2e_a3_summary.outcome == 'success' }}
        shell: bash
        timeout-minutes: 15
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/b10_t10_capture
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
          T10_SELECT_RUN: ${{ github.workspace }}/tests/evidence/t10-select-run.py
          T10_CHECKER: ${{ github.workspace }}/tests/evidence/t10-check-run.py
          T10_EVIDENCE_ADMISSION: ${{ github.workspace }}/tests/evidence/t10-evidence-admission.py
          T10_APPROVED_MANIFEST: ${{ github.workspace }}/tests/evidence/t10-approved.sha256
          T10_APPROVED_MANIFEST_SHA: df89d7a0247cd03dfa8560996d7fb863bfc0ce58334e56ce1bbb78fe29a04bfc
          T10_TOOLS_MANIFEST: ${{ github.workspace }}/tests/evidence/t10-tools.sha256
          T10_TOOLS_MANIFEST_SHA: c671e4379600d618ec1bc59de0c6169fdceab71f7b18806a96a133ab5d6c929c
        run: |
          # Candidate run body for the CI writer. See CI-HANDOFF.md for required wiring.
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE"
          receipt="$RUNNER_TEMP/t10-receipt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$receipt"
          phase=preflight
          trap 'rc=$?; printf "stage=%s\nexit=%s\n" "$phase" "$rc" > "$receipt/result.txt"; if ((rc != 0)); then printf "T10_STAGE_FAILED:%s\n" "$phase" >&4; fi; exit "$rc"' EXIT
          exec 4>&2
          private=$(mktemp -d "$RUNNER_TEMP/t10-private.XXXXXXXX")
          exec >"$private/driver.log" 2>&1

          baseline=ed9685a23b724baef64f43476b4f1e0c9ef06d63
          head=$(git rev-parse --verify HEAD)
          tree=$(git rev-parse --verify 'HEAD^{tree}')
          [[ "$head" == "$GITHUB_SHA" && -z "${E2E_RUN_AUTH_DIRECTORY:-}" && -z "${T10_STATE_CAPTURE:-}" ]]
          git merge-base --is-ancestor "$baseline" "$head"
          git diff --quiet HEAD --
          printf '%s  %s\n' "$T10_APPROVED_MANIFEST_SHA" "$T10_APPROVED_MANIFEST" | sha256sum --strict -c -
          sha256sum --strict -c "$T10_APPROVED_MANIFEST"
          printf '%s  %s\n' "$T10_TOOLS_MANIFEST_SHA" "$T10_TOOLS_MANIFEST" | sha256sum --strict -c -
          sha256sum --strict -c "$T10_TOOLS_MANIFEST"

          build_file=.next/standalone/.next/BUILD_ID
          server=.next/standalone/server.js
          [[ -s "$server" && -s "$build_file" && ! -e .next/standalone-server.log ]]
          build_id=$(<"$build_file")
          [[ "$build_id" =~ ^[A-Za-z0-9_-]+$ ]]
          sha256sum "$server" "$build_file" > "$private/carrier.sha256"
          # Keep the captured root outside all upload selectors except the explicit denylisted parent.
          raw="$GITHUB_WORKSPACE/e2e-evidence/t10-acceptance"
          mkdir "$raw"
          node "$A3_DRIVER_DIR/ports.cjs"

          phase=database
          [[ "$DATABASE_URL" == */b10_t10_capture ]]
          docker exec "$PG_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE "b10_t10_capture"'
          pnpm prisma db push --skip-generate

          phase=playwright
          set +e
          env -u M5T10_DENSITY_EVIDENCE_ROOT -u T10_BUILD_ID_PATH \
            T10_STATE_CAPTURE=1 T10_STATE_EVIDENCE_ROOT="$raw" E2E_PORT=3100 FORCE_COLOR=0 \
            PLAYWRIGHT_HTML_OUTPUT_DIR="$private/html" \
            PLAYWRIGHT_JSON_OUTPUT_FILE="$private/playwright.json" \
            pnpm test:e2e e2e/t10-state-capture.spec.ts --workers=1 --retries=0 --trace off \
            --reporter=list,json --output="$private/test-results" > "$private/playwright.log" 2>&1
          test_rc=$?
          set -e
          log_rc=0
          mv -- .next/standalone-server.log "$private/standalone-server.log" || log_rc=$?
          port_rc=0
          node "$A3_DRIVER_DIR/ports.cjs" || port_rc=$?
          if (( test_rc != 0 || log_rc != 0 || port_rc != 0 )); then
            kind=ok
            if (( test_rc != 0 )); then
              kind=$(python3 -B tests/evidence/t10-playwright-diagnostic.py "$private/playwright.json") || kind=report_unavailable
              case "$kind" in
                loader|launch|case|setup_or_runner|mixed|unclassified|report_unavailable) ;;
                *) kind=report_unavailable ;;
              esac
            fi
            printf 'playwright_kind=%s\nplaywright_rc=%d\nlog_archive_rc=%d\nports_rc=%d\n' \
              "$kind" "$test_rc" "$log_rc" "$port_rc" > "$receipt/playwright.txt"
            printf 'T10_PLAYWRIGHT_DIAGNOSTIC kind=%s playwright_rc=%d log_archive_rc=%d ports_rc=%d\n' \
              "$kind" "$test_rc" "$log_rc" "$port_rc" >&4
            # Bounded follow-on detail for the first failing case: closed enums, counts <= 4 and
            # at most one 3-digit hint. report=ok needs the target spec's four declarations, one
            # project and four cases; shape is the count distribution only. Anything else is a
            # rejected receipt. No message/path/URL leaves the helper.
            detail=$(python3 -B tests/evidence/t10-playwright-diagnostic.py --detail "$private/playwright.json") \
              || detail='report=missing case=0 failed=0 skipped=0 shape=none code=none expect=none value=none'
            detail_fallback='report=missing case=0 failed=0 skipped=0 shape=none code=none expect=none value=none'
            # Exact closed code set, the same 70 entries the helper catalogued from the pinned
            # spec + run-auth blobs. A token outside it is never published, even if the helper
            # were replaced: the shell rejects it before the receipt is written.
            detail_codes='E2E_RUN_AUTH_ALREADY_INITIALIZED E2E_RUN_AUTH_ALREADY_INITIALIZED_AND_CLEANUP E2E_RUN_AUTH_ARTIFACT_DIRECTORY E2E_RUN_AUTH_ARTIFACT_DIRECTORY_AND_CLEANUP E2E_RUN_AUTH_CACHE E2E_RUN_AUTH_CACHE_AND_CLEANUP E2E_RUN_AUTH_CLEANUP E2E_RUN_AUTH_CLEANUP_AND_CLEANUP E2E_RUN_AUTH_CLEANUP_CONTENT E2E_RUN_AUTH_CLEANUP_CONTENT_AND_CLEANUP E2E_RUN_AUTH_CLEANUP_OWNER E2E_RUN_AUTH_CLEANUP_OWNER_AND_CLEANUP E2E_RUN_AUTH_CSRF E2E_RUN_AUTH_CSRF_AND_CLEANUP E2E_RUN_AUTH_DIRECTORY E2E_RUN_AUTH_DIRECTORY_AND_CLEANUP E2E_RUN_AUTH_EXPIRED E2E_RUN_AUTH_EXPIRED_AND_CLEANUP E2E_RUN_AUTH_FILE_CHANGED E2E_RUN_AUTH_FILE_CHANGED_AND_CLEANUP E2E_RUN_AUTH_IDENTITY E2E_RUN_AUTH_IDENTITY_AND_CLEANUP E2E_RUN_AUTH_INITIALIZE E2E_RUN_AUTH_INITIALIZE_AND_CLEANUP E2E_RUN_AUTH_LOGIN E2E_RUN_AUTH_LOGIN_AND_CLEANUP E2E_RUN_AUTH_MANIFEST_DIGEST E2E_RUN_AUTH_MANIFEST_DIGEST_AND_CLEANUP E2E_RUN_AUTH_PERMISSIONS E2E_RUN_AUTH_PERMISSIONS_AND_CLEANUP E2E_RUN_AUTH_PROVENANCE E2E_RUN_AUTH_PROVENANCE_AND_CLEANUP E2E_RUN_AUTH_REQUEST_CLEANUP E2E_RUN_AUTH_REQUEST_CLEANUP_AND_CLEANUP E2E_RUN_AUTH_REQUEST_CONTEXT E2E_RUN_AUTH_REQUEST_CONTEXT_AND_CLEANUP E2E_RUN_AUTH_SESSION E2E_RUN_AUTH_SESSION_401 E2E_RUN_AUTH_SESSION_403 E2E_RUN_AUTH_SESSION_503 E2E_RUN_AUTH_SESSION_AND_CLEANUP E2E_RUN_AUTH_SESSION_HTTP E2E_RUN_AUTH_SESSION_HTTP_AND_CLEANUP E2E_RUN_AUTH_SOURCE E2E_RUN_AUTH_SOURCE_AND_CLEANUP E2E_RUN_AUTH_STATE_DIGEST E2E_RUN_AUTH_STATE_DIGEST_AND_CLEANUP E2E_RUN_AUTH_SYMLINK_OR_TYPE E2E_RUN_AUTH_SYMLINK_OR_TYPE_AND_CLEANUP E2E_RUN_AUTH_UNINITIALIZED E2E_RUN_AUTH_UNINITIALIZED_AND_CLEANUP T10_STATE_CAPTURE_ACCOUNT_COUNT T10_STATE_CAPTURE_ALERT_TEXT T10_STATE_CAPTURE_BUILD_ID_EMPTY T10_STATE_CAPTURE_BUILD_ID_MISSING T10_STATE_CAPTURE_CARRIER_MISSING T10_STATE_CAPTURE_DIRTY_TRACKED T10_STATE_CAPTURE_GIT_MISSING T10_STATE_CAPTURE_MASK_BINDING T10_STATE_CAPTURE_MASK_DRIFT T10_STATE_CAPTURE_MASK_OUTSIDE T10_STATE_CAPTURE_MASK_UNPROVEN T10_STATE_CAPTURE_NET_ERROR_UNKNOWN T10_STATE_CAPTURE_PNG_HEIGHT T10_STATE_CAPTURE_PNG_INVALID T10_STATE_CAPTURE_SCROLL T10_STATE_CAPTURE_SHA_MISMATCH T10_STATE_CAPTURE_SOURCE_MISSING T10_STATE_EVIDENCE_OUTSIDE_UPLOAD T10_STATE_EVIDENCE_SIZE_MISMATCH'
            detail_ok='^report=ok case=[1-4] failed=[1-4] skipped=[0-4] shape=(all_failed|no_skips|has_skips) code=(none|T10_STATE_[A-Z0-9_]{1,48}|E2E_RUN_AUTH_[A-Z0-9_]{1,48}) (expect=status3d value=[1-5][0-9]{2}|expect=none value=none)$'
            detail_pass='^report=ok case=0 failed=0 skipped=[0-4] shape=none code=none expect=none value=none$'
            detail_bad='^report=(missing|invalid|non_target|multi_project|no_tests|count_mismatch) case=0 failed=0 skipped=0 shape=none code=none expect=none value=none$'
            if [[ "$detail" =~ $detail_ok || "$detail" =~ $detail_pass ]]; then
              if [[ "$detail" =~ ^report=ok\ case=([0-4])\ failed=([0-4])\ skipped=([0-4])\ shape=([a-z_]+)\  ]]; then
                detail_failed=${BASH_REMATCH[2]}
                detail_skipped=${BASH_REMATCH[3]}
                detail_shape=${BASH_REMATCH[4]}
                if (( detail_failed + detail_skipped > 4 )); then
                  detail=$detail_fallback
                else
                  if (( detail_failed == 0 )); then detail_want=none
                  elif (( detail_failed == 4 )); then detail_want=all_failed
                  elif (( detail_skipped == 0 )); then detail_want=no_skips
                  else detail_want=has_skips; fi
                  [[ "$detail_shape" == "$detail_want" ]] || detail=$detail_fallback
                fi
              else
                detail=$detail_fallback
              fi
            elif [[ ! "$detail" =~ $detail_bad ]]; then
              detail=$detail_fallback
            fi
            detail_code=${detail#* code=}
            detail_code=${detail_code%% *}
            [[ "$detail_code" == none || " $detail_codes " == *" $detail_code "* ]] || detail=$detail_fallback
            printf '%s\n' "$detail" > "$receipt/detail.txt"
            printf 'T10_PLAYWRIGHT_DETAIL %s\n' "$detail" >&4
            exit 1
          fi

          phase=check-run
          sha256sum --strict -c "$private/carrier.sha256"
          printf '%s  %s\n' "$T10_APPROVED_MANIFEST_SHA" "$T10_APPROVED_MANIFEST" | sha256sum --strict -c -
          sha256sum --strict -c "$T10_APPROVED_MANIFEST"
          printf '%s  %s\n' "$T10_TOOLS_MANIFEST_SHA" "$T10_TOOLS_MANIFEST" | sha256sum --strict -c -
          sha256sum --strict -c "$T10_TOOLS_MANIFEST"
          git diff --quiet HEAD --
          run=$(python3 -B "$T10_SELECT_RUN" "$private/playwright.log" "$raw")
          python3 -B "$T10_CHECKER" --run "$run" --expect-sha "$head" --expect-tree "$tree" \
            --expect-build-id "$build_id" --repo "$GITHUB_WORKSPACE" --out "$private/check-run.json" \
            > "$private/check-run.log" 2>&1

          phase=publish-gate
          # The independently re-reviewed admission command must validate exact names, fields, image integrity and privacy before writing this directory.
          publish="$RUNNER_TEMP/t10-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -B "$T10_EVIDENCE_ADMISSION" --run "$run" --check "$private/check-run.json" --out "$publish"
          [[ -d "$publish" && ! -L "$publish" ]]
          [[ -f "$publish/m5t10-STATE-RUN.json" && ! -L "$publish/m5t10-STATE-RUN.json" ]]
          for state in empty loading load-failed retry-recovered saved; do
            for viewport in 1920x1080 1440x900 390x844; do
              png="$publish/state-$state-$viewport.png"
              [[ -s "$png" && ! -L "$png" ]]
            done
          done
          [[ $(find "$publish" -mindepth 1 -printf x | wc -c) -eq 16 ]]
          printf 'cases_total=4\ncases_passed=4\ncases_skipped=0\nscreenshots=15\n' > "$receipt/counts.txt"
          phase=complete
      # Fixed status receipt includes bounded Playwright diagnostics on aggregate capture failure.
      # The three evidence gates and the success-only evidence upload are independent of this diagnostic.
      - name: Upload T10 receipt (fixed status only)
        if: ${{ !cancelled() && (steps.t10_capture.outcome == 'success' || steps.t10_capture.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: t10-receipt
          path: ${{ runner.temp }}/t10-receipt-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error
      # Admitted evidence: exactly the 16 files the step above verified in its own empty exclusive directory (15 named PNG +
      # m5t10-STATE-RUN.json). Only after t10_capture itself succeeded; a missing directory or file is an error, never a warning.
      # Raw e2e-evidence/t10-acceptance, private check/Playwright output, traces, server log and auth fixtures are not reachable from this path.
      - name: Upload T10 admitted evidence
        if: ${{ !cancelled() && steps.t10_capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: t10-admitted-evidence
          path: ${{ runner.temp }}/t10-publish-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-smoke
          path: |
            test-results/**/standalone-smoke.json
            test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: warn
      # M3-T7 后台壳三尺寸视觉证据：成功运行也要留视频，供 PR 转 GIF。
      # 此处保留视频与已列账号/模型/规格工作流的脱敏证据；三段 HTML 和服务日志独立归档。
      # 路径只覆盖测试报告和合成状态帧，不包含系统临时目录中的私有会话缓存。
      # 同一产物同时收 M3-T21 旧询盘页脱敏 JSON/PNG 证据，不是 M3-T7 新验收。
      # M3-T24 规格编辑器：同 always 段收本卡三份脱敏 JSON 与四帧 PNG（列表/表单/已保存/返回）；
      # spec-video 的 .webm 已由上面的 *.webm 覆盖，不重复登记。仅加路径，不改门禁/retention。
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-t7-visual
          path: |
            test-results/**/*.webm
            test-results/**/admin-account-density.json
            test-results/**/admin-account-cleared.json
            test-results/**/admin-legacy-inquiries*.json
            test-results/**/inquiry-visual-*.png
            test-results/**/admin-legacy-specs.json
            test-results/**/admin-legacy-specs-visual.json
            test-results/**/admin-legacy-specs-states.json
            test-results/**/specs-*.png
            test-results/**/admin-legacy-model.json
            test-results/**/model-workflow-*.png
          retention-days: 1
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-evidence/
            !e2e-evidence/t10-acceptance/**
            ${{ (steps.t10_capture.outcome == 'skipped' || steps.t10_capture.outcome == '') && '.next/standalone-server.log' || '' }}
          retention-days: 7
          if-no-files-found: warn
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
      # M4-T4 named PG evidence: one small whitelisted TSV written by the PostgreSQL step. If that
      # step failed before the projection ran there is no file; if-no-files-found: warn then
      # uploads nothing and does not fail the job. Placed last so no existing step is renumbered.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4t4-named-pg-evidence
          path: /tmp/m4t4-named.tsv
          retention-days: 7
          if-no-files-found: warn
      - name: J6 front-end seam evidence (opt-in, post-A3-summary)
        id: j6_capture
        if: ${{ success() && steps.e2e_a3_summary.outcome == 'success' }}
        timeout-minutes: 12
        shell: bash
        env:
          CRON_SECRET: ${{ env.CRON_SECRET }}
          E2E_PORT: '3100'
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
          J6_SEAM_DB_PREFIX: b10_j6_seam
          J6_SPEC_PATH: e2e/j6-frontend-seam-evidence.spec.ts
          J6_SPEC_SHA256: 68C212158889DED53D2EC183D262E64A734558EE2D917348E4582D505A3BE514
          J6_CHECKER_PATH: tests/evidence/j6-check-evidence.cjs
          J6_CHECKER_SHA256: 8298C8EA447C5CDAFE10AB270EE99749ADCE838F4361A76C3778D9C07DC907D9
        run: |
          # <<<J6-RUN-BLOCK
          set -Eeuo pipefail
          j6_stage=checkout
          j6_archive_on_exit=0
          j6_finish() {
            local status=$1
            if (( status != 0 )); then
              printf 'J6_STEP_FAILED stage=%s rc=%d\n' "$j6_stage" "$status" >&2 || true
            fi
            if (( j6_archive_on_exit )); then
              archive_j6_server_log > /dev/null 2>&1 || true
            fi
          }
          trap 'j6_finish "$?"' EXIT
          unset M5T8_TEST_DATABASE_URL M5T8_E2E_SCHEDULER T10_STATE_CAPTURE
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          j6_stage=tracking
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]
          j6_stage=private-root
          export J6_SEAM_EVIDENCE_ROOT="${RUNNER_TEMP:?}/j6-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          mkdir "$J6_SEAM_EVIDENCE_ROOT"
          export J6_SEAM_RUN_DIR="$J6_SEAM_EVIDENCE_ROOT/run"
          export PLAYWRIGHT_HTML_OUTPUT_DIR="$J6_SEAM_EVIDENCE_ROOT/html"
          archive_j6_server_log() {
            if [[ -f .next/standalone-server.log && ! -e "$J6_SEAM_EVIDENCE_ROOT/standalone-server.log" ]]; then
              mv .next/standalone-server.log "$J6_SEAM_EVIDENCE_ROOT/standalone-server.log"
            fi
          }
          j6_archive_on_exit=1
          j6_stage=preport
          node "$A3_DRIVER_DIR/ports.cjs" > "$J6_SEAM_EVIDENCE_ROOT/port-before.log" 2>&1
          j6_stage=stale-log
          [[ ! -e .next/standalone-server.log ]]

          # 两个跟踪落点：仓内 spec + 仓内 checker；摘要只在 env，失败关闭。
          j6_stage=tracking
          J6_DB_NAME="${J6_SEAM_DB_PREFIX:?}_${GITHUB_RUN_ID:?}_${GITHUB_RUN_ATTEMPT:?}"
          [[ "$J6_DB_NAME" =~ ^b10_j6_seam_[1-9][0-9]{0,19}_[1-9][0-9]{0,5}$ ]]
          git ls-files --error-unmatch -- "$J6_SPEC_PATH" > /dev/null
          git ls-files --error-unmatch -- "$J6_CHECKER_PATH" > /dev/null
          j6_stage=pin-spec
          sha256sum --strict -c <<< "$J6_SPEC_SHA256  $J6_SPEC_PATH" > "$J6_SEAM_EVIDENCE_ROOT/spec-sha.log"
          j6_stage=pin-checker
          sha256sum --strict -c <<< "$J6_CHECKER_SHA256  $J6_CHECKER_PATH" > "$J6_SEAM_EVIDENCE_ROOT/checker-sha.log"

          # 独占库：GitHub postgres service 的容器客户端；只 CREATE，不 DROP；Prisma DSN 只给 app/Prisma。
          j6_stage=pg-create
          [[ "${PG_CONTAINER_ID:-}" =~ ^[0-9a-f]{64}$ ]] || { printf 'J6_PG_SERVICE_ID_INVALID\n' >&2; exit 1; }
          docker exec "$PG_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE \"$J6_DB_NAME\";" > "$J6_SEAM_EVIDENCE_ROOT/pg-create.log" 2>&1
          export DATABASE_URL="postgresql://postgres:${PGPASSWORD:-postgres}@127.0.0.1:5432/${J6_DB_NAME}?schema=public"
          # 两个容器侧查询的 stderr 只落独占私有目录（不在任何上传路径）；作业日志只出固定阶段码。
          j6_stage=pg-ident-query
          J6_DIAG_DIR="$J6_SEAM_EVIDENCE_ROOT/diag"
          mkdir "$J6_DIAG_DIR"
          pg_ident_status=0
          pg_ident="$(docker exec "$PG_CONTAINER_ID" psql -U postgres -d "$J6_DB_NAME" -At -v ON_ERROR_STOP=1 \
            -c "SELECT current_database() || ':' || current_setting('server_version_num');" \
            2> "$J6_DIAG_DIR/pg-identity.err")" || pg_ident_status=$?
          if (( pg_ident_status != 0 )); then printf 'J6_PG_IDENTITY_QUERY_FAILED\n' >&2; exit "$pg_ident_status"; fi
          j6_stage=pg-ident-shape
          [[ "$pg_ident" =~ ^${J6_DB_NAME}:17[0-9]{4}$ ]]
          j6_stage=pg-cluster-query
          pg_cluster_status=0
          pg_cluster_raw="$(docker exec "$PG_CONTAINER_ID" psql -U postgres -d "$J6_DB_NAME" -At -v ON_ERROR_STOP=1 \
            -c "SELECT system_identifier::text FROM pg_control_system();" \
            2> "$J6_DIAG_DIR/pg-cluster.err")" || pg_cluster_status=$?
          if (( pg_cluster_status != 0 )); then printf 'J6_PG_CLUSTER_QUERY_FAILED\n' >&2; exit "$pg_cluster_status"; fi
          j6_stage=pg-cluster-shape
          [[ "$pg_cluster_raw" =~ ^[0-9]{1,20}$ ]]
          pg_cluster_sha="$(printf '%s' "$pg_cluster_raw" | sha256sum | cut -d' ' -f1 | tr 'a-f' 'A-F')"
          printf 'database=%s\nserver_version_num=%s\ncluster_sha256=%s\n' "${pg_ident%%:*}" "${pg_ident##*:}" "$pg_cluster_sha" \
            > "$J6_SEAM_EVIDENCE_ROOT/pg-identity.txt"
          j6_stage=prisma
          pnpm prisma db push --skip-generate > "$J6_SEAM_EVIDENCE_ROOT/prisma-push.log" 2>&1

          j6_stage=playwright
          set +e
          CI=1 J6_SEAM_EVIDENCE=1 pnpm test:e2e "$J6_SPEC_PATH" \
            --project=chromium --workers=1 --retries=0 \
            --output "$J6_SEAM_EVIDENCE_ROOT/test-results" \
            > "$J6_SEAM_EVIDENCE_ROOT/playwright.log" 2>&1
          pw_status=$?
          set -Eeuo pipefail
          j6_stage=server-log
          archive_j6_server_log > /dev/null 2>&1 || {
            archive_status=$?
            if (( pw_status != 0 )); then
              j6_stage=playwright
              exit "$pw_status"
            fi
            exit "$archive_status"
          }
          j6_stage=post-port
          port_after_status=0
          node "$A3_DRIVER_DIR/ports.cjs" > "$J6_SEAM_EVIDENCE_ROOT/port-after.log" 2>&1 || port_after_status=$?
          stage_exit_status=0
          printf 'pw_exit=%s\nport_after_exit=%s\n' "$pw_status" "$port_after_status" > "$J6_SEAM_EVIDENCE_ROOT/stage-exit.txt" || stage_exit_status=$?
          if (( pw_status != 0 )); then
            j6_stage=playwright
            exit "$pw_status"
          fi
          if (( port_after_status != 0 )); then exit "$port_after_status"; fi
          if (( stage_exit_status != 0 )); then
            j6_stage=post-status
            exit "$stage_exit_status"
          fi
          j6_stage=server-log
          [[ -s "$J6_SEAM_EVIDENCE_ROOT/standalone-server.log" ]]

          # 应用侧（spec 的 Prisma 连接）三元组必须与 service 侧独立读取逐字段相等；拒额外键与原始标识。
          j6_stage=run-pg
          run_pg_status=0
          run_pg="$(node -e '
          const fs = require("node:fs");
          const diag = process.argv[2];
          const fail = (code, err) => {
            try { fs.appendFileSync(diag, code + "\n" + (err && err.stack ? err.stack : String(err)) + "\n"); } catch {}
            console.error(code);
            process.exit(1);
          };
          let run;
          try { run = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
          catch (e) { fail("J6_RUN_READ_INVALID", e); }
          const pg = run?.evidence?.db?.pg;
          if (!pg) { console.error("J6_RUN_PG_MISSING"); process.exit(3); }
          if (JSON.stringify(Object.keys(pg).sort()) !== JSON.stringify(["clusterSha256", "database", "serverVersionNum"])) {
            console.error("J6_RUN_PG_SHAPE"); process.exit(3);
          }
          process.stdout.write([pg.database, pg.serverVersionNum, pg.clusterSha256].join("\n"));
          ' "$J6_SEAM_RUN_DIR/RUN.json" "$J6_DIAG_DIR/run-read.err")" || run_pg_status=$?
          if (( run_pg_status != 0 )); then exit "$run_pg_status"; fi
          expected_pg="$(printf '%s\n%s\n%s\n' "${pg_ident%%:*}" "${pg_ident##*:}" "$pg_cluster_sha")"
          [[ "$run_pg" == "$expected_pg" ]] || { printf 'J6_PG_TRIPLE_MISMATCH\n' >&2; exit 1; }

          j6_stage=checker
          node "$J6_CHECKER_PATH" \
            --run "$J6_SEAM_RUN_DIR" \
            --expect-sha "$GITHUB_SHA" \
            --expect-tree "$(git rev-parse 'HEAD^{tree}')" \
            --expect-build-id "$(<.next/standalone/.next/BUILD_ID)" \
            --repo "$PWD" \
            --spec "$J6_SPEC_PATH" \
            --expect-run "$GITHUB_RUN_ID" \
            --expect-attempt "$GITHUB_RUN_ATTEMPT" \
            --expect-job "$GITHUB_JOB" \
            --expect-workflow "$GITHUB_WORKFLOW" \
            --expect-ref "$GITHUB_REF" \
            --expect-pg-database "${pg_ident%%:*}" \
            --expect-pg-version "${pg_ident##*:}" \
            --expect-pg-cluster "$pg_cluster_sha" \
            --out "$J6_SEAM_RUN_DIR/CHECK-EVIDENCE.json" \
            --receipt "$J6_SEAM_RUN_DIR/RUNNER-RECEIPT.json" \
            > "$J6_SEAM_EVIDENCE_ROOT/checker.log" 2>&1

          j6_stage=staging
          for name in RUN.json CHECK-EVIDENCE.json RUNNER-RECEIPT.json; do
            [[ -f "$J6_SEAM_RUN_DIR/$name" && -s "$J6_SEAM_RUN_DIR/$name" && ! -L "$J6_SEAM_RUN_DIR/$name" ]]
          done
          j6_stage=publish
          PUBLISH_DIR="${RUNNER_TEMP:?}/j6-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$PUBLISH_DIR"
          [[ -d "$PUBLISH_DIR" && ! -L "$PUBLISH_DIR" ]]
          for name in RUN.json CHECK-EVIDENCE.json RUNNER-RECEIPT.json; do
            cp "$J6_SEAM_RUN_DIR/$name" "$PUBLISH_DIR/$name"
          done
          [[ "$(find "$PUBLISH_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3 ]]
          printf 'J6_PG_SERVICE container_id=%s database=%s server_version_num=%s cluster_sha256=%s\n' \
            "$PG_CONTAINER_ID" "${pg_ident%%:*}" "${pg_ident##*:}" "$pg_cluster_sha"
          # >>>J6-RUN-BLOCK
      - name: Upload J6 admitted seam evidence
        if: ${{ success() && steps.j6_capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: j6-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/j6-publish-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error

  # Ubuntu 上名单内的安全用例必须实跑并通过。缺符号链接、POSIX 路径或 0600 时测试记 skip，作业不能算通过。
      # J7 同构建证据（runner/观测接口；probe 与 receipt 生产器由 QA 维护，本片段不动它们）。
      # 位置：e2e job 末尾、旧广域上传（playwright-report / m4t4-named-pg-evidence）之后；
      # 若 J6 已在该作业内，必须再排在 J6 之后（T10 → J6 → J7 串行，3100 同一时刻只有一个持有者）。
      # 门保持 T10 已审的汇总成功：success() && steps.e2e_a3_summary.outcome == 'success'。
      # 步骤自身 10 分钟上限；本体 540s 内部预算 + 60s finalize（停服/DROP/端口回收）。
      # 正式门只收 j7-probe/3 + failureAttribution；/2 仅离线复跑，不进正式上传。
      # 只写 e2e-evidence/j7 的三份固定安全文件；retryable 独立落 $RUNNER_TEMP 并单独命名上传。
      - name: J7 同构建探针与清理观测（独占 PG17 空库 + 真实鉴权生产者）
        id: j7_probe
        if: ${{ success() && steps.e2e_partition.outcome == 'success' && steps.e2e_a3_summary.outcome == 'success' }}
        shell: bash
        timeout-minutes: 10
        env:
          J7_STEP_CAP_MINUTES: '10'
          J7_STEP_BUDGET_S: '540'
          J7_FINALIZE_RESERVE_S: '60'
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          #!/usr/bin/env bash
          # J7 同构建探针 runner（CI/e2e 步骤内联体；本文件就是 run: | 去 10 空格缩进后的原字节）。
          #
          # 位置（唯一允许）：e2e job 末尾，旧广域上传（playwright-report、m4t4-named-pg-evidence）之后；
          # 若 J6 步骤已在该作业内，则必须排在 J6 之后（T10 → J6 → J7 串行，3100 同一时刻只有一个持有者）。
          # 门（步骤级）：success() && steps.e2e_partition.outcome == 'success' && steps.e2e_a3_summary.outcome == 'success'
          # 正式门只收 `j7-probe/3` + failureAttribution；`/2` 仅离线复跑（--mode offline --allow-legacy），不进正式上传。
          # 步骤自身 timeout-minutes: 10；本体内预算 540s，另留 60s finalize（停服/DROP/端口回收）。
          #
          # 观测纪律：
          #   - 3100/3999 只用 A3 已受审的真绑定探针 ports.cjs（E2E_PORT=3100，成功退出 0 才算空闲）；
          #     3101 用同形内联探针。命令失败（rc!=0）一律不算空闲/释放，按固定码失败。
          #   - during 不只证明"端口被占"，还要证明监听 socket 属于本步骤拉起的 PID（/proc 归属）；
          #     3999 单独被占不成立。
          #   - PG 身份（精确版本、cluster 摘要、full/fresh 库名）由容器内独立读取，再与两份报告对账。
          #   - 只启停本步骤自己拉起的 PID；不 stop/伪造 PG 服务（hosted postgres 服务属 runner）。
          #   - 只建、只删本步骤成功 CREATE 的唯一空库 e2e_j7_<12hex>；JobState/业务行只由真实 HTTP 产生。
          #   - retryable 在主报告写妥、停 full 之前调用同一实例/同一库；产物独立命名上传，不进主三件。
          #   - 只写 e2e-evidence/j7 的三份固定安全文件；所有服务/探针/DB/retryable 日志只落 $RUNNER_TEMP 私有目录。
          set -Eeuo pipefail
          umask 077

          J7_STEP_CAP_MINUTES="${J7_STEP_CAP_MINUTES:-10}"
          J7_STEP_BUDGET_S="${J7_STEP_BUDGET_S:-540}"
          J7_FINALIZE_RESERVE_S="${J7_FINALIZE_RESERVE_S:-60}"
          J7_FINALIZE_CLEANUP_S="${J7_FINALIZE_CLEANUP_S:-12}"
          J7_RETRYABLE_TIMEOUT_S="${J7_RETRYABLE_TIMEOUT_S:-75}"
          J7_OBSERVE_APP_TIMEOUT_S="${J7_OBSERVE_APP_TIMEOUT_S:-30}"
          J7_RETRYABLE_INTERNAL_TIMEOUT_MS="${J7_RETRYABLE_INTERNAL_TIMEOUT_MS:-55000}"
          J7_PSQL_TIMEOUT_S="${J7_PSQL_TIMEOUT_S:-20}"
          J7_HEALTH_TIMEOUT_S="${J7_HEALTH_TIMEOUT_S:-90}"
          J7_PROBE_TIMEOUT_S="${J7_PROBE_TIMEOUT_S:-75}"
          J7_DB_PUSH_TIMEOUT_S="${J7_DB_PUSH_TIMEOUT_S:-60}"
          J7_STOP_TIMEOUT_S="${J7_STOP_TIMEOUT_S:-20}"
          J7_PORT_RELEASE_TIMEOUT_S="${J7_PORT_RELEASE_TIMEOUT_S:-20}"

          ws="${GITHUB_WORKSPACE:-}"
          if [[ -z "$ws" || ! -d "$ws" ]]; then
            printf 'J7_RUNNER_FAIL phase=preflight code=%s\n' 'J7_WORKSPACE_MISSING' >&2
            exit 2
          fi
          cd "$ws"

          evidence_dir="e2e-evidence/j7"
          report_full="$ws/$evidence_dir/j7-attribution.json"
          report_nodata="$ws/$evidence_dir/j7-nodata.json"
          cleanup_json="$ws/$evidence_dir/j7-cleanup.json"

          phase=preflight
          failures=()
          finalized=0
          in_finalize=0
          deadline_hit=false
          started=$SECONDS
          finalize_deadline_us=0
          finalize_action_deadline_us=0
          started_us=0

          full_port=3100
          nodata_port=3101
          full_pid=''
          full_alt=''
          nodata_pid=''
          nodata_alt=''
          full_health=''
          full_health_checks=0
          nodata_health=''
          nodata_health_checks=0
          full_probe_exit=''
          nodata_probe_exit=''
          full_stop_signal=''
          full_stop_pidgone=false
          full_stop_released=false
          full_stop_waited=0
          nodata_stop_signal=''
          nodata_stop_pidgone=false
          nodata_stop_released=false
          nodata_stop_waited=0
          db_created=0
          db_dropped=0
          db_gone=0
          fresh_db=''
          fresh_url=''
          pg_version=''
          pg_version_before=''
          pg_cluster_before=''
          retryable_json=''

          fact() { printf '%s\t%s\n' "$1" "$2" >> "$facts"; }

          fail() {
            local code="$1"
            failures+=("$code")
            printf 'J7_RUNNER_FAIL phase=%s code=%s\n' "$phase" "$code" >&3
            exit 1
          }

          budget_check() {
            if (( in_finalize )); then return 0; fi
            local used=$((SECONDS - started))
            if (( used > J7_STEP_BUDGET_S )); then
              deadline_hit=true
              fail "J7_BUDGET_EXCEEDED:$phase"
            fi
          }

          NOW_US=0
          J7_CLOCK_SOURCE=unknown

          j7_clock_probe() {
            local up='' rest=''
            # Production runner is Linux: /proc/uptime is CLOCK_BOOTTIME (monotonic).
            # MSYS/Cygwin exposes a slow emulated /proc/uptime, so use bash EPOCHREALTIME
            # there and record that the wall clock is not monotonic on that host.
            if [[ "$OSTYPE" != msys* && "$OSTYPE" != cygwin* && -r /proc/uptime ]]; then
              IFS=' ' read -r up rest < /proc/uptime 2>/dev/null || up=''
              if [[ "$up" =~ ^[0-9]+(\.[0-9]{1,6})?$ ]]; then
                J7_CLOCK_SOURCE=proc-uptime
                return 0
              fi
            fi
            if [[ -n "${EPOCHREALTIME:-}" ]]; then
              J7_CLOCK_SOURCE=epochrealtime
              return 0
            fi
            J7_CLOCK_SOURCE=seconds
          }

          now_us_set() {
            local up='' rest='' sec='' frac='' raw=''
            if [[ "$J7_CLOCK_SOURCE" == proc-uptime ]]; then
              IFS=' ' read -r up rest < /proc/uptime 2>/dev/null || up=''
              if [[ "$up" =~ ^([0-9]+)(\.([0-9]{1,6}))?$ ]]; then
                sec="${BASH_REMATCH[1]}"
                frac="${BASH_REMATCH[3]:-}"
                while (( ${#frac} < 6 )); do frac+='0'; done
                NOW_US=$((10#$sec * 1000000 + 10#${frac:0:6}))
                return 0
              fi
              J7_CLOCK_SOURCE=epochrealtime
            fi
            if [[ "$J7_CLOCK_SOURCE" == epochrealtime ]]; then
              raw="${EPOCHREALTIME:-}"
              if [[ -n "$raw" ]]; then
                raw="${raw//[!0-9]/}"
                NOW_US=$((10#$raw))
                return 0
              fi
              J7_CLOCK_SOURCE=seconds
            fi
            NOW_US=$((SECONDS * 1000000))
          }

          j7_clock_probe
          now_us() { now_us_set; printf '%s' "$NOW_US"; }

          sleep_us_capped() { # base_us absolute_deadline_us
            local base_us="$1" deadline_us="$2" left_us sleep_us wake_deadline_us delay
            now_us_set
            left_us=$(( deadline_us - NOW_US ))
            (( left_us <= 0 )) && return 0
            sleep_us="$base_us"
            (( sleep_us > left_us )) && sleep_us="$left_us"
            wake_deadline_us=$(( NOW_US + sleep_us ))
            if (( sleep_us < 500000 )); then
              # Short interval: poll the clock instead of paying the host's process-spawn
              # sleep latency, which would overshoot the absolute deadline.
              while :; do
                now_us_set
                (( NOW_US >= wake_deadline_us )) && break
              done
              return 0
            fi
            printf -v delay '%d.%06d' "$(( sleep_us / 1000000 ))" "$(( sleep_us % 1000000 ))"
            sleep "$delay"
          }

          run_bounded_until_us() { # absolute_deadline_us cmd...
            local deadline_us="$1"
            shift
            local pid rc=0 term_sent=0 kill_sent=0 left_us
            "$@" &
            pid=$!
            while :; do
              now_us_set
              left_us=$(( deadline_us - NOW_US ))
              if (( left_us <= 0 )); then
                kill -KILL "$pid" 2>/dev/null || true
                return 124
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" 2>/dev/null || rc=$?
                now_us_set
                if (( term_sent )) || (( NOW_US >= deadline_us )); then return 124; fi
                return "$rc"
              fi
              if (( ! term_sent )) && (( left_us <= 300000 )); then
                kill -TERM "$pid" 2>/dev/null || true
                term_sent=1
              fi
              if (( term_sent && ! kill_sent )) && (( left_us <= 100000 )); then
                kill -KILL "$pid" 2>/dev/null || true
                kill_sent=1
              fi
              sleep_us_capped 100000 "$deadline_us"
            done
          }

          run_bounded_hard_ms() { # limit_ms cmd...
            local limit_ms="$1"
            shift
            local start_us
            now_us_set
            start_us="$NOW_US"
            run_bounded_until_us "$(( start_us + limit_ms * 1000 ))" "$@"
          }

          run_bounded_hard() { # seconds cmd...
            local limit_s="$1"
            shift
            run_bounded_hard_ms "$(( limit_s * 1000 ))" "$@"
          }

          finalize_remaining_us() { now_us_set; printf '%s' "$(( finalize_action_deadline_us - NOW_US ))"; }

          finalize_bounded() { # label seconds cmd...
            local label="$1" limit="$2" rc=0 remaining_us limit_us action_deadline_us capped_us
            shift 2
            remaining_us="$(finalize_remaining_us)"
            if (( remaining_us <= 0 || remaining_us < 200000 )); then
              failures+=("J7_FINALIZE_TIMEOUT:$label")
              printf 'J7_FINALIZE_TIMEOUT:%s\n' "$label" >&2
              return 126
            fi
            limit_us=$(( limit * 1000000 ))
            now_us_set
            action_deadline_us="$finalize_action_deadline_us"
            if (( limit_us > 0 )); then
              capped_us=$(( NOW_US + limit_us ))
              (( capped_us < action_deadline_us )) && action_deadline_us="$capped_us"
            fi
            run_bounded_until_us "$action_deadline_us" "$@" || rc=$?
            if (( rc == 124 )); then
              failures+=("J7_FINALIZE_TIMEOUT:$label")
              printf 'J7_FINALIZE_TIMEOUT:%s\n' "$label" >&2
            fi
            return "$rc"
          }

          sha256_upper() { sha256sum -- "$1" | awk '{print toupper($1)}'; }

          health_once() {
            node -e '
              const http = require("node:http");
              const req = http.get(process.argv[1], { timeout: 5000 }, (res) => {
                res.resume();
                process.stdout.write(String(res.statusCode));
              });
              req.on("timeout", () => req.destroy(new Error("timeout")));
              req.on("error", () => process.stdout.write("000"));
            ' "$1" 2>/dev/null || true
          }

          wait_health() { # port pid -> HEALTH_STATUS / HEALTH_CHECKS
            local port="$1" pid="$2" i=0 status=000
            local url="http://localhost:$port/api/health"
            while (( i < J7_HEALTH_TIMEOUT_S )); do
              budget_check
              kill -0 "$pid" 2>/dev/null || fail "J7_APP_EXITED:$port"
              status="$(health_once "$url")"
              i=$((i + 1))
              if [[ "$status" == 200 ]]; then
                HEALTH_STATUS=200
                HEALTH_CHECKS=$i
                return 0
              fi
              sleep 1
            done
            HEALTH_STATUS="$status"
            HEALTH_CHECKS=$i
            fail "J7_HEALTH_TIMEOUT:$port"
          }

          start_app() { # port log [KEY=VALUE ...]
            local port="$1" log="$2"
            shift 2
            env PORT="$port" HOSTNAME=0.0.0.0 "$@" node .next/standalone/server.js >"$log" 2>&1 &
            STARTED_PID=$!
            sleep 1
            kill -0 "$STARTED_PID" 2>/dev/null || fail "J7_APP_START_FAILED:$port"
            STARTED_ALT=''
            local i=0
            while (( i < 10 )); do
              if [[ -r "/proc/$STARTED_PID/winpid" ]]; then
                STARTED_ALT="$(tr -d ' \r\n' < "/proc/$STARTED_PID/winpid")"
                [[ -n "$STARTED_ALT" ]] && break
              fi
              i=$((i + 1))
              sleep 0.2
            done
          }

          run_bounded() { # seconds cmd...
            local limit="$1"
            shift
            "$@" &
            local pid=$!
            local i=0 rc=0
            while kill -0 "$pid" 2>/dev/null; do
              if (( i >= limit )); then
                kill -TERM "$pid" 2>/dev/null || true
                sleep 2
                kill -KILL "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 124
              fi
              if (( ! in_finalize )) && (( SECONDS - started > J7_STEP_BUDGET_S )); then
                deadline_hit=true
                kill -TERM "$pid" 2>/dev/null || true
                sleep 2
                kill -KILL "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 125
              fi
              sleep 1
              i=$((i + 1))
            done
            wait "$pid" || rc=$?
            return "$rc"
          }

          psql_bounded() { # db sql outfile [timeout]
            local db="$1" sql="$2" out="$3" limit="${4:-$J7_PSQL_TIMEOUT_S}" rc=0
            run_bounded "$limit" docker exec "$PG_CONTAINER_ID" psql -U postgres -d "$db" -tAc "$sql" \
              >"$out" 2>"$out.err" || rc=$?
            if (( rc == 124 )); then fail "J7_DB_QUERY_TIMEOUT:$phase"; fi
            if (( rc == 125 )); then fail "J7_BUDGET_EXCEEDED:$phase"; fi
            return "$rc"
          }

          pg_cluster_digest() { # system_identifier -> UPPER sha256("system_identifier:<value>")
            node -e '
              const crypto = require("node:crypto");
              process.stdout.write(crypto.createHash("sha256").update("system_identifier:" + process.argv[1], "utf8").digest("hex").toUpperCase());
            ' "$1"
          }

          read_pg_identity() { # independent container read: exact version + cluster digest
            local v='' sid=''
            psql_bounded postgres "SELECT current_setting('server_version_num')" "$private/pg-version.raw" \
              || fail 'J7_DB_QUERY_FAILED'
            v="$(tr -d ' \r\n' < "$private/pg-version.raw")"
            [[ "$v" =~ ^[0-9]{5,6}$ ]] || fail 'J7_DB_VERSION_UNREADABLE'
            psql_bounded postgres "SELECT system_identifier::text FROM pg_control_system()" "$private/pg-system.raw" \
              || fail 'J7_DB_QUERY_FAILED'
            sid="$(tr -d ' \r\n' < "$private/pg-system.raw")"
            [[ "$sid" =~ ^[0-9]+$ ]] || fail 'J7_PG_SYSTEM_ID_UNREADABLE'
            PG_VERSION_NUM="$v"
            PG_SYSTEM_ID="$sid"
            PG_CLUSTER_SHA="$(pg_cluster_digest "$sid")"
            [[ "$PG_CLUSTER_SHA" =~ ^[0-9A-F]{64}$ ]] || fail 'J7_PG_CLUSTER_DIGEST_INVALID'
            fact pgServiceVersionNum "$PG_VERSION_NUM"
            fact pgServiceClusterSha256 "$PG_CLUSTER_SHA"
            fact pgSystemIdRead true
            (( 10#$PG_VERSION_NUM / 10000 == 17 )) || fail "J7_PG_MAJOR_MISMATCH:$PG_VERSION_NUM"
          }

          a3_ports_free() { E2E_PORT=3100 node "$A3_DRIVER_DIR/ports.cjs" >"$private/a3-ports.log" 2>&1; }
          port3101_free() { node "$private/j7-port-free.cjs" 127.0.0.1 3101 >"$private/port-3101.log" 2>&1; }
          port_probe() { # port
            if [[ "$1" == 3101 ]]; then port3101_free; else a3_ports_free; fi
          }
          port_probe_exec() { # port; exec so the bounded child IS the node probe
            if [[ "$1" == 3101 ]]; then
              exec node "$private/j7-port-free.cjs" 127.0.0.1 3101 >"$private/port-3101.log" 2>&1
            else
              exec env E2E_PORT=3100 node "$A3_DRIVER_DIR/ports.cjs" >"$private/a3-ports.log" 2>&1
            fi
          }
          db_push() { DATABASE_URL="$1" pnpm prisma db push --skip-generate; }

          observe_ports_before() {
            local rc=0 msg=''
            a3_ports_free || rc=$?
            if (( rc == 0 )); then
              fact port3100Before free
              fact port3999Before free
            else
              msg="$(tr -d '\r\n' < "$private/a3-ports.log")"
              if [[ "$msg" == *A3_PORT_NOT_RELEASED:3100* ]]; then fail 'J7_PORT_BUSY:3100'; fi
              if [[ "$msg" == *A3_PORT_NOT_RELEASED:3999* ]]; then fail 'J7_PORT_BUSY:3999'; fi
              fail "J7_PORT_PROBE_FAILED:3100+3999:$rc"
            fi
            rc=0
            port3101_free || rc=$?
            if (( rc == 0 )); then
              fact port3101Before free
            elif (( rc == 1 )); then
              fail 'J7_PORT_BUSY:3101'
            else
              fail "J7_PORT_PROBE_FAILED:3101:$rc"
            fi
          }

          observe_port_in_use() { # port expected-pid [alt-pid]
            local port="$1" pid="$2" alt="${3:-}" rc=0 erc=0 out="$private/port-$1-owner.out"
            if [[ "$port" == 3101 ]]; then
              port3101_free || rc=$?
            else
              a3_ports_free || rc=$?
            fi
            if (( rc == 0 )); then
              fail "J7_APP_NOT_LISTENING:$port"
            elif (( rc != 1 )); then
              fail "J7_PORT_PROBE_FAILED:$port:$rc"
            fi
            node "$private/j7-port-owner.cjs" "$port" "$pid" "$alt" >"$out" 2>"$private/port-$1-owner.err" || erc=$?
            if (( erc == 3 )); then fail "J7_PORT_OWNER_MISMATCH:$port"; fi
            if (( erc == 4 )); then fail "J7_APP_NOT_LISTENING:$port"; fi
            if (( erc != 0 )); then fail "J7_PORT_OWNER_PROBE_FAILED:$port:$erc"; fi
            local owner_pid
            owner_pid="$(sed -n 's/^pid=//p' "$out" | head -n 1)"
            [[ "$owner_pid" == "$pid" ]] || fail "J7_PORT_OWNER_MISMATCH:$port"
            fact "port${port}During" in-use
            fact "port${port}DuringPid" "$owner_pid"
            fact "port${port}DuringOwner" app
          }

          stop_instance() { # name port pid
            local name="$1" port="$2" pid="$3"
            local signal=TERM waited=0 rc=0 deadline_us=0 stop_deadline_us=0 exit_deadline_us=0 term_deadline_us=0
            local pidgone=false probed=false released=false sleep_us=1000000 stop_started_us=0 waited_ms=0
            STOP_CODE=''
            now_us_set
            stop_started_us="$NOW_US"
            (( in_finalize )) && sleep_us=200000
            if (( in_finalize )); then stop_deadline_us="$finalize_action_deadline_us"; fi
            if kill -0 "$pid" 2>/dev/null; then
              kill -TERM "$pid" 2>/dev/null || true
              now_us_set
              term_deadline_us=$(( NOW_US + J7_STOP_TIMEOUT_S * 1000000 ))
              if (( in_finalize )) && (( term_deadline_us > stop_deadline_us )); then term_deadline_us="$stop_deadline_us"; fi
              while kill -0 "$pid" 2>/dev/null; do
                now_us_set
                if (( in_finalize )); then
                  if (( NOW_US >= stop_deadline_us )); then
                    STOP_CODE="J7_FINALIZE_TIMEOUT:stop-${name}"
                    break
                  fi
                  if (( NOW_US >= term_deadline_us )); then
                    break
                  fi
                  sleep_us_capped "$sleep_us" "$term_deadline_us"
                else
                  if (( waited >= J7_STOP_TIMEOUT_S )); then
                    break
                  fi
                  sleep "$(( sleep_us / 1000000 ))"
                fi
                waited=$((waited + 1))
                budget_check
              done
              if [[ "$STOP_CODE" != J7_FINALIZE_TIMEOUT:* ]] && kill -0 "$pid" 2>/dev/null; then
                signal=KILL
                kill -KILL "$pid" 2>/dev/null || true
                waited=0
                if (( in_finalize )); then
                  exit_deadline_us="$stop_deadline_us"
                else
                  now_us_set
                  exit_deadline_us=$(( NOW_US + 10000000 ))
                fi
                while kill -0 "$pid" 2>/dev/null; do
                  now_us_set
                  if (( in_finalize )); then
                    if (( NOW_US >= exit_deadline_us )); then
                      STOP_CODE="J7_FINALIZE_TIMEOUT:stop-${name}"
                      break
                    fi
                    sleep_us_capped "$sleep_us" "$exit_deadline_us"
                  else
                    if (( waited >= 10 )); then
                      break
                    fi
                    sleep 1
                  fi
                  waited=$((waited + 1))
                done
              fi
            fi
            if kill -0 "$pid" 2>/dev/null; then
              pidgone=false
            else
              pidgone=true
              wait "$pid" 2>/dev/null || true
            fi
            if [[ "$pidgone" == true && "$STOP_CODE" != J7_FINALIZE_TIMEOUT:* ]]; then
              now_us_set
              deadline_us=$(( NOW_US + J7_PORT_RELEASE_TIMEOUT_S * 1000000 ))
              if (( in_finalize )) && (( deadline_us > stop_deadline_us )); then deadline_us="$stop_deadline_us"; fi
              while :; do
                now_us_set
                if (( in_finalize )) && (( NOW_US >= deadline_us )); then
                  STOP_CODE="J7_FINALIZE_TIMEOUT:stop-${name}"
                  break
                fi
                rc=0
                probed=true
                if (( in_finalize )); then
                  run_bounded_until_us "$deadline_us" port_probe_exec "$port" || rc=$?
                else
                  port_probe "$port" || rc=$?
                fi
                (( rc == 0 )) && break
                now_us_set
                if (( in_finalize )); then
                  (( NOW_US < deadline_us )) || { STOP_CODE="J7_FINALIZE_TIMEOUT:stop-${name}"; break; }
                  sleep_us_capped "$sleep_us" "$deadline_us"
                else
                  (( NOW_US < deadline_us )) || break
                  sleep 1
                fi
                budget_check
              done
            fi
            if [[ "$STOP_CODE" == J7_FINALIZE_TIMEOUT:* ]]; then
              if kill -0 "$pid" 2>/dev/null; then signal=KILL; fi
              kill -KILL "$pid" 2>/dev/null || true
            fi
            if [[ "$pidgone" == true && "$probed" == true ]] && (( rc == 0 )); then
              released=true
            fi
            now_us_set
            waited_ms=$(( (NOW_US - stop_started_us) / 1000 ))
            printf '%s\t%s\n' "${name}StopSignal" "$signal" >> "$facts"
            printf '%s\t%s\n' "${name}PidGone" "$pidgone" >> "$facts"
            printf '%s\t%s\n' "${name}PortReleased" "$released" >> "$facts"
            printf '%s\t%s\n' "${name}StopWaitedMs" "$waited_ms" >> "$facts"
            printf 'J7_APP_STOP port=%s signal=%s pidGone=%s portReleased=%s waitedMs=%s\n' \
              "$port" "$signal" "$pidgone" "$released" "$waited_ms"
            if [[ "$STOP_CODE" == J7_FINALIZE_TIMEOUT:* ]]; then return 1; fi
            if [[ "$pidgone" != true ]]; then STOP_CODE="J7_STOP_PID_ALIVE:$port"; return 1; fi
            if [[ "$released" != true ]]; then STOP_CODE="J7_PORT_NOT_RELEASED:$port"; return 1; fi
            return 0
          }

          observe_ports_after() {
            local rc=0 msg='' deadline=0
            deadline=$((SECONDS + J7_PORT_RELEASE_TIMEOUT_S))
            while :; do
              rc=0
              a3_ports_free || rc=$?
              (( rc == 0 )) && break
              (( SECONDS < deadline )) || break
              budget_check
              sleep 1
            done
            if (( rc == 0 )); then
              fact port3100After free
              fact port3999After free
              fact port3100AfterProbeExit 0
              fact port3999AfterProbeExit 0
            else
              msg="$(tr -d '\r\n' < "$private/a3-ports.log")"
              if [[ "$msg" == *A3_PORT_NOT_RELEASED:3100* ]]; then fail 'J7_PORT_NOT_RELEASED:3100'; fi
              if [[ "$msg" == *A3_PORT_NOT_RELEASED:3999* ]]; then fail 'J7_PORT_NOT_RELEASED:3999'; fi
              fail "J7_PORT_PROBE_FAILED:3100+3999:$rc"
            fi
            rc=0
            deadline=$((SECONDS + J7_PORT_RELEASE_TIMEOUT_S))
            while :; do
              port3101_free || rc=$?
              (( rc == 0 )) && break
              (( rc != 1 )) && fail "J7_PORT_PROBE_FAILED:3101:$rc"
              (( SECONDS < deadline )) || break
              budget_check
              sleep 1
            done
            if (( rc == 0 )); then
              fact port3101After free
              fact port3101AfterProbeExit 0
            else
              fail 'J7_PORT_NOT_RELEASED:3101'
            fi
          }

          write_cleanup() { # outcome
            local outcome="$1" rc=0
            fact outcome "$outcome"
            fact phase "$phase"
            fact failureCodes "$(IFS=,; printf '%s' "${failures[*]:-}")"
            fact elapsedMs "$(((SECONDS - started) * 1000))"
            fact deadlineHit "$deadline_hit"
            fact stepCapMinutes "$J7_STEP_CAP_MINUTES"
            fact budgetSeconds "$J7_STEP_BUDGET_S"
            fact finalizeReserveSeconds "$J7_FINALIZE_RESERVE_S"
            if (( in_finalize )); then
              local saved_action_deadline_us="$finalize_action_deadline_us"
              finalize_action_deadline_us="$finalize_deadline_us"
              finalize_bounded cleanup-json "$J7_FINALIZE_CLEANUP_S" node "$private/j7-observe.cjs" cleanup \
                --facts "$facts" --evidence-dir "$ws/$evidence_dir" --a3-dir "$ws/e2e-evidence" \
                --out "$cleanup_json" >"$private/cleanup.out" 2>"$private/cleanup.err" || rc=$?
              finalize_action_deadline_us="$saved_action_deadline_us"
            else
              run_bounded "$J7_FINALIZE_CLEANUP_S" node "$private/j7-observe.cjs" cleanup \
                --facts "$facts" --evidence-dir "$ws/$evidence_dir" --a3-dir "$ws/e2e-evidence" \
                --out "$cleanup_json" >"$private/cleanup.out" 2>"$private/cleanup.err" || rc=$?
            fi
            if (( rc == 124 )); then
              failures+=('J7_CLEANUP_JSON_FAILED')
              return 1
            fi
            (( rc == 0 )) || return 1
            return 0
          }

          on_exit() {
            local rc=$?
            if (( finalized )); then return 0; fi
            finalized=1
            in_finalize=1
            local on_exit_us step_cap_us
            on_exit_us="$(now_us)"
            finalize_deadline_us=$(( on_exit_us + J7_FINALIZE_RESERVE_S * 1000000 ))
            step_cap_us=$(( started_us + (J7_STEP_BUDGET_S + J7_FINALIZE_RESERVE_S) * 1000000 ))
            (( finalize_deadline_us > step_cap_us )) && finalize_deadline_us="$step_cap_us"
            finalize_action_deadline_us=$(( finalize_deadline_us - J7_FINALIZE_CLEANUP_S * 1000000 ))
            (( finalize_action_deadline_us < on_exit_us )) && finalize_action_deadline_us="$on_exit_us"
            set +e
            if [[ -n "$full_pid" ]] && kill -0 "$full_pid" 2>/dev/null; then
              stop_instance full "$full_port" "$full_pid" || { failures+=("${STOP_CODE:-J7_STOP_FAILED:full}"); printf '%s\n' "${STOP_CODE:-J7_STOP_FAILED:full}" >&2; }
            fi
            if [[ -n "$nodata_pid" ]] && kill -0 "$nodata_pid" 2>/dev/null; then
              stop_instance nodata "$nodata_port" "$nodata_pid" || { failures+=("${STOP_CODE:-J7_STOP_FAILED:nodata}"); printf '%s\n' "${STOP_CODE:-J7_STOP_FAILED:nodata}" >&2; }
            fi
            if (( db_created )) && (( ! db_dropped )) && [[ -n "$fresh_db" ]]; then
              local drop_rc=0 count_rc=0 count_out=''
              finalize_bounded drop "$J7_PSQL_TIMEOUT_S" docker exec "$PG_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
                -c "DROP DATABASE \"$fresh_db\"" >"$private/drop-fallback.log" 2>&1 || drop_rc=$?
              if (( drop_rc == 0 )); then
                db_dropped=1
                fact freshDbDropped true
                count_rc=0
                finalize_bounded count "$J7_PSQL_TIMEOUT_S" docker exec "$PG_CONTAINER_ID" psql -U postgres -d postgres -tAc \
                  "SELECT count(*) FROM pg_database WHERE datname = '$fresh_db'" \
                  >"$private/drop-count.out" 2>"$private/drop-count.err" || count_rc=$?
                count_out="$(cat "$private/drop-count.out" 2>/dev/null || true)"
                if (( count_rc == 0 )); then
                  if [[ "$(printf '%s' "$count_out" | tr -d ' \r\n')" == 0 ]]; then
                    db_gone=1
                    fact freshDbGone true
                  else
                    failures+=('J7_DB_DROP_VERIFY_FAILED')
                  fi
                elif (( count_rc != 124 && count_rc != 126 )); then
                  failures+=('J7_DB_DROP_VERIFY_FAILED')
                fi
              elif (( drop_rc != 124 && drop_rc != 126 )); then
                failures+=('J7_DB_DROP_FAILED')
              fi
            fi
            if [[ -z "${port3100After:-}" ]]; then
              if finalize_bounded ports-3100 5 a3_ports_free; then
                fact port3100After free
                fact port3999After free
              else
                fact port3100After unknown
                fact port3999After unknown
              fi
            fi
            if [[ -z "${port3101After:-}" ]]; then
              if finalize_bounded ports-3101 5 port3101_free; then fact port3101After free; else fact port3101After unknown; fi
            fi
            case " ${failures[*]:-} " in
              *J7_SAFE_FILES_*) phase=verify ;;
            esac
            write_cleanup failure || failures+=('J7_CLEANUP_JSON_FAILED')
            printf 'J7_RUNNER_EXIT rc=%s phase=%s\n' "$rc" "$phase" >&3
            exit "$rc"
          }

          started_us="$(now_us)"

          if [[ -z "${RUNNER_TEMP:-}" || ! -d "${RUNNER_TEMP:-}" ]]; then
            printf 'J7_RUNNER_FAIL phase=preflight code=%s\n' 'J7_RUNNER_TEMP_MISSING' >&2
            exit 2
          fi
          private="$(mktemp -d "$RUNNER_TEMP/j7-private.XXXXXXXX")" || exit 2
          facts="$private/facts.tsv"
          : > "$facts"
          exec 3>&2
          trap 'on_exit' EXIT

          for tool in node git docker pnpm sha256sum openssl sed grep awk; do
            command -v "$tool" >/dev/null 2>&1 || fail "J7_TOOL_MISSING:$tool"
          done
          [[ "${PG_CONTAINER_ID:-}" =~ ^[0-9a-f]{64}$ ]] || fail 'J7_PG_CONTAINER_ID_INVALID'
          fact runner "${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"
          fact runnerClock "$J7_CLOCK_SOURCE"
          fact job "${GITHUB_JOB:-unknown}"
          fact event "${GITHUB_EVENT_NAME:-unknown}"
          fact repository "${GITHUB_REPOSITORY:-unknown}"
          fact ref "${GITHUB_REF:-unknown}"
          fact githubSha "${GITHUB_SHA:-unknown}"
          fact runId "${GITHUB_RUN_ID:-0}"
          fact runAttempt "${GITHUB_RUN_ATTEMPT:-0}"

          # 0) 证据目录必须是干净的：本步骤只允许产出三份固定安全文件。
          mkdir -p "$evidence_dir"
          [[ -z "$(ls -A "$evidence_dir")" ]] || fail 'J7_PREFLIGHT_EVIDENCE_NOT_EMPTY'
          for name in j7-attribution.json j7-nodata.json j7-cleanup.json; do
            [[ ! -e "$evidence_dir/$name" && ! -L "$evidence_dir/$name" ]] || fail "J7_PREFLIGHT_EVIDENCE_EXISTS:$name"
          done

          # 1) 旧 A3 端口/结果证据必须实际存在且 release_exit=0；缺一件即拒（不靠 J7 自己再猜）。
          for segment in main model consent errors flow; do
            result="e2e-evidence/$segment/result.txt"
            port_after="e2e-evidence/$segment/port-after.log"
            [[ -f "$result" && ! -L "$result" && -s "$result" ]] || fail "J7_A3_EVIDENCE_MISSING:$segment:result"
            [[ -f "$port_after" && ! -L "$port_after" ]] || fail "J7_A3_EVIDENCE_MISSING:$segment:port-after"
            grep -qx 'release_exit=0' "$result" || fail "J7_A3_EVIDENCE_RELEASE:$segment"
            grep -qx 'test_exit=0' "$result" || fail "J7_A3_EVIDENCE_TEST:$segment"
          done

          # 2) 同一 e2e test 构建（不是 build-and-audit 的 original/production 构建）。
          [[ -s .next/standalone/server.js && ! -L .next/standalone/server.js ]] || fail 'J7_BUILD_MISSING:server'
          [[ -s .next/standalone/.next/BUILD_ID && ! -L .next/standalone/.next/BUILD_ID ]] || fail 'J7_BUILD_MISSING:build-id'
          build_id="$(tr -d '\r\n' < .next/standalone/.next/BUILD_ID)"
          [[ "$build_id" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || fail 'J7_BUILD_ID_INVALID'
          server_bytes="$(wc -c < .next/standalone/server.js | tr -d ' ')"
          server_sha="$(sha256_upper .next/standalone/server.js)"
          app_env="$(node -e '
            const fs = require("node:fs");
            const source = fs.readFileSync(process.argv[1], "utf8");
            const values = [...source.matchAll(/"APP_ENV_AT_BUILD":"([^"]*)"/g)].map((hit) => hit[1]);
            if (!values.length) process.exit(1);
            process.stdout.write([...new Set(values)].join(","));
          ' .next/standalone/server.js)" || fail 'J7_APP_ENV_MARKER_MISSING'
          head="$(git rev-parse --verify HEAD)"
          tree="$(git rev-parse --verify 'HEAD^{tree}')"
          [[ "$head" =~ ^[0-9a-f]{40}$ && "$tree" =~ ^[0-9a-f]{40}$ ]] || fail 'J7_GIT_ID_INVALID'
          [[ "$head" == "${GITHUB_SHA:-}" ]] || fail 'J7_HEAD_MISMATCH'
          fact buildId "$build_id"
          fact serverJsBytes "$server_bytes"
          fact serverJsSha256 "$server_sha"
          fact appEnvAtBuild "$app_env"
          fact head "$head"
          fact tree "$tree"
          printf 'J7_RUN_CONTEXT={"runId":%s,"runAttempt":%s,"job":"%s","head":"%s","tree":"%s","buildId":"%s"}\n' \
            "${GITHUB_RUN_ID:-0}" "${GITHUB_RUN_ATTEMPT:-0}" "${GITHUB_JOB:-unknown}" "$head" "$tree" "$build_id"

          # 3) 真实鉴权生产者所需的 TOTP 种子只从受审 e2e/run-auth.ts 读，不进 workflow。
          totp="$(sed -n "s/.*RUN_AUTH_TOTP *= *'\([A-Z2-7=]*\)'.*/\1/p" e2e/run-auth.ts | head -n 1 | tr -d '=')"
          [[ "$totp" =~ ^[A-Z2-7]{16,}$ ]] || fail 'J7_TOTP_SOURCE_MISSING'
          cat > "$private/j7-port-free.cjs" <<'PORT_FREE_EOF'
          'use strict';
          // 3101 的 tcp-connect 观测：连上=被占，ECONNREFUSED=空闲，其余/超时=探针失败（不算空闲）。
          const net = require('node:net');
          const host = process.argv[2];
          const port = Number(process.argv[3]);
          if (!host || !Number.isInteger(port) || port < 1 || port > 65535) {
            console.error('J7_PORT_PROBE_ARGS');
            process.exit(2);
          }
          const socket = net.connect({ host, port });
          socket.setTimeout(2000);
          socket.once('connect', () => {
            socket.destroy();
            console.error(`J7_PORT_BUSY:${port}`);
            process.exit(1);
          });
          socket.once('timeout', () => {
            socket.destroy();
            console.error(`J7_PORT_PROBE_ERROR:${port}:TIMEOUT`);
            process.exit(2);
          });
          socket.once('error', (error) => {
            if (error && error.code === 'ECONNREFUSED') process.exit(0);
            console.error(`J7_PORT_PROBE_ERROR:${port}:${error && error.code ? error.code : 'UNKNOWN'}`);
            process.exit(2);
          });
          PORT_FREE_EOF

          cat > "$private/j7-port-owner.cjs" <<'PORT_OWNER_EOF'
          'use strict';
          // during 归属证明：Linux 读 /proc/net/tcp{,6} 的 LISTEN inode 再扫 /proc/<pid>/fd；
          // 没有 /proc（如 Windows 测试台）时退回 netstat -ano。
          // 0=属于期望 PID；3=被其它 PID 占用；4=没有任何监听；5=有监听但找不到 owner；2=参数/平台错误。
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const port = Number(process.argv[2]);
          const expected = Number(process.argv[3]);
          const alt = Number(process.argv[4] || 0);
          if (!Number.isInteger(port) || port < 1 || port > 65535 || !Number.isInteger(expected) || expected < 1) process.exit(2);
          const hexPort = port.toString(16).toUpperCase().padStart(4, '0');

          function procOwners() {
            if (!fs.existsSync('/proc/net/tcp')) return null;
            const inodes = new Set();
            for (const file of ['/proc/net/tcp', '/proc/net/tcp6']) {
              let text = '';
              try {
                text = fs.readFileSync(file, 'utf8');
              } catch {
                continue;
              }
              for (const line of text.split('\n').slice(1)) {
                const cols = line.trim().split(/\s+/);
                if (cols.length < 10) continue;
                const localPort = (cols[1] || '').split(':').pop();
                if (cols[3] !== '0A' || localPort !== hexPort || cols[9] === '0') continue;
                inodes.add(cols[9]);
              }
            }
            if (!inodes.size) return new Set();
            const owners = new Set();
            for (const pid of fs.readdirSync('/proc')) {
              if (!/^[0-9]+$/.test(pid)) continue;
              let fds = [];
              try {
                fds = fs.readdirSync(`/proc/${pid}/fd`);
              } catch {
                continue;
              }
              for (const fd of fds) {
                let target = '';
                try {
                  target = fs.readlinkSync(`/proc/${pid}/fd/${fd}`);
                } catch {
                  continue;
                }
                const match = /^socket:\[(\d+)\]$/.exec(target);
                if (match && inodes.has(match[1])) {
                  owners.add(Number(pid));
                  break;
                }
              }
            }
            return owners;
          }

          function netstatOwners() {
            let text = '';
            try {
              text = execFileSync('netstat', ['-ano'], { encoding: 'utf8', timeout: 5000 });
            } catch {
              return null;
            }
            const owners = new Set();
            for (const line of text.split(/\r?\n/)) {
              if (!/\bTCP\b/i.test(line)) continue;
              const cols = line.trim().split(/\s+/);
              if (cols.length < 5) continue;
              const localPort = (cols[1] || '').split(':').pop();
              if (localPort !== String(port)) continue;
              const pid = Number(cols[cols.length - 1]);
              if (Number.isInteger(pid) && pid > 0) owners.add(pid);
            }
            return owners;
          }

          function winParentMap() {
            let text = '';
            try {
              text = execFileSync('ps', ['-W'], { encoding: 'utf8', timeout: 5000 });
            } catch {
              return null;
            }
            const map = new Map();
            for (const line of text.split(/\r?\n/).slice(1)) {
              const cols = line.trim().split(/\s+/);
              if (cols.length < 8) continue;
              const ppid = Number(cols[1]);
              const winpid = Number(cols[3]);
              if (Number.isInteger(winpid) && winpid > 0) map.set(winpid, Number.isInteger(ppid) ? ppid : 0);
            }
            return map;
          }

          function isDescendant(owner, roots, map) {
            let current = owner;
            for (let depth = 0; depth < 8 && current; depth += 1) {
              if (roots.has(current)) return true;
              current = map.get(current) || 0;
            }
            return false;
          }

          const proc = procOwners();
          const owners = proc || netstatOwners();
          if (!owners) process.exit(2);
          if (!owners.size) process.exit(4);
          const roots = new Set([expected]);
          if (alt > 0) roots.add(alt);
          if (owners.has(expected) || (alt > 0 && owners.has(alt))) {
            process.stdout.write(`pid=${expected}\n`);
            process.exit(0);
          }
          if (!proc) {
            const map = winParentMap();
            if (map && [...owners].some((owner) => isDescendant(owner, roots, map))) {
              process.stdout.write(`pid=${expected}\n`);
              process.exit(0);
            }
          }
          process.stdout.write(`pid=${[...owners][0]}\n`);
          process.exit(3);

          PORT_OWNER_EOF

          # 3b) 容器内独立 PG 身份：精确版本 + cluster 摘要；full 库名/存在性/current_database 均由容器核实。
          phase=preflight
          : "${DATABASE_URL:?DATABASE_URL_REQUIRED}"
          read_pg_identity
          fact pgContainerId "$PG_CONTAINER_ID"
          printf 'J7_PG_CONTAINER id=%s source=env docker-exec-read\n' "$PG_CONTAINER_ID"
          pg_version_before="$PG_VERSION_NUM"
          pg_cluster_before="$PG_CLUSTER_SHA"
          full_db="${DATABASE_URL##*/}"
          full_db="${full_db%%\?*}"
          [[ "$full_db" =~ ^e2e(_j7_[0-9a-f]{12})?$ ]] || fail "J7_FULL_DB_NAME_INVALID:$full_db"
          psql_bounded postgres "SELECT count(*) FROM pg_database WHERE datname = '$full_db'" "$private/full-db-exists.raw" \
            || fail 'J7_DB_QUERY_FAILED'
          [[ "$(tr -d ' \r\n' < "$private/full-db-exists.raw")" == 1 ]] || fail "J7_FULL_DB_MISSING:$full_db"
          psql_bounded "$full_db" 'SELECT current_database()' "$private/full-db-identity.raw" \
            || fail 'J7_DB_IDENTITY_MISMATCH'
          [[ "$(tr -d ' \r\n' < "$private/full-db-identity.raw")" == "$full_db" ]] || fail 'J7_DB_IDENTITY_MISMATCH'
          fact fullDb "$full_db"
          fact fullDbIdentityVerified true
          fact fullDbExistsVerified true
          printf 'J7_PG_IDENTITY version=%s cluster=%s fullDb=%s\n' "$PG_VERSION_NUM" "$PG_CLUSTER_SHA" "$full_db"

          [[ -n "${A3_DRIVER_DIR:-}" && -f "$A3_DRIVER_DIR/ports.cjs" ]] || fail 'J7_A3_PORTS_HELPER_MISSING'
          cat > "$private/j7-observe.cjs" <<'OBSERVE_EOF'
          'use strict';
          // J7 观测汇总/门禁：cleanup 只写固定安全 JSON；gate 重读实物并交叉核对后才允许专属上传。
          // 由 body/j7-runner.sh 的 heredoc 原字节内联（inline_observer.py --check 保证一致）。
          //
          // 正式门（默认 `--mode formal`）只收 `j7-probe/3` 且强制 failureAttribution；`/2` 仅在
          // `--mode offline --allow-legacy` 的离线复跑里接受，只打印 J7_SAFE_FILES_OFFLINE，不写产物、
          // 不进 CI 上传路径。PG 身份（版本/集群摘要/库名）由 runner 在容器内独立读取后写 facts，
          // 本文件只做对账，不再从探针报告复制。
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const A3_SEGMENTS = ['main', 'model', 'consent', 'errors', 'flow'];
          const REPORT_FULL = 'j7-attribution.json';
          const REPORT_NODATA = 'j7-nodata.json';
          const CLEANUP = 'j7-cleanup.json';
          const ALLOWED = [REPORT_FULL, REPORT_NODATA, CLEANUP];
