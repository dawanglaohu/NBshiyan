          }
          const facts = readFacts(arg('--facts'));
          const get = (key, fallback = '') => (facts.has(key) ? facts.get(key) : fallback);
          const isTrue = (key) => get(key) === 'true';
          const asInt = (key) => {
            const value = Number(get(key, 'NaN'));
