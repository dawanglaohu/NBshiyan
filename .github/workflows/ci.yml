      - name: Supply audited PostgreSQL 17 tool layer (PGDG noble, pinned)
        timeout-minutes: 10
        shell: bash
        run: |
          set -Eeuo pipefail
          # ubuntu-24.04 carries PostgreSQL 16 only. The mail namespace needs a real 17, so install the exact PGDG
          # noble build from the signed repository and start no service on this host.
          pg_repo_key=https://www.postgresql.org/media/keys/ACCC4CF8.asc
          pg_repo_key_sha256=0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76
          pg_repo_line='deb [arch=amd64 signed-by=/usr/share/keyrings/pgdg-noble.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main'
          pg_server_deb=17.12-1.pgdg24.04+1
          pg_client_deb=17.12-1.pgdg24.04+1
          key=$(mktemp)
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 60 --output "$key" "$pg_repo_key"
          [[ $(sha256sum "$key" | cut -d' ' -f1) == "$pg_repo_key_sha256" ]] || { echo 'PGDG_KEY_DIGEST_MISMATCH' >&2; exit 1; }
          sudo -n install -m 0644 "$key" /usr/share/keyrings/pgdg-noble.asc
          sudo -n rm -f -- "$key"
          sudo -n gpg --batch --yes --dearmor --output /usr/share/keyrings/pgdg-noble.gpg /usr/share/keyrings/pgdg-noble.asc
          printf '%s\n' "$pg_repo_line" | sudo -n tee /etc/apt/sources.list.d/pgdg-noble.list >/dev/null
          # The only server is the one the driver starts inside the private namespace; the host cluster stays uncreated.
          sudo -n sh -c 'printf "create_main_cluster = false\n" > /etc/postgresql-common/createcluster.conf'
          sudo -n sh -c 'printf "#!/bin/sh\nexit 101\n" > /usr/sbin/policy-rc.d; chmod 0755 /usr/sbin/policy-rc.d'
          sudo -n apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            "postgresql-17=$pg_server_deb" "postgresql-client-17=$pg_client_deb"
          pg_bin=/usr/lib/postgresql/17/bin
          for tool in postgres initdb pg_ctl pg_isready createdb psql; do
            [[ -x $pg_bin/$tool ]] || { echo "PG17_TOOL_MISSING:$tool" >&2; exit 1; }
          done
          version=$("$pg_bin/postgres" --version)
