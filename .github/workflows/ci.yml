name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: 依赖漏洞扫描（high 及以上阻断）
        run: node --import tsx scripts/audit-high-prod.ts
      - name: 模型体积门槛（普通 1MB，带动画 1.5MB）
        run: node scripts/check-model-size.mjs
      - name: 模型和封面路径必须存在（products.ts）
        run: node scripts/check-model-refs.mjs
      - name: 后台接口必须鉴权
        run: node scripts/check-admin-guard.mjs
      - name: 镜像构建上下文不引用被 .dockerignore 排除的文件
        run: node --import tsx scripts/check-image-context.ts
      - name: Unit tests
        run: pnpm test
      - run: pnpm build
      - name: 确认 Linux standalone 产物
        run: test -s .next/standalone/server.js
      - name: standalone 启动检查（STANDALONE_TEST=1，缺产物或环境 skip 都算失败；只用假值）
        run: |
          set -o pipefail
          STANDALONE_TEST=1 node --import tsx --test --test-reporter=tap tests/standalone-start.test.ts | tee /tmp/standalone-start.tap
          grep -qx '# skipped 0' /tmp/standalone-start.tap
          grep -qx '# fail 0' /tmp/standalone-start.tap
          grep -qx '# todo 0' /tmp/standalone-start.tap
          grep -qx '# cancelled 0' /tmp/standalone-start.tap
          grep -Eq '^# pass [1-9][0-9]*$' /tmp/standalone-start.tap
      # 固定 Chrome 版本，避免 runner 自带 Chrome 升级后与 Lighthouse 的 trace 格式不兼容（frame_sequence 报错）
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with: { chrome-version: stable, install-dependencies: true }
      # 启动原非production服务，并把监听进程绑定到本次 setsid 会话；绑定不上就失败，不认领外来进程。
      - name: 启动原非production服务并确认监听归属
        shell: bash
        run: |
          set -Eeuo pipefail
          port=3000
          if ss -H -ltn "sport = :$port" 2>/dev/null | grep -q .; then
            echo "port $port already in use before start; refusing to start" >&2
            exit 1
          fi
          rm -f /tmp/ci-next.session /tmp/ci-next.listener /tmp/ci-next.pgid /tmp/ci-next.launch
          # setsid 里面再写 $$：不管 setsid 是否 fork，记录的都是新会话首进程（随后 exec pnpm）。
          setsid bash -c 'echo $$ > /tmp/ci-next.session; exec pnpm start' > /tmp/next.log 2>&1 &
          echo "$!" > /tmp/ci-next.launch
          for _ in $(seq 1 100); do
            [[ -s /tmp/ci-next.session ]] && break
            sleep 0.1
          done
          session="$(cat /tmp/ci-next.session 2>/dev/null || true)"
          [[ "$session" =~ ^[0-9]+$ ]] || { echo "could not record the launch session" >&2; exit 1; }
          npx --yes wait-on@8 --timeout 120000 http://localhost:3000/en http://localhost:3000/en/products
          listener="$(ss -H -ltnp "sport = :$port" 2>/dev/null | grep -oP 'pid=\K[0-9]+' | head -n 1)"
          [[ -n "$listener" ]] || { echo "no listener on port $port after wait-on" >&2; exit 1; }
          listener_sid="$(ps -o sid= -p "$listener" 2>/dev/null | tr -d ' ')"
          listener_pgid="$(ps -o pgid= -p "$listener" 2>/dev/null | tr -d ' ')"
          if [[ "$listener_sid" != "$session" ]]; then
            echo "listener pid=$listener sid=${listener_sid:-gone} pgid=${listener_pgid:-gone} is not in the launch session $session" >&2
            echo "launch pid=$(cat /tmp/ci-next.launch 2>/dev/null || echo unknown)" >&2
            tail -n 40 /tmp/next.log >&2 || true
            exit 1
          fi
          echo "$listener" > /tmp/ci-next.listener
          echo "$listener_pgid" > /tmp/ci-next.pgid
          echo "listener pid $listener sid $listener_sid pgid $listener_pgid (launch session)"

      - name: Lighthouse 性能门槛
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npx --yes @lhci/cli@0.15.x autorun

      # 清理本次启动的服务：每个成功分支都要求「端口释放 + 本次会话无存活成员」；只终止已证明属于本次会话的进程。
      - name: 清理本次启动的服务（正常或失败都执行，端口与会话都须清空）
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          port=3000
          session="$(cat /tmp/ci-next.session 2>/dev/null || true)"
          listening() { ss -H -ltn "sport = :$port" 2>/dev/null | grep -q .; }
          session_members() {
            [[ "$session" =~ ^[0-9]+$ ]] || return 0
            pgrep -s "$session" 2>/dev/null || true
          }
          settled() { ! listening && [[ -z "$(session_members)" ]]; }
          # 1) 按记录的会话整组 TERM（覆盖 pnpm → next 的子进程）
          if [[ "$session" =~ ^[0-9]+$ ]] && kill -0 "$session" 2>/dev/null; then
            echo "stopping session $session"
            kill -TERM -- "-$session" 2>/dev/null || kill -TERM "$session" 2>/dev/null || true
          fi
          for _ in $(seq 1 20); do
            if settled; then echo "port $port free and launch session $session empty"; exit 0; fi
            sleep 1
          done
          # 2) 仍未清空：只处理属于本会话的成员/监听；外来进程一律拒绝，不清完不成功
          verified=()
          while read -r p; do
            [[ -n "$p" ]] || continue
            [[ -d "/proc/$p" ]] || continue
            sid="$(ps -o sid= -p "$p" 2>/dev/null | tr -d ' ')"
            if [[ "$sid" == "$session" ]]; then
              verified+=("$p")
            else
              echo "refusing to kill pid=$p sid=${sid:-gone} (launch session=${session:-none})" >&2
              exit 1
            fi
          done < <( { ss -H -ltnp "sport = :$port" 2>/dev/null | grep -oP 'pid=\K[0-9]+' || true; session_members; } | sort -u )
          for p in "${verified[@]}"; do
            echo "stopping launch-session member $p"
            kill -TERM "$p" 2>/dev/null || true
          done
          for _ in $(seq 1 10); do
            if settled; then echo "port $port free and launch session empty after TERM"; exit 0; fi
            sleep 1
          done
          for p in "${verified[@]}"; do
            kill -0 "$p" 2>/dev/null && { echo "killing $p"; kill -KILL "$p" 2>/dev/null || true; }
          done
          for _ in $(seq 1 5); do
            if settled; then echo "port $port free and launch session empty after SIGKILL"; exit 0; fi
            sleep 1
          done
          echo "cleanup incomplete: port_busy=$(listening && echo yes || echo no) members=$(session_members | tr '\n' ' ')" >&2
          exit 1

      # 原非production构建的产物身份先落盘，再把 .next 让位：第二次构建必须是全新的 .next，不混用残留。
      - name: 记录原非production构建身份并让位
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s .next/standalone/server.js
          session="$(cat /tmp/ci-next.session 2>/dev/null || true)"
          if [[ "$session" =~ ^[0-9]+$ ]] && pgrep -s "$session" >/dev/null 2>&1; then
            echo "launch session $session still has processes; refusing to move the artifacts" >&2
            pgrep -s "$session" | tr '\n' ' '; echo >&2
            exit 1
          fi
          node - <<'EOF'
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const walk = (dir, skip) => !fs.existsSync(dir) ? [] : fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
            const p = path.join(dir, e.name);
            if (skip && skip(p)) return [];
            return e.isDirectory() ? walk(p, skip) : [p];
          });
          const sha = (file) => createHash('sha256').update(fs.readFileSync(file)).digest('hex').toUpperCase();
          const identity = {
            buildId: fs.readFileSync('.next/BUILD_ID', 'utf8').trim(),
            serverJs: { bytes: fs.statSync('.next/standalone/server.js').size, sha256: sha('.next/standalone/server.js') },
            counts: {
              server: walk('.next/server').length,
              static: walk('.next/static').length,
              standalone: walk('.next/standalone', (p) => p.includes('/node_modules/')).length,
            },
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync('/tmp/ci-original-build.json', JSON.stringify(identity, null, 2) + '\n');
          console.log('ORIGINAL_BUILD_IDENTITY=' + JSON.stringify(identity));
          EOF
          mv .next .next-original-build
          test ! -e .next
          echo "original build moved to .next-original-build; .next is now absent"

      # 独立 production 模式构建：只用已核公开输入，不继承任何业务密钥；邮件开关用 Windows 已验证过的 off。
      # site key 是客户端可见的公开值（非密钥），取自 planning 的来源核查文档，不打印到日志。
      - name: 独立 production 模式构建（公开输入，无业务密钥）
        shell: bash
        env:
          APP_ENV: production
          NEXT_PUBLIC_ADMIN_API: http
          NEXT_PUBLIC_ADMIN_MAIL: 'off'
          NEXT_PUBLIC_SITE_URL: https://geiom.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAFZNDL4a5ZSZhxee'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -Eeuo pipefail
          test ! -e .next
          pnpm build 2>&1 | tee /tmp/ci-prod-build.log
          test -s .next/standalone/server.js
          node - <<'EOF'
          const fs = require('node:fs');
          const s = fs.readFileSync('.next/standalone/server.js', 'utf8');
          const m = [...s.matchAll(/"APP_ENV_AT_BUILD":"([^"]*)"/g)].map((x) => x[1]);
          if (!m.length) { console.error('APP_ENV_AT_BUILD missing'); process.exit(1); }
          if (!m.every((v) => v === 'production')) { console.error('APP_ENV_AT_BUILD=' + m.join(',')); process.exit(1); }
          const oldId = JSON.parse(fs.readFileSync('/tmp/ci-original-build.json', 'utf8'));
          const newId = fs.readFileSync('.next/BUILD_ID', 'utf8').trim();
          if (oldId.buildId === newId) { console.error('BUILD_ID did not change: ' + newId); process.exit(1); }
          console.log('APP_ENV_AT_BUILD=production count=' + m.length);
          console.log('build id: original=' + oldId.buildId + ' production=' + newId);
          EOF

      # 原产物断言：必须真跑并 0 skip；缺产物、标记不符、任何 fail/skip/todo/cancelled 都失败。
      - name: production 产物 mock 断言（0 skip，缺产物即失败）
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s .next/standalone/server.js
          MOCK_BUNDLE_TEST=1 node --import tsx --test --test-reporter=tap tests/prod-mocks-strip.test.ts | tee /tmp/ci-prod-mocks.tap
          grep -qx '# fail 0' /tmp/ci-prod-mocks.tap
          grep -qx '# skipped 0' /tmp/ci-prod-mocks.tap
          grep -qx '# todo 0' /tmp/ci-prod-mocks.tap
          grep -qx '# cancelled 0' /tmp/ci-prod-mocks.tap
          grep -Eq '^# pass [1-9][0-9]*$' /tmp/ci-prod-mocks.tap
          grep -Eq '^ok 3 ' /tmp/ci-prod-mocks.tap

      # 两段构建与断言的日志分开留存；失败也上传，便于复核。
      - name: 上传 production 构建与断言证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-mock-artifact-evidence
          path: |
            /tmp/ci-original-build.json
            /tmp/ci-next.session
            /tmp/ci-next.listener
            /tmp/next.log
            /tmp/ci-prod-build.log
            /tmp/ci-prod-mocks.tap
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    # 浏览器依赖安装、构建和完整测试共享此作业总预算；各用例超时与验收门禁保持不变。
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: e2e }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # 只用于 CI 测试库的假值；不是生产密钥
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
      AUTH_SECRET: e2e-only-auth-secret-not-for-production-000
      # 同意签名读取此项。这是 CI 专用假值，不是生产密钥。
      PRIVACY_HASH_SECRET: ci-e2e-only-privacy-hash-not-prod-0001
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: 'true'
      ADMIN_TOTP_KEY: ZTJlLW9ubHktdG90cC1rZXktMzItYnl0ZXMtMDAwMDA=
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      # standalone 的 req.url 使用监听地址（http://0.0.0.0:3100），与浏览器的 localhost Origin 不同。
      # 显式配置 APP_ORIGIN，让后台写请求通过既有同源校验。
      APP_ORIGIN: http://localhost:3100
      NEXT_PUBLIC_ADMIN_API: http
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      TURNSTILE_VERIFY_URL: http://127.0.0.1:3999/siteverify
      NEXT_PUBLIC_TAWK_PROPERTY_ID: e2eprop
      NEXT_PUBLIC_TAWK_WIDGET_ID: e2ewidget
      CRON_SECRET: e2e-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma db push --skip-generate
      # 这三个文件在 build-and-audit 里会静默 skip。连到本 job 的 postgres:17 后，每个文件自己的 pass 必须 >= 1，fail、skip、todo、cancelled 必须是 0。
      # describe 级 skip 的汇总是 tests 0 / skipped 0，汇总门禁看不见，所以按文件核对。
      # cancelled 与 skip、todo 同类：describe 级取消也会被汇总漏掉，所以按文件也盯 cancelled。
      # passed、failed、skipped、todo、cancelled 缺任何一个，或不是非负整数，按文件门禁失败，不用 0 填充。
      - name: Device session protocol and PostgreSQL regressions
        env:
          ADMIN_DEVICE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
        run: |
          set -o pipefail
          cat > /tmp/device-file-gate.cjs <<'EOF'
          'use strict';
          module.exports = async function* fileGate(source) {
            const counts = new Map();
            for await (const event of source) {
              if (event.type !== 'test:summary' || !event.data?.file || !event.data.counts) continue;
              counts.set(String(event.data.file), event.data.counts);
            }
            const wanted = [
              'tests/admin-device-guard.http.test.ts',
              'tests/admin-device-session.db.test.ts',
              'tests/admin-session-activity.http.test.ts',
            ];
            for (const file of wanted) {
              const hit = [...counts.entries()].find(([name]) => name.replaceAll('\\', '/').endsWith(file));
              if (!hit) {
                yield `MISSING\t${file}\n`;
                continue;
              }
              const missing = ['passed', 'failed', 'skipped', 'todo', 'cancelled'].filter((key) => {
                const value = hit[1][key];
                return typeof value !== 'number' || !Number.isInteger(value) || value < 0;
              });
              if (missing.length > 0) {
                yield `${file}\tMISSING_COUNT\t${missing.join(',')}\n`;
                continue;
              }
              yield `${file}\tpass=${hit[1].passed}\tfail=${hit[1].failed}\tskip=${hit[1].skipped}\ttodo=${hit[1].todo}\tcancelled=${hit[1].cancelled}\n`;
            }
          };
          EOF
          # 默认按文件并行。guard 与 activity 会对同一库 db push 并写同一批表，所以串行。
          # 失败时把 TAP 和按文件门禁打到日志后 exit 1。成功才跑下面的汇总 grep 和按文件 GATE。
          node --import tsx --test --test-concurrency=1 \
            --test-reporter=tap \
            --test-reporter=/tmp/device-file-gate.cjs \
            --test-reporter-destination=/tmp/device-regressions.tap \
            --test-reporter-destination=/tmp/device-file-gate.txt \
            tests/admin-device-guard.http.test.ts \
            tests/admin-device-session.db.test.ts \
            tests/admin-session-activity.http.test.ts \
            || { cat /tmp/device-regressions.tap /tmp/device-file-gate.txt; exit 1; }
          grep -qx '# skipped 0' /tmp/device-regressions.tap
          grep -qx '# fail 0' /tmp/device-regressions.tap
          grep -qx '# todo 0' /tmp/device-regressions.tap
          grep -qx '# cancelled 0' /tmp/device-regressions.tap
          grep -Eq '^# pass [1-9][0-9]*$' /tmp/device-regressions.tap
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const gate = readFileSync('/tmp/device-file-gate.txt', 'utf8');
          process.stdout.write(gate.endsWith('\n') ? gate : `${gate}\n`);
          const files = [
            'tests/admin-device-guard.http.test.ts',
            'tests/admin-device-session.db.test.ts',
            'tests/admin-session-activity.http.test.ts',
          ];
          let bad = false;
          for (const file of files) {
            const line = gate.split(/\r?\n/).find((row) => row.startsWith(`${file}\t`));
            if (!line) {
              console.error(`GATE MISSING\t${file}`);
              bad = true;
              continue;
            }
            const missing = line.match(/^\S+\tMISSING_COUNT\t([a-z,]+)$/);
            if (missing) {
              console.error(`GATE ${file} missing count fields: ${missing[1]} (absent is not 0)`);
              bad = true;
              continue;
            }
            const match = line.match(/\tpass=(\d+)\tfail=(\d+)\tskip=(\d+)\ttodo=(\d+)\tcancelled=(\d+)$/);
            if (!match || Number(match[1]) < 1 || Number(match[2]) !== 0 || Number(match[3]) !== 0 || Number(match[4]) !== 0 || Number(match[5]) !== 0) {
              console.error(`GATE ${line}`);
              bad = true;
            }
          }
          if (bad) process.exit(1);
          EOF
      # build-and-audit 没有数据库，这些用例会静默 skip。连到本 job 的 postgres:17，TAP 里 skipped、fail、todo、cancelled 必须是 0。
      # 文件串行跑：cleanup-lock 与 job-leases 会看全库 pg_locks，并行时会互相看见对方的锁。
      # describe 级 skip 的汇总是 tests 0 / skipped 0，汇总门禁看不见。本步骤命令行列出的每个测试文件都要 pass >= 1，fail、skip、todo、cancelled 为 0。
      # passed、failed、skipped、todo、cancelled 缺任何一个，或不是非负整数，按文件门禁失败，不用 0 填充。
      # M3-T2 用 schema=m3t2 隔离。M3T2_REQUIRE_DATABASE 只在本步骤打开。缺地址时 admin-login-mode 与 admin-enroll-current-state 直接抛错。单元测试 job 不设它，pnpm test 继续跳过。
      - name: Analytics, chat, and other PostgreSQL regressions
        env:
          ADMIN_RESET_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
          CHAT_SESSION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
          # M4-T1 首消息真实 PG 回归：专属变量 + require；缺地址必须失败，绝不回退通用 DATABASE_URL。
          B9_M4T1_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
          CHAT_REQUIRE_DATABASE: 'true'
          M3T2_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e?schema=m3t2
          M3T2_REQUIRE_DATABASE: 'true'
          M3T3_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e?schema=m3t3
          M3T3_REQUIRE_DATABASE: 'true'
          # M5-T3 专用 PG 回归只在 e2e job 设此 flag；缺库即抛错，且按文件门禁要求具名通过。
          M5T3_REQUIRE_DATABASE: 'true'
          # M5-T8 固定作业运行时/预算回归：只在 e2e job 设此 flag，缺库即失败，不靠默认 skip。
          M5T8_REQUIRE_DATABASE: 'true'
          # M5-T5 专用 PG 回归：只在 e2e job 设地址与 require；缺地址必须失败，不能静默 skip。
          # 测试内按进程号自建 schema 并在 finally 删除，不落到公共 public。
          M5T5_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
          M5T5_REQUIRE_DATABASE: 'true'
        run: |
          set -o pipefail
          cat > /tmp/m3t2-file-gate.cjs <<'EOF'
          'use strict';
          module.exports = async function* fileGate(source) {
            const counts = new Map();
            for await (const event of source) {
              if (event.type !== 'test:summary' || !event.data?.file || !event.data.counts) continue;
              counts.set(String(event.data.file), event.data.counts);
            }
            const wanted = [
              'tests/analytics-settings.db.test.ts',
              'tests/analytics-ingest.http.db.test.ts',
              'tests/analytics-aggregate.db.test.ts',
              'tests/jobs-runtime.http.test.ts',
              'tests/analytics-rollup.http.db.test.ts',
              'tests/retention-cleanup.http.db.test.ts',
              'tests/chat-session.http.test.ts',
              'tests/chat-first-message.db.test.ts',
              'tests/cleanup-lock.db.test.ts',
              'tests/job-leases.db.test.ts',
              'tests/last-admin.db.test.ts',
              'tests/admin-reset-initial-password.db.test.ts',
              'tests/admin-login-mode.db.test.ts',
              'tests/admin-enroll-current-state.db.test.ts',
              'tests/admin-action-grant.db.test.ts',
              'tests/admin-reauth.http.test.ts',
              'tests/admin-recovery-authorizations.http.test.ts',
              'tests/admin-recovery-start.db.test.ts',
              'tests/admin-account-mode-password.http.test.ts',
              'tests/admin-device-management.http.test.ts',
              'tests/analytics-retention-plan.test.ts',
            ];
            for (const file of wanted) {
              const hit = [...counts.entries()].find(([name]) => name.replaceAll('\\', '/').endsWith(file));
              if (!hit) {
                yield `MISSING\t${file}\n`;
                continue;
              }
              const missing = ['passed', 'failed', 'skipped', 'todo', 'cancelled'].filter((key) => {
                const value = hit[1][key];
                return typeof value !== 'number' || !Number.isInteger(value) || value < 0;
              });
              if (missing.length > 0) {
                yield `${file}\tMISSING_COUNT\t${missing.join(',')}\n`;
                continue;
              }
              yield `${file}\tpass=${hit[1].passed}\tfail=${hit[1].failed}\tskip=${hit[1].skipped}\ttodo=${hit[1].todo}\tcancelled=${hit[1].cancelled}\n`;
            }
          };
          EOF
          # 测试失败时把 TAP 和按文件门禁打到日志，再以 node 的退出码退出。成功才跑下面的汇总 grep 和按文件 GATE。
          node --import tsx --test --test-concurrency=1 \
            --test-reporter=tap \
            --test-reporter=/tmp/m3t2-file-gate.cjs \
            --test-reporter-destination=/tmp/pg-regressions.tap \
            --test-reporter-destination=/tmp/m3t2-file-gate.txt \
            tests/analytics-settings.db.test.ts \
            tests/analytics-ingest.http.db.test.ts \
            tests/analytics-aggregate.db.test.ts \
            tests/jobs-runtime.http.test.ts \
            tests/analytics-rollup.http.db.test.ts \
            tests/retention-cleanup.http.db.test.ts \
            tests/chat-session.http.test.ts \
            tests/chat-first-message.db.test.ts \
            tests/cleanup-lock.db.test.ts \
            tests/job-leases.db.test.ts \
            tests/last-admin.db.test.ts \
            tests/admin-reset-initial-password.db.test.ts \
            tests/admin-login-mode.db.test.ts \
            tests/admin-enroll-current-state.db.test.ts \
            tests/admin-action-grant.db.test.ts \
            tests/admin-reauth.http.test.ts \
            tests/admin-recovery-authorizations.http.test.ts \
            tests/admin-recovery-start.db.test.ts \
            tests/admin-account-mode-password.http.test.ts \
            tests/admin-device-management.http.test.ts \
            tests/analytics-retention-plan.test.ts \
            || { status=$?; cat /tmp/pg-regressions.tap /tmp/m3t2-file-gate.txt; exit "$status"; }
          grep -qx '# skipped 0' /tmp/pg-regressions.tap
          grep -qx '# fail 0' /tmp/pg-regressions.tap
          grep -qx '# todo 0' /tmp/pg-regressions.tap
          grep -qx '# cancelled 0' /tmp/pg-regressions.tap
          grep -Eq '^# pass [1-9][0-9]*$' /tmp/pg-regressions.tap
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const gate = readFileSync('/tmp/m3t2-file-gate.txt', 'utf8');
          process.stdout.write(gate.endsWith('\n') ? gate : `${gate}\n`);
          const files = [
            'tests/analytics-settings.db.test.ts',
            'tests/analytics-ingest.http.db.test.ts',
            'tests/analytics-aggregate.db.test.ts',
            'tests/jobs-runtime.http.test.ts',
            'tests/analytics-rollup.http.db.test.ts',
            'tests/retention-cleanup.http.db.test.ts',
            'tests/chat-session.http.test.ts',
            'tests/chat-first-message.db.test.ts',
            'tests/cleanup-lock.db.test.ts',
            'tests/job-leases.db.test.ts',
            'tests/last-admin.db.test.ts',
            'tests/admin-reset-initial-password.db.test.ts',
            'tests/admin-login-mode.db.test.ts',
            'tests/admin-enroll-current-state.db.test.ts',
            'tests/admin-action-grant.db.test.ts',
            'tests/admin-reauth.http.test.ts',
            'tests/admin-recovery-authorizations.http.test.ts',
            'tests/admin-recovery-start.db.test.ts',
            'tests/admin-account-mode-password.http.test.ts',
            'tests/admin-device-management.http.test.ts',
            'tests/analytics-retention-plan.test.ts',
          ];
          let bad = false;
          for (const file of files) {
            const line = gate.split(/\r?\n/).find((row) => row.startsWith(`${file}\t`));
            if (!line) {
              console.error(`GATE MISSING\t${file}`);
              bad = true;
              continue;
            }
            const missing = line.match(/^\S+\tMISSING_COUNT\t([a-z,]+)$/);
            if (missing) {
              console.error(`GATE ${file} missing count fields: ${missing[1]} (absent is not 0)`);
              bad = true;
              continue;
            }
            const match = line.match(/\tpass=(\d+)\tfail=(\d+)\tskip=(\d+)\ttodo=(\d+)\tcancelled=(\d+)$/);
            if (!match || Number(match[1]) < 1 || Number(match[2]) !== 0 || Number(match[3]) !== 0 || Number(match[4]) !== 0 || Number(match[5]) !== 0) {
              console.error(`GATE ${line}`);
              bad = true;
            }
          }
          if (bad) process.exit(1);
          EOF
      - name: Action grant PostgreSQL lock-wait evidence
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const records = readFileSync('/tmp/pg-regressions.tap', 'utf8').split(/\r?\n/)
            .map(line => line.match(/# ACTION_GRANT_LOCK_EXPIRY_EVIDENCE (\{.*\})$/))
            .filter(Boolean).map(match => JSON.parse(match[1]));
          assert.equal(records.length, 4, 'Missing PostgreSQL lock-wait evidence');
          assert.deepEqual(records.map(r => `${r.lock}/${r.expiry}`).sort(), ['Device/device', 'Device/grant', 'User/device', 'User/grant']);
          for (const r of records) {
            assert.ok(Number.isInteger(r.blockerPid) && Number.isInteger(r.consumerPid) && r.blockerPid !== r.consumerPid);
            assert.ok(r.waitingAt < Date.parse(r.expiresAt) && r.releasedAt > Date.parse(r.expiresAt));
            assert.equal(r.consumed, false);
            assert.equal(r.usedAt, null);
            console.log(`ACTION_GRANT_LOCK_EXPIRY_EVIDENCE ${JSON.stringify(r)}`);
          }
          EOF
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # next build 的 standalone 产物缺 .next/static 与 public，浏览器跑起来才会 404 样式和媒体。
      # playwright.config.ts 加载时也做同样的复制（本地跑 e2e 不必手动执行本步），这里显式列出来，CI 日志里能核到运行目录就位。
      - name: 准备 standalone 运行目录（复制 .next/static 与 public）
        run: |
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      # 三段使用同一构建产物与 PG，各自重启 Playwright 管理的应用，隔离 memory 限流。
      # 建单源码预算 5/3/3，认证源码预算 29/7/7；不是服务器请求实测计数。
      - name: 核对 A3 收集分区并准备执行器（216 + 2 + 1 = 219）
        id: e2e_partition
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p e2e-evidence/collection
          split_pattern='admin-legacy-inquiries-visual\.spec\.ts .* (E1 真实 400：|A1 仅本用例合成询盘：|三尺寸完整流程：)'
          error_pattern='admin-legacy-inquiries-visual\.spec\.ts .* (E1 真实 400：|A1 仅本用例合成询盘：)'
          flow_pattern='admin-legacy-inquiries-visual\.spec\.ts .* 三尺寸完整流程：'
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-evidence/collection/all.json pnpm test:e2e --list --reporter=json
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-evidence/collection/main.json pnpm test:e2e --list --reporter=json --grep-invert "$split_pattern"
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-evidence/collection/errors.json pnpm test:e2e e2e/admin-legacy-inquiries-visual.spec.ts --list --reporter=json --grep "$error_pattern"
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-evidence/collection/flow.json pnpm test:e2e e2e/admin-legacy-inquiries-visual.spec.ts --list --reporter=json --grep "$flow_pattern"
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const groups = {};
          for (const name of ['all', 'main', 'errors', 'flow']) {
            const report = JSON.parse(readFileSync(`e2e-evidence/collection/${name}.json`, 'utf8'));
            assert.deepEqual(report.errors, [], `${name}: collection errors`);
            const rows = [];
            const visit = (suite, parents = []) => {
              for (const spec of suite.specs ?? []) for (const test of spec.tests ?? []) {
                rows.push({ key: JSON.stringify([test.projectName, spec.file, spec.line, spec.column, [...parents, suite.title], spec.title]), file: spec.file, title: spec.title });
              }
              for (const child of suite.suites ?? []) visit(child, [...parents, suite.title]);
            };
            for (const suite of report.suites) visit(suite);
            groups[name] = rows;
            assert.equal(new Set(rows.map(row => row.key)).size, rows.length, `${name}: duplicate tests`);
          }
          assert.deepEqual(Object.fromEntries(Object.entries(groups).map(([name, rows]) => [name, rows.length])), { all: 219, main: 216, errors: 2, flow: 1 });
          const parts = [...groups.main, ...groups.errors, ...groups.flow].map(row => row.key);
          assert.equal(new Set(parts).size, 219, 'Partitions overlap');
          assert.deepEqual(parts.sort(), groups.all.map(row => row.key).sort(), 'Partitions omit or change tests');
          const errors = [
            'E1 真实 400：搜索 101 字符 / 备注 5001 字符错误与纠正恢复',
            'A1 仅本用例合成询盘：原 privacy/export+delete 匿名化、PII 消失、只读与 409、history 保留',
          ];
          const flow = '三尺寸完整流程：列表→详情→状态/分配/备注写动作→刷新持久（1920/1440/390 真触控 tap，原生帧）';
          assert.deepEqual(groups.errors.map(row => row.title).sort(), errors.sort());
          assert.deepEqual(groups.flow.map(row => row.title), [flow]);
          for (const row of [...groups.errors, ...groups.flow]) assert.equal(row.file, 'admin-legacy-inquiries-visual.spec.ts');
          writeFileSync('e2e-evidence/collection/partition.json', JSON.stringify(groups, null, 2) + '\n');
          console.log('A3_COLLECTION all=219 main=216 errors=2 flow=1 disjoint=true complete=true');
          EOF
          driver_dir=$(mktemp -d "${RUNNER_TEMP:?}/nbshiyan-e2e-a3.XXXXXXXX")
          cat > "$driver_dir/ports.cjs" <<'EOF'
          const net = require('node:net');
          (async () => {
            for (const [host, port] of [['0.0.0.0', Number(process.env.E2E_PORT ?? 3100)], ['127.0.0.1', 3999]]) {
              if (!Number.isInteger(port) || port < 1 || port > 65535) throw new Error('INVALID_E2E_PORT');
              await new Promise((resolve, reject) => {
                const server = net.createServer();
                server.once('error', () => reject(new Error(`A3_PORT_NOT_RELEASED:${port}`)));
                server.listen({ host, port, exclusive: true }, () => server.close(error => error ? reject(error) : resolve()));
              });
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          EOF
          cat > "$driver_dir/run.sh" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          segment=${1:?SEGMENT_REQUIRED}
          case "$segment" in
            main) args=(--grep-invert "$A3_SPLIT_PATTERN") ;;
            errors) args=(e2e/admin-legacy-inquiries-visual.spec.ts --grep "$A3_ERROR_PATTERN") ;;
            flow) args=(e2e/admin-legacy-inquiries-visual.spec.ts --grep "$A3_FLOW_PATTERN") ;;
            *) exit 1 ;;
          esac
          evidence="e2e-evidence/$segment"
          mkdir -p "$evidence"
          printf 'released=false\n' >> "$GITHUB_OUTPUT"
          archive_log() {
            if [[ -f .next/standalone-server.log && ! -e "$evidence/standalone-server.log" ]]; then
              mv .next/standalone-server.log "$evidence/standalone-server.log"
            fi
          }
          interrupted() {
            trap - INT TERM
            archive_log || true
            printf 'released=false\ninterrupted=true\n' >> "$GITHUB_OUTPUT"
            exit "$1"
          }
          trap 'interrupted 130' INT
          trap 'interrupted 143' TERM
          # Never reuse a listener or attribute a previous segment's stdout to this segment.
          node "$A3_DRIVER_DIR/ports.cjs" > "$evidence/port-before.log" 2>&1
          [[ ! -e .next/standalone-server.log && ! -e "$evidence/standalone-server.log" ]] || { echo 'A3_STALE_SERVER_LOG' >&2; exit 1; }
          export PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$segment"
          set +e
          pnpm test:e2e "${args[@]}" --output="test-results/$segment" 2>&1 | tee "$evidence/playwright.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          test_status=${statuses[0]}
          capture_status=${statuses[1]}
          printf 'test_exit=%s\ncapture_exit=%s\n' "$test_status" "$capture_status" >> "$GITHUB_OUTPUT"
          archive_log
          case "$test_status" in 130|137|143) interrupted "$test_status" ;; esac
          log_status=0
          [[ -s "$evidence/standalone-server.log" ]] || log_status=1
          rum_status=0
          # Check the main application's own archived stdout before another invocation can truncate the default log.
          if [[ "$segment" == main ]]; then
            if [[ "$log_status" != 0 ]] || ! grep -c '^{"type":"rum"' "$evidence/standalone-server.log" > "$evidence/rum-count.txt"; then
              rum_status=1
            elif grep -q '^{"type":"rum".*@' "$evidence/standalone-server.log"; then
              echo 'RUM 日志出现邮箱样式字段，脱敏白名单被破坏' >&2
              rum_status=1
            fi
          fi
          release_status=0
          node "$A3_DRIVER_DIR/ports.cjs" > "$evidence/port-after.log" 2>&1 || release_status=$?
          if [[ "$release_status" == 0 ]]; then printf 'released=true\n' >> "$GITHUB_OUTPUT"; fi
          printf 'test_exit=%s\ncapture_exit=%s\nlog_exit=%s\nrum_exit=%s\nrelease_exit=%s\n' "$test_status" "$capture_status" "$log_status" "$rum_status" "$release_status" > "$evidence/result.txt"
          if (( test_status != 0 || capture_status != 0 || log_status != 0 || rum_status != 0 || release_status != 0 )); then exit 1; fi
          EOF
          {
            printf 'A3_DRIVER_DIR=%s\n' "$driver_dir"
            printf 'A3_SPLIT_PATTERN=%s\n' "$split_pattern"
            printf 'A3_ERROR_PATTERN=%s\n' "$error_pattern"
            printf 'A3_FLOW_PATTERN=%s\n' "$flow_pattern"
          } >> "$GITHUB_ENV"
      - name: Playwright A3 主段（216例，含同次 RUM 检查）
        id: e2e_main
        shell: bash
        run: bash "$A3_DRIVER_DIR/run.sh" main
      - name: Playwright A3 E1 + A1（2例，新应用进程）
        id: e2e_errors
        if: ${{ !cancelled() && steps.e2e_partition.outcome == 'success' && steps.e2e_main.outputs.released == 'true' }}
        shell: bash
        run: bash "$A3_DRIVER_DIR/run.sh" errors
      - name: Playwright A3 三尺寸流程（1例，新应用进程）
        id: e2e_flow
        if: ${{ !cancelled() && steps.e2e_partition.outcome == 'success' && steps.e2e_errors.outputs.released == 'true' }}
        shell: bash
        run: bash "$A3_DRIVER_DIR/run.sh" flow
      - name: 汇总 A3 三段结果（失败或未执行均不通过）
        if: ${{ !cancelled() && steps.e2e_partition.outcome == 'success' }}
        shell: bash
        env:
          MAIN_OUTCOME: ${{ steps.e2e_main.outcome }}
          ERRORS_OUTCOME: ${{ steps.e2e_errors.outcome }}
          FLOW_OUTCOME: ${{ steps.e2e_flow.outcome }}
          MAIN_RELEASED: ${{ steps.e2e_main.outputs.released }}
          ERRORS_RELEASED: ${{ steps.e2e_errors.outputs.released }}
          FLOW_RELEASED: ${{ steps.e2e_flow.outputs.released }}
        run: |
          for segment in MAIN ERRORS FLOW; do
            outcome="${segment}_OUTCOME"
            released="${segment}_RELEASED"
            [[ ${!outcome} == success && ${!released} == true ]] || { echo "A3_SEGMENT_FAILED_OR_MISSING:$segment" >&2; exit 1; }
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-smoke
          path: |
            test-results/**/standalone-smoke.json
            test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: warn
      # M3-T7 后台壳三尺寸视觉证据：成功运行也要留视频，供 PR 转 GIF。
      # 此处保留视频与已列账号/模型/规格工作流的脱敏证据；三段 HTML 和服务日志独立归档。
      # 路径只覆盖测试报告和合成状态帧，不包含系统临时目录中的私有会话缓存。
      # 同一产物同时收 M3-T21 旧询盘页脱敏 JSON/PNG 证据，不是 M3-T7 新验收。
      # M3-T24 规格编辑器：同 always 段收本卡三份脱敏 JSON 与四帧 PNG（列表/表单/已保存/返回）；
      # spec-video 的 .webm 已由上面的 *.webm 覆盖，不重复登记。仅加路径，不改门禁/retention。
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-t7-visual
          path: |
            test-results/**/*.webm
            test-results/**/admin-account-density.json
            test-results/**/admin-account-cleared.json
            test-results/**/admin-legacy-inquiries*.json
            test-results/**/inquiry-visual-*.png
            test-results/**/admin-legacy-specs.json
            test-results/**/admin-legacy-specs-visual.json
            test-results/**/admin-legacy-specs-states.json
            test-results/**/specs-*.png
            test-results/**/admin-legacy-model.json
            test-results/**/model-workflow-*.png
          retention-days: 1
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-evidence/
            .next/standalone-server.log
          retention-days: 7
          if-no-files-found: warn
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  # Ubuntu 上名单内的安全用例必须实跑并通过。缺符号链接、POSIX 路径或 0600 时测试记 skip，作业不能算通过。
  posix-storage-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: 存储权限与符号链接安全验收
        run: |
          set +e
          node --import tsx --test \
            --test-reporter=spec \
            --test-reporter=tap \
            --test-reporter-destination=stdout \
            --test-reporter-destination=posix-storage-security.tap \
            tests/prod-env-check.test.ts tests/storage-local.test.ts tests/storage.test.ts
          test_status=$?
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const tap = readFileSync('posix-storage-security.tap', 'utf8');
          // TAP 把标题里的 # 写成 \#。不还原时 #323 会显示通过，闸门却把它当成缺失。
          const unescapeTap = (value) => value.replaceAll('\\#', '#');
          const results = [];
          for (const line of tap.split(/\r?\n/)) {
            const match = line.match(/^\s*(ok|not ok)\s+\d+\s+-\s(.*)$/);
            if (!match) continue;
            const raw = match[2];
            const skipAt = raw.lastIndexOf(' # SKIP');
            if (match[1] === 'not ok') {
              const comment = raw.search(/ # /);
              results.push({ status: 'fail', name: unescapeTap(comment >= 0 ? raw.slice(0, comment) : raw), detail: line.trim() });
            } else if (skipAt >= 0) results.push({ status: 'skip', name: unescapeTap(raw.slice(0, skipAt)), detail: raw.slice(skipAt + 8).trim() });
            else results.push({ status: 'pass', name: unescapeTap(raw), detail: '' });
          }
          const counts = { pass: 0, fail: 0, skip: 0 };
          const rows = [];
          for (const result of results) {
            counts[result.status] += 1;
            rows.push(`${result.status.toUpperCase()}\t${result.name}${result.detail ? `\t${result.detail}` : ''}`);
          }
          const required = [
            'local 驱动：UPLOAD_DIR 缺失 / 相对 / 非规范 / 根目录 / public/.next 下 / 不可写 都拒绝启动，只报变量名不报路径',
            'local 驱动：默认 fs 检查真实目录（可写通过、不存在 / 只读 / 是文件 拒绝）',
            '#323 local 驱动：UPLOAD_DIR 先 realpath 再比 public/、.next/ 前缀（符号链接指进去也拒绝），只报变量名不报路径',
            '不跟随符号链接：目录或文件是符号链接（指向根目录外）时 get/put/delete 都拒绝，外部文件不受影响',
            '根目录本身是符号链接（挂载点）时正常工作：按 realpath 判断',
            'local: put/get/delete, private mode, no overwrite',
            '只读目录拒绝',
            '拒绝覆盖已有对象',
            '拒绝根目录',
            '拒绝不可写目录',
            '注入 realpath 指向 public 时拒绝',
          ];
          const problems = [];
          for (const name of required) {
            const hits = results.filter((result) => result.name === name);
            if (hits.length === 0) problems.push(`ABSENT\t${name}`);
            for (const hit of hits) if (hit.status !== 'pass') problems.push(`${hit.status.toUpperCase()}\t${name}\t${hit.detail}`);
          }
          const record = [
            `platform=${process.platform}`,
            `pass=${counts.pass}`,
            `fail=${counts.fail}`,
            `skip=${counts.skip}`,
            ...rows,
            ...problems,
          ].join('\n') + '\n';
          writeFileSync('posix-storage-security.record.txt', record);
          process.stdout.write(record);
          if (problems.length > 0 || counts.fail > 0) process.exit(1);
          EOF
          gate_status=$?
          set -e
          if [ "$test_status" -ne 0 ] || [ "$gate_status" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: posix-storage-security
