            const authCategories = new Set(), patterns = new Set();
            // Log shapes are stage evidence, not attribution to a particular HTTP request.
            for (const line of lines) {
              const auth = /^\[auth\]\[error\]\s+([A-Za-z]+):/.exec(line)?.[1];
              if (categories.has(auth)) { authCategories.add(auth); patterns.add(`AUTH_${auth}`); record.matchedProducerShapes.auth = true; }
              const next = /^\s*⨯\s+([A-Za-z]+)(?:\s*\[[A-Z_]+\])?:/.exec(line)?.[1];
              if (runtimeTypes.has(next)) { patterns.add(`NEXT_${next}`); record.matchedProducerShapes.nextPrefix = true; }
              const raw = /^([A-Za-z]+)(?:\s*\[[A-Z_]+\])?:/.exec(line)?.[1];
              if (runtimeTypes.has(raw)) { patterns.add(`RUNTIME_${raw}`); record.matchedProducerShapes.rawRuntime = true; }
              const code = /^\s*code:\s*['"]([A-Z_]+)['"],?\s*$/.exec(line)?.[1];
              if (nodeCodes.has(code)) { patterns.add(`NODE_${code}`); record.matchedProducerShapes.nodeCode = true; }
            }
            record.recognizedErrorCategories = [...authCategories].sort();
            record.recognizedLogPatterns = [...patterns].sort();
            record.logState = record.recognizedLogPatterns.length ? 'matched' : 'no_match';
          } catch (error) {
            if (error?.code !== 'ENOENT' || fd !== undefined) {
              record.logState = 'unavailable';
              record.category = 'LOG_UNAVAILABLE';
              failed = true;
            }
          } finally {
            if (fd !== undefined) {
              try { fs.closeSync(fd); }
              catch { record.logState = 'unavailable'; record.category = 'LOG_UNAVAILABLE'; failed = true; }
            }
          }
          try {
            const output = path.join(process.argv[3], `admin-legacy-inquiries-mail-auth-${mode}.json`);
            fs.writeFileSync(output, JSON.stringify(record, null, 2), { mode: 0o600, flag: 'wx' });
          } catch { failed = true; }
          if (failed) {
            console.error('MAIL_AUTH_SUMMARY_FAILED');
            process.exitCode = 1;
          }
          AUTH_SUMMARY
          }
          cleanup_driver() {
            result=$?
            trap - EXIT
            cleanup_failed=0
            # Diagnostic failures cannot skip fixture cleanup or replace a prior nonzero exit.
            if [[ -n "$auth_stage" ]]; then auth_summary || cleanup_failed=1; fi
            if [[ -n "$sink_pid" ]]; then
              if kill -0 "$sink_pid" 2>/dev/null; then kill -TERM "$sink_pid" || cleanup_failed=1; fi
              wait "$sink_pid" || cleanup_failed=1
            fi
            if [[ "$pg_started" == 1 ]]; then "$pg_bin/pg_ctl" -D /tmp/mail-evidence-pg -m fast -w stop >/dev/null 2>&1 || cleanup_failed=1; fi
            if [[ "$result" == 0 && "$cleanup_failed" != 0 ]]; then result=1; fi
            exit "$result"
          }
          trap cleanup_driver EXIT
          trap 'exit 143' TERM INT
          # /tmp is a private mount-namespace tmpfs. Its database, logs, sockets and cache vanish with the namespace.
          node "$smtp_script" exec --root "$root" --mode postgres -- "$pg_bin/initdb" -D /tmp/mail-evidence-pg -U postgres --auth-host=scram-sha-256 --auth-local=trust --pwfile="$root/pg.pass" >/dev/null
          pg_started=1
          "$pg_bin/pg_ctl" -D /tmp/mail-evidence-pg -l /tmp/mail-evidence-pg.log -o '-h 127.0.0.1 -p 5432 -k /tmp' -w start >/dev/null
          node "$smtp_script" exec --root "$root" --mode postgres -- "$pg_bin/createdb" -h 127.0.0.1 -p 5432 -U postgres mail_evidence
          node "$smtp_script" exec --root "$root" --mode postgres -- pnpm prisma db push --skip-generate
          node "$smtp_script" serve --root "$root" --report "$report_dir/admin-legacy-inquiries-smtp-final.json" &
          sink_pid=$!
          # Readiness is bounded; never repeat a failed product test.
          node --input-type=module -e 'const end=Date.now()+10000;for(;;){try{const r=await fetch("http://127.0.0.1:3998/health");if(r.status===200)break}catch{}if(Date.now()>end)throw Error("SMTP_READINESS_FAILED");await new Promise(r=>setTimeout(r,100))}'
          activate_build() {
            node --input-type=module - "$1" <<'ACTIVATE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          // Inline private driver activation; no build, font fetch, credentials, SMTP or PG operation is performed here.
          const mode = process.argv[2];
          assert.ok(['http-real', 'http-disabled', 'off'].includes(mode));
          const buildMode = mode === 'off' ? 'off' : 'http';
          const source = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(source, process.env.GITHUB_SHA);
          const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          const sha = (value) => createHash('sha256').update(value).digest('hex');
          const parent = fs.realpathSync(process.env.RUNNER_TEMP);
          const root = path.join(parent, `nbshiyan-mail-builds.${source}`);
          assert.equal(fs.realpathSync(root), root);
          const info = fs.lstatSync(root);
          assert.ok(info.isDirectory() && !info.isSymbolicLink() && info.uid === process.getuid() && (info.mode & 0o777) === 0o700);
          const owner = JSON.parse(fs.readFileSync(path.join(root, 'owner.json'), 'utf8'));
          const provenance = JSON.parse(fs.readFileSync(path.join(root, 'provenance.json'), 'utf8'));
          assert.equal(owner.inode, info.ino); assert.equal(owner.uid, info.uid); assert.equal(provenance.owner, owner.nonce);
          assert.equal(provenance.commit, source); assert.equal(provenance.tree, tree);
          assert.equal(provenance.lockSha256, sha(fs.readFileSync('pnpm-lock.yaml')));
          const directory = path.join(root, buildMode);
          const bytes = fs.readFileSync(path.join(directory, 'manifest.json'));
          assert.equal(sha(bytes), provenance.modes[buildMode].manifestSha256);
          const manifest = JSON.parse(bytes);
          function assertBuildIdentity(value, expected) {
            assert.equal(value.mode, expected.mode); assert.equal(value.commit, expected.commit); assert.equal(value.tree, expected.tree);
            assert.equal(value.lockSha256, expected.lockSha256); assert.equal(value.credentialsInBuildEnvironment, false);
          }
          assertBuildIdentity(manifest, { mode: buildMode, commit: source, tree, lockSha256: provenance.lockSha256 });
          const required = JSON.parse(fs.readFileSync(path.join(directory, 'app/.next/required-server-files.json'), 'utf8'));
          assert.equal(required.config.env.NEXT_PUBLIC_ADMIN_MAIL, buildMode);
          assert.equal(required.config.env.NEXT_PUBLIC_ADMIN_API, 'http');
          assert.equal(required.config.env.APP_ENV_AT_BUILD, 'test');
          const inventory = (dir, prefix = '') => {
            const result = {};
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const name = prefix ? `${prefix}/${entry.name}` : entry.name;
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) Object.assign(result, inventory(file, name));
              else { assert.ok(entry.isFile() && !fs.lstatSync(file).isSymbolicLink()); result[name] = sha(fs.readFileSync(file)); }
            }
            return result;
          };
          const expected = Object.fromEntries(Object.entries(manifest.files).filter(([name]) => name.startsWith('app/')).map(([name, digest]) => [name.slice(4), digest]));
          assert.deepEqual(inventory(path.join(directory, 'app')), expected);
          assert.equal(fs.readFileSync(path.join(directory, 'app/.next/BUILD_ID'), 'utf8').trim(), manifest.buildId);
          // /tmp is the reviewed private mount-namespace tmpfs. A fresh exact mode subdirectory avoids deleting or mutating earlier modes.
          const runtimeParent = '/tmp/mail-evidence-artifacts';
          fs.mkdirSync(runtimeParent, { mode: 0o700, recursive: true });
          assert.equal(fs.realpathSync(runtimeParent), runtimeParent);
          const active = path.join(runtimeParent, mode);
          assert.equal(fs.existsSync(active), false);
          fs.cpSync(path.join(directory, 'app'), active, { recursive: true, dereference: false });
          assert.deepEqual(inventory(active), expected);
          const receipt = { version: 1, sourceCommit: source, sourceTree: tree, buildMode, runtimeMode: mode, buildId: manifest.buildId,
            manifestSha256: sha(bytes), verifiedFiles: Object.keys(expected).length, businessCredentialsUsedInBuild: false };
          fs.writeFileSync(path.join(active, 'runtime-provenance.json'), JSON.stringify(receipt), { mode: 0o600, flag: 'wx' });
          console.log(JSON.stringify(receipt));
          ACTIVATE
          }
          probe_modules() {
            node --input-type=module - "$1" "$report_dir" <<'MODULE_PROBE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          import { execFileSync } from 'node:child_process';

          // Resolve from the activated artifact, never evaluate a dependency or load the compiled auth route.
          const modes = new Set(['http-real', 'http-disabled', 'off']);
          const codes = new Set(['MODULE_NOT_FOUND', 'ERR_MODULE_NOT_FOUND', 'ERR_PACKAGE_PATH_NOT_EXPORTED', 'ERR_INVALID_PACKAGE_CONFIG', 'ERR_PACKAGE_IMPORT_NOT_DEFINED', 'ENOENT', 'EACCES', 'EPERM']);
          const safeCode = (error) => codes.has(error?.code) ? error.code : 'OTHER_ERROR';
          const inside = (file, root) => { const relative = path.relative(root, file); return relative === '' || (!path.isAbsolute(relative) && relative !== '..' && !relative.startsWith(`..${path.sep}`)); };
          const regular = (file) => { const info = fs.lstatSync(file); return info.isFile() && !info.isSymbolicLink() && info.nlink === 1; };
          const privateDirectory = (directory) => {
            const info = fs.lstatSync(directory);
            assert.ok(info.isDirectory() && !info.isSymbolicLink() && info.uid === process.getuid() && (info.mode & 0o777) === 0o700);
            assert.equal(fs.realpathSync(directory), directory);
          };
          const readJson = (file, privateMode = false) => {
            let fd;
            try {
              assert.equal(typeof fs.constants.O_NOFOLLOW, 'number');
              fd = fs.openSync(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
              const info = fs.fstatSync(fd), limit = 65_536;
              assert.ok(info.isFile() && info.uid === process.getuid() && info.nlink === 1 && info.size <= limit);
              if (privateMode) assert.equal(info.mode & 0o777, 0o600);
              const buffer = Buffer.alloc(limit);
              let length = 0;
              while (length < limit) { const n = fs.readSync(fd, buffer, length, limit - length, null); if (n === 0) break; length += n; }
              const after = fs.fstatSync(fd);
              assert.ok(after.isFile() && after.uid === info.uid && after.nlink === 1 && after.size === info.size && length === info.size);
              return JSON.parse(buffer.subarray(0, length).toString('utf8'));
            } finally { if (fd !== undefined) fs.closeSync(fd); }
          };
          const unavailable = (dependencyId) => ({ dependencyId, resolved: false, resolvedInsideActive: false, entryRegularSingleLink: false, code: 'PARENT_ENTRY_UNAVAILABLE' });
          function probe(active, loader, request, dependencyId) {
            try {
              const file = fs.realpathSync(loader.resolve(request));
              // An ancestor/source-tree fallback is a negative result, not a usable parent entry.
              if (!inside(file, active)) return { record: { dependencyId, resolved: false, resolvedInsideActive: false, entryRegularSingleLink: false, code: 'RESOLVED_OUTSIDE_ARTIFACT' }, file: null };
              const plain = regular(file);
              return { record: { dependencyId, resolved: plain, resolvedInsideActive: true, entryRegularSingleLink: plain, code: plain ? null : 'ENTRY_NOT_REGULAR' }, file: plain ? file : null };
            } catch (error) { return { record: { dependencyId, resolved: false, resolvedInsideActive: false, entryRegularSingleLink: false, code: safeCode(error) }, file: null }; }
          }
          try {
            const mode = process.argv[2];
            assert.ok(modes.has(mode) && process.platform === 'linux' && process.env.CI === 'true' && process.env.GITHUB_ACTIONS === 'true');
            assert.ok(!process.env.NODE_PATH);
            const project = fs.realpathSync(process.cwd());
            const git = (...args) => execFileSync('git', args, { cwd: project, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim();
            const sourceCommit = git('rev-parse', 'HEAD'), sourceTree = git('rev-parse', 'HEAD^{tree}');
            assert.ok(/^[a-f0-9]{40}$/.test(sourceCommit) && /^[a-f0-9]{40}$/.test(sourceTree));
            assert.equal(sourceCommit, process.env.GITHUB_SHA);
            const parent = '/tmp/mail-evidence-artifacts', active = path.join(parent, mode);
            privateDirectory(parent); privateDirectory(active);
            assert.ok(regular(path.join(active, 'server.js')));
            const receipt = readJson(path.join(active, 'runtime-provenance.json'), true);
            assert.equal(receipt.version, 1);
            assert.equal(receipt.sourceCommit, sourceCommit); assert.equal(receipt.sourceTree, sourceTree);
            assert.equal(receipt.runtimeMode, mode); assert.equal(receipt.buildMode, mode === 'off' ? 'off' : 'http');
            assert.equal(receipt.businessCredentialsUsedInBuild, false);
            assert.ok(/^[A-Za-z0-9_-]{1,128}$/.test(receipt.buildId) && /^[a-f0-9]{64}$/.test(receipt.manifestSha256));
            assert.ok(Number.isSafeInteger(receipt.verifiedFiles) && receipt.verifiedFiles > 0);
            const outputDirectory = path.join(project, 'test-results/mail-evidence-preflight');
            assert.equal(process.argv[3], outputDirectory); privateDirectory(outputDirectory);
            const loader = createRequire(path.join(active, 'server.js')), checks = [], entries = {};
            for (const [dependencyId, request] of Object.entries({ PRISMA_CLIENT: '@prisma/client', ARGON2: '@node-rs/argon2', NEXT: 'next' })) {
              const result = probe(active, loader, request, dependencyId);
              checks.push(result.record); if (result.file) entries[dependencyId] = result.file;
            }
            if (entries.PRISMA_CLIENT) {
              const generated = probe(active, createRequire(entries.PRISMA_CLIENT), '.prisma/client/default', 'PRISMA_GENERATED');
              checks.push(generated.record);
              checks.push(generated.file ? probe(active, createRequire(generated.file), '#main-entry-point', 'PRISMA_GENERATED_MAIN').record : unavailable('PRISMA_GENERATED_MAIN'));
            } else checks.push(unavailable('PRISMA_GENERATED'), unavailable('PRISMA_GENERATED_MAIN'));
            const nativeChecksApplicable = process.arch === 'x64';
            // GNU and musl are alternatives; missing one is evidence, not a demand to install both.
            if (nativeChecksApplicable) for (const [dependencyId, request] of [
              ['ARGON2_GNU_LOCAL', './argon2.linux-x64-gnu.node'], ['ARGON2_GNU_PACKAGE', '@node-rs/argon2-linux-x64-gnu'],
              ['ARGON2_MUSL_LOCAL', './argon2.linux-x64-musl.node'], ['ARGON2_MUSL_PACKAGE', '@node-rs/argon2-linux-x64-musl'],
            ]) checks.push(entries.ARGON2 ? probe(active, createRequire(entries.ARGON2), request, dependencyId).record : unavailable(dependencyId));
            let authRouteRegular = false, authRouteManifestMatches = false;
            try {
              authRouteRegular = regular(path.join(active, '.next/server/app/api/auth/[...nextauth]/route.js'));
              authRouteManifestMatches = readJson(path.join(active, '.next/server/app-paths-manifest.json'))['/api/auth/[...nextauth]/route'] === 'app/api/auth/[...nextauth]/route.js';
            } catch { /* These file checks remain negative; no route is loaded and no raw error is emitted. */ }
            const record = { version: 1, mode, buildMode: receipt.buildMode, sourceCommit, sourceTree, buildId: receipt.buildId, manifestSha256: receipt.manifestSha256,
              phase: 'after_activation_before_server', artifactBound: true, causalRequestBound: false, dependencyChecks: checks, nativeChecksApplicable,
              authRouteRegular, authRouteManifestMatches, dependenciesEvaluated: false, rawErrorIncluded: false, pathsIncluded: false, environmentValuesIncluded: false };
            fs.writeFileSync(path.join(outputDirectory, `admin-legacy-inquiries-mail-modules-${mode}.json`), JSON.stringify(record, null, 2), { mode: 0o600, flag: 'wx' });
            // Negative resolution results are evidence; the original CSRF/business chain still executes.
          } catch { console.error('MAIL_MODULE_PROBE_FAILED'); process.exitCode = 1; }
          MODULE_PROBE
          }
          auth_stage=http-real
          activate_build http-real
          probe_modules http-real
          node "$smtp_script" exec --root "$root" --mode http-real -- pnpm exec playwright test --config tests/evidence/mail-evidence.config.ts
          auth_stage=http-disabled
          activate_build http-disabled
          probe_modules http-disabled
          node "$smtp_script" exec --root "$root" --mode http-disabled -- pnpm exec playwright test --config tests/evidence/mail-evidence.config.ts
          # off selects a separately prepared real artifact from the same checkout, not a runtime mutation.
          auth_stage=off
          activate_build off
          probe_modules off
          node "$smtp_script" exec --root "$root" --mode off -- pnpm exec playwright test --config tests/evidence/mail-evidence.config.ts
          DRIVER
          chmod 600 "$root/driver.sh"
          # PID 1 owns the lifetime. Parent stdin EOF, a deadline, signal or driver failure ends that PID namespace.
          # Kernel namespace teardown also covers detached PostgreSQL daemons; traps remain for graceful file cleanup only.
          namespace_budget=18m
          [[ "$mode" == preflight-only ]] && namespace_budget=3m
          timeout --signal=TERM --kill-after=10s "$namespace_budget" node "$smtp_script" namespace-launch --root "$root" --project "$project" --scenario "$mode" --report-dir "$report_dir"
      - name: Cleanup owned private fixture
        if: always()
        shell: bash
        run: |
          if [[ -n "${SMTP_EVIDENCE_PRIVATE_ROOT:-}" && -d "$SMTP_EVIDENCE_PRIVATE_ROOT" ]]; then
            node tests/evidence/local-smtp.mjs cleanup --root "$SMTP_EVIDENCE_PRIVATE_ROOT"
          fi
      - name: Cleanup verified preparation artifacts
        if: always()
        shell: bash
        run: |
          if [[ -n "${SMTP_EVIDENCE_BUILD_ROOT:-}" && -d "$SMTP_EVIDENCE_BUILD_ROOT" ]]; then
            node --input-type=module <<'CLEAN_BUILDS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';

          // Preparation cleanup only; validates the exact owner-bound artifact directory before deletion.
          const root = process.env.SMTP_EVIDENCE_BUILD_ROOT;
          assert.ok(root && path.isAbsolute(root));
          assert.equal(path.dirname(root), fs.realpathSync(process.env.RUNNER_TEMP));
          assert.ok(path.basename(root).startsWith('nbshiyan-mail-builds.'));
          assert.equal(fs.realpathSync(root), root);
          const stat = fs.lstatSync(root);
          assert.ok(stat.isDirectory() && !stat.isSymbolicLink() && stat.uid === process.getuid());
          const owner = JSON.parse(fs.readFileSync(path.join(root, 'owner.json'), 'utf8'));
          assert.equal(owner.inode, stat.ino); assert.equal(owner.uid, stat.uid);
          assert.equal(root, path.join(fs.realpathSync(process.env.RUNNER_TEMP), `nbshiyan-mail-builds.${owner.commit}`));
          const known = new Set(['http', 'off', 'owner.json', 'provenance.json']);
          for (const name of fs.readdirSync(root)) {
            assert.ok(known.has(name));
            const info = fs.lstatSync(path.join(root, name));
            assert.equal(info.isSymbolicLink(), false);
          }
          for (const mode of ['http', 'off']) {
            const directory = path.join(root, mode);
            if (!fs.existsSync(directory)) continue;
            const manifest = JSON.parse(fs.readFileSync(path.join(directory, 'manifest.json'), 'utf8'));
            assert.equal(manifest.commit, owner.commit); assert.equal(manifest.mode, mode);
            const seen = new Set();
            const inspect = (dir, prefix = '') => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const name = prefix ? `${prefix}/${entry.name}` : entry.name;
                const file = path.join(dir, entry.name);
                if (entry.isDirectory()) inspect(file, name);
                else {
                  const info = fs.lstatSync(file);
                  assert.ok(entry.isFile() && !info.isSymbolicLink() && info.nlink === 1);
                  if (name === 'manifest.json') continue;
                  assert.equal(createHash('sha256').update(fs.readFileSync(file)).digest('hex'), manifest.files[name]);
                  seen.add(name);
                }
              }
            };
            inspect(directory);
            assert.deepEqual([...seen].sort(), Object.keys(manifest.files).sort());
          }
          // Partial, missing-manifest or unknown-content outputs are rejected and preserved, never deleted blindly.
          // Only this preparation-owned output is removed; source .next and user data are not cleanup targets.
          fs.rmSync(root, { recursive: true, force: false });
          console.log(JSON.stringify({ preparedArtifactCleanup: true, filesOutsideOwnedRootTouched: false }));
          CLEAN_BUILDS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-t21-mail-evidence
          path: |
            test-results/**/admin-legacy-inquiries*.json
            test-results/**/inquiry-visual-*.png
            test-results/**/*.webm
          retention-days: 1
          if-no-files-found: error
