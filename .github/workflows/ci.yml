          # Named-case evidence. The 26 above is still owned by the exact file gate; this only
          # persists WHICH 26 ran. Nothing captured from the TAP is printed or written: every
          # output token comes from the fixed tables below (labels, zones, case list) or is a
          # validated small integer. No TAP body, diagnostics block or title text leaves the job.
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const SUITE = 'M4-T4 notification PostgreSQL';
          const LABELS = ['AC1/S1', 'AC3/AC2', 'AC2b/AC11b', 'AC4', 'AC5', 'AC6a-e', 'AC6f/K3', 'AC7/K2', 'AC7b', 'AC8', 'AC9', 'AC10', 'AC11', 'AC12', 'AC13', 'AC14', 'AC15', 'AC16', 'AC-INV/K4', 'AC17', 'AC18', 'F04', 'F08', 'F02', 'AC-T', 'F05'];
          const ZONES = ['Asia/Shanghai', 'America/Los_Angeles'];
          const CASES = 'AC1/S1,AC3/AC2,AC7/K2';
          const lines = readFileSync('/tmp/pg-regressions.tap', 'utf8').split(/\r?\n/);
          const problems = [];
          const opens = [];
          lines.forEach((line, index) => { if (line === `# Subtest: ${SUITE}`) opens.push(index); });
          const seen = new Map(LABELS.map((label) => [label, []]));
          let unexpected = 0;
          if (opens.length !== 1) problems.push(`SUITE_COUNT_${opens.length}`);
          if (opens.length >= 1) {
            let end = -1;
            for (let i = opens[0] + 1; i < lines.length; i += 1) {
              const close = lines[i].match(/^(ok|not ok) \d+ - M4-T4 notification PostgreSQL$/);
              if (close) { end = i; if (close[1] !== 'ok') problems.push('SUITE_NOT_OK'); break; }
            }
            if (end < 0) { problems.push('SUITE_UNTERMINATED'); end = lines.length; }
            for (let i = opens[0] + 1; i < end; i += 1) {
              const child = lines[i].match(/^ {4}(ok|not ok) \d+ - (.*)$/);
              if (!child) continue;
              const title = child[2];
              const cut = title.indexOf('：');
              const label = cut > 0 ? title.slice(0, cut) : '';
              if (!seen.has(label)) { unexpected += 1; continue; }
              const directive = / # (SKIP|TODO)\b/i.test(title);
              seen.get(label).push(child[1] === 'not ok' ? 'fail' : directive ? 'skip' : 'pass');
            }
          }
          const rows = [];
          let passed = 0;
          for (const label of LABELS) {
            const marks = seen.get(label);
            const status = marks.length === 0 ? 'missing' : marks.length > 1 ? 'duplicate' : marks[0];
            if (status === 'pass') passed += 1; else problems.push(`CASE_${status.toUpperCase()}_${label}`);
            rows.push(`M4T4_NAMED ${status} ${label}`);
          }
          if (unexpected > 0) problems.push(`UNEXPECTED_CASES_${Math.min(unexpected, 99)}`);
          rows.push(`M4T4_NAMED_SUMMARY expected=${LABELS.length} pass=${passed} other=${LABELS.length - passed} unexpected=${Math.min(unexpected, 99)}`);
          const rounds = new Map();
          let strays = 0;
          for (const line of lines) {
            const hit = line.match(/^# AC_T (Asia\/Shanghai|America\/Los_Angeles) passed=(\d{1,3}) cases=([A-Za-z0-9\/,]{1,64})$/);
            if (!hit) { if (/^# AC_T /.test(line)) strays += 1; continue; }
            rounds.set(hit[1], [...(rounds.get(hit[1]) ?? []), { passed: Number(hit[2]), cases: hit[3] === CASES }]);
          }
          if (strays > 0) problems.push('AC_T_UNRECOGNISED');
          for (const zone of ZONES) {
            const found = rounds.get(zone) ?? [];
            const good = found.length === 1 && found[0].passed === 3 && found[0].cases;
            rows.push(`M4T4_AC_T zone=${zone} rounds=${found.length} ${good ? `passed=3 cases=${CASES}` : 'not_proven'}`);
            if (!good) problems.push(`AC_T_${zone.replace('/', '_')}`);
          }
          rows.push(problems.length === 0 ? 'M4T4_NAMED_GATE PASS' : `M4T4_NAMED_GATE FAIL problems=${problems.length}`);
          writeFileSync('/tmp/m4t4-named.tsv', `${rows.join('\n')}\n`);
          console.log(rows.join('\n'));
          if (problems.length > 0) {
            for (const problem of problems) console.error(`M4T4_NAMED_GATE ${problem}`);
            process.exit(1);
          }
          EOF
      - name: Action grant PostgreSQL lock-wait evidence
