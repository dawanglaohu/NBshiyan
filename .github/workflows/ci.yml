            if (!fs.existsSync(mainPath)) failGate('BINDING_MAIN_REPORT_MISSING');
            const mainDigest = digestOf(mainPath).sha256;
            expect(/^j7-retryable\/(?:1|2)$/.test(String(report.schema)), 'BINDING_SCHEMA');
            expect(report.jobKey === 'analytics-aggregate' && report.sameKey === true, 'BINDING_KEY');
            expect(report.attempts === 2, 'BINDING_ATTEMPTS');
            expect(report.run && report.run.workflow === 'CI' && report.run.id === runId && report.run.attempt === runAttempt, 'BINDING_RUN');
            expect(report.source && report.source.commit === head && report.source.tree === tree, 'BINDING_SOURCE');
            expect(report.build && report.build.buildId === get('buildId'), 'BINDING_BUILD');
            if (report.schema === 'j7-retryable/2') {
              expect(report.build && report.build.serverJsSha256 === get('serverJsSha256'), 'BINDING_BUILD_SHA');
              expect(
                report.app &&
                  report.app.origin === `http://localhost:${get('fullPort')}` &&
                  Number(report.app.pid) === asInt('fullPid') &&
                  typeof report.app.startTicks === 'string' &&
                  /^[0-9]+$/.test(report.app.startTicks) &&
                  (!expectedApp || (report.app.startTicks === expectedApp.startTicks && Number(report.app.pid) === Number(expectedApp.pid))),
                'BINDING_APP',
              );
            }
            expect(
              report.pg &&
                report.pg.database === get('fullDb') &&
                normSha(report.pg.clusterSha256) === normSha(get('pgServiceClusterSha256')) &&
                report.pg.versionNum === asInt('pgServiceVersionNum'),
              'BINDING_PG',
            );
            expect(report.anchor && report.anchor.mainProbeReportSha256 === mainDigest, 'BINDING_ANCHOR');
            expect(report.anchor && report.anchor.errorCode === 'version_conflict', 'BINDING_ANCHOR_CODE');
            expect(report.before && report.before.status === 'FAILED' && Number.isInteger(report.before.generation), 'BINDING_BEFORE');
            expect(report.anchor && report.anchor.expectedFailedGeneration === report.before.generation, 'BINDING_ANCHOR_GEN');
            expect(report.after && report.after.status === 'SUCCEEDED' && report.after.generation === report.before.generation + 1, 'BINDING_GENERATION');
            expect(report.after && report.after.lastErrorCode === null, 'BINDING_AFTER_CODE');
            const checks = report.checks;
            expect(
              checks &&
                typeof checks === 'object' &&
                checks.sameKey === true &&
                checks.errorCleared === true &&
                checks.successAdvanced === true &&
                checks.leaseReleased === true &&
                checks.otherKeysUnchanged === true &&
                checks.generationDelta === 1,
              'BINDING_CHECKS',
            );
            expect(Array.isArray(report.otherKeys), 'BINDING_OTHER_KEYS');
            expect(report.window && Date.parse(report.window.startedAt) <= Date.parse(report.window.endedAt), 'BINDING_WINDOW');
            expect(report.http && report.http.status === 200 && report.http.bodyStatus === 'SUCCEEDED', 'BINDING_HTTP');
            process.stdout.write('J7_RETRYABLE_BINDING_OK\n');
          }

          const mode = process.argv[2];
          if (mode === 'cleanup') {
            const out = arg('--out');
            if (!out) failGate('OUT_MISSING');
            const report = buildCleanup();
            fs.writeFileSync(out, `${JSON.stringify(report, null, 2)}\n`, { encoding: 'utf8' });
            process.stdout.write('J7_CLEANUP_OK\n');
          } else if (mode === 'gate') {
            gate();
          } else if (mode === 'schema') {
            probeSchema();
          } else if (mode === 'retryable') {
            retryableGate();
          } else {
            process.stderr.write('J7_OBSERVE_MODE\n');
            process.exit(2);
          }
          OBSERVE_EOF

          phase=preflight
          budget_check
          observe_ports_before
          printf 'J7_PORT_OBS before=free ports=3100,3101,3999 probe=ports.cjs+3101\n'

          # 4) 全实例：hosted PG17 的既有 e2e 库（A3 已建 schema/JobState），同一 3100。
          phase=j7-full
          budget_check
          start_app "$full_port" "$private/server-3100.log"
          full_pid=$STARTED_PID
          full_alt=$STARTED_ALT
          printf 'J7_APP_START port=%s pid=%s\n' "$full_port" "$full_pid"
          wait_health "$full_port" "$full_pid"
          fact fullPort "$full_port"
          fact fullPid "$full_pid"
          fact fullHealth "$HEALTH_STATUS"
          fact fullHealthChecks "$HEALTH_CHECKS"
          fact fullListening true

          # 4a) 首次监听观测：同一 PID 的 origin/startTicks 供 retryable 的 expect 使用（full 探针之前）。
          retryable_app="$private/retryable-app.json"
          observe_limit="$J7_OBSERVE_APP_TIMEOUT_S"
          observe_remaining=$((J7_STEP_BUDGET_S - (SECONDS - started) - J7_FINALIZE_RESERVE_S))
          (( observe_remaining > 5 )) || fail 'J7_BUDGET_EXCEEDED:observe-app'
          (( observe_limit > observe_remaining )) && observe_limit="$observe_remaining"
          observe_rc=0
          run_bounded "$observe_limit" env J7_REPO="$ws" \
            node tests/evidence/j7-retryable.mjs observe-app --origin "http://localhost:$full_port" --pid "$full_pid" \
            >"$retryable_app" 2>"$private/observe-app.err" || observe_rc=$?
          if (( observe_rc == 124 )); then fail 'J7_OBSERVE_APP_TIMEOUT'; fi
          if (( observe_rc == 125 )); then fail 'J7_BUDGET_EXCEEDED:observe-app'; fi
          if (( observe_rc != 0 )); then
            grep -E '^J7_RETRYABLE_[A-Z0-9_:.,-]{1,160}$' "$private/observe-app.err" | head -n 3 >&2 || true
            fail 'J7_RETRYABLE_OBSERVE_FAILED'
          fi
          node -e '
            const fs = require("node:fs");
            const app = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (app.origin !== process.argv[2] || Number(app.pid) !== Number(process.argv[3]) || typeof app.startTicks !== "string" || !/^[0-9]+$/.test(app.startTicks)) process.exit(1);
          ' "$retryable_app" "http://localhost:$full_port" "$full_pid" || fail 'J7_RETRYABLE_APP_BINDING'
          app_start_ticks="$(node -e 'const fs=require("node:fs");const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(a.startTicks)' "$retryable_app")" || fail 'J7_RETRYABLE_APP_BINDING'
          printf 'J7_FIRST_APP_BINDING={"runId":%s,"runAttempt":%s,"job":"%s","event":"%s","ref":"%s","head":"%s","tree":"%s","pid":%s,"startTicks":"%s"}\n' \
            "${GITHUB_RUN_ID:-0}" "${GITHUB_RUN_ATTEMPT:-0}" "${GITHUB_JOB:-unknown}" "${GITHUB_EVENT_NAME:-unknown}" "${GITHUB_REF:-unknown}" "$head" "$tree" "$full_pid" "$app_start_ticks"

          # 4a2) Prepare the same-instance JobState rows before the full /3 probe records its baseline.
          [[ -n "${DATABASE_URL:-}" && -n "${CRON_SECRET:-}" ]] || fail 'J7_JOBSTATE_PREFLIGHT_ENV'
          jobstate_expect="$private/jobstate-preflight-expect.json"
          if ! node - "$retryable_app" "$full_pid" "$app_start_ticks" "$full_port" \
            "$pg_version_before" "$full_db" "$pg_cluster_before" "$jobstate_expect" \
            2>"$private/jobstate-expect.err" <<'JOBSTATE_EXPECT_EOF'
          const fs = require('node:fs');
          const [observed, pid, ticks, port, version, database, cluster, out] = process.argv.slice(2);
          const info = fs.lstatSync(observed);
          if (!info.isFile() || info.size === 0 || info.size > 4096) process.exit(1);
          const app = JSON.parse(fs.readFileSync(observed, 'utf8'));
          const appPid = Number(pid);
          if (port !== '3100' || !Number.isSafeInteger(appPid) || appPid <= 1 ||
              app?.origin !== 'http://localhost:3100' || app.pid !== appPid ||
              typeof app.startTicks !== 'string' || app.startTicks !== ticks || !/^[1-9]\d{0,31}$/.test(ticks) ||
              !/^17\d{4}$/.test(version) || database !== 'e2e' || !/^[0-9a-f]{64}$/i.test(cluster) || /^0{64}$/.test(cluster)) {
            process.exit(1);
          }
          const expect = {
            app: { origin: app.origin, pid: appPid, startTicks: app.startTicks },
            pg: { versionNum: Number(version), database, clusterSha256: cluster },
          };
          fs.writeFileSync(out, `${JSON.stringify(expect)}\n`, { encoding: 'utf8', flag: 'wx', mode: 0o600 });
          JOBSTATE_EXPECT_EOF
          then
            fail 'J7_JOBSTATE_PREFLIGHT_EXPECT'
          fi
          jobstate_remaining=$((J7_STEP_BUDGET_S - (SECONDS - started) - J7_FINALIZE_RESERVE_S))
          (( jobstate_remaining > 0 )) || fail 'J7_BUDGET_EXCEEDED:jobstate-preflight'
          jobstate_limit=75
          (( jobstate_limit > jobstate_remaining )) && jobstate_limit="$jobstate_remaining"
          jobstate_rc=0
          run_bounded "$jobstate_limit" env J7_ALLOW_WRITES=1 J7_REPO="$ws" \
            J7_PROBE_DB_URL="$DATABASE_URL" J7_CRON_SECRET="$CRON_SECRET" \
            node tests/evidence/j7-jobstate-preflight.mjs --expect "$jobstate_expect" \
            >"$private/jobstate-preflight.out" 2>"$private/jobstate-preflight.err" || jobstate_rc=$?
          case "$jobstate_rc" in
            0) ;;
            124) fail 'J7_JOBSTATE_PREFLIGHT_TIMEOUT' ;;
            125) fail 'J7_BUDGET_EXCEEDED:jobstate-preflight' ;;
            *) fail 'J7_JOBSTATE_PREFLIGHT_FAILED' ;;
          esac
          [[ ! -s "$private/jobstate-preflight.err" ]] && \
            cmp -s "$private/jobstate-preflight.out" <(printf 'J7_JOBSTATE_PREFLIGHT_OK\n') || fail 'J7_JOBSTATE_PREFLIGHT_MARKER'
          printf 'J7_JOBSTATE_PREFLIGHT_OK\n'

          observe_port_in_use "$full_port" "$full_pid" "$full_alt"
          rc=0
          run_bounded "$J7_PROBE_TIMEOUT_S" env \
            J7_MODE=full J7_ALLOW_WRITES=1 J7_APP_URL="http://localhost:$full_port" \
            J7_PROBE_DB_URL="${DATABASE_URL:?DATABASE_URL_REQUIRED}" \
            J7_STANDALONE_DIR="$ws/.next/standalone" J7_REPO="$ws" \
            J7_SOURCE_COMMIT="$head" J7_SOURCE_TREE="$tree" J7_BUILD_ID="$build_id" \
            J7_RUN_ID="${GITHUB_RUN_ID:?}" J7_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:?}" J7_WORKFLOW=CI \
            J7_EXPECT_PG_MAJOR=17 \
            J7_CRON_SECRET="${CRON_SECRET:?CRON_SECRET_REQUIRED}" J7_ADMIN_TOTP_SECRET="$totp" \
            J7_PROBE_TIMEOUT_MS=60000 J7_REPORT="$report_full" \
            node tests/evidence/j7-attribution-probe.mjs >"$private/probe-full.out" 2>"$private/probe-full.err" || rc=$?
          if (( rc == 125 )); then
            fail "J7_BUDGET_EXCEEDED:$phase"
          fi
          if (( rc != 0 )); then
            grep -E '^J7_PROBE_FAILED:[A-Za-z0-9_:.,-]{1,160}$' "$private/probe-full.err" | head -n 3 >&2 || true
            fail "J7_PROBE_FAILED:full:$rc"
          fi
          grep -qx 'J7_PROBE_OK' "$private/probe-full.out" || fail 'J7_PROBE_MARKER_MISSING:full'
          [[ -f "$report_full" && ! -L "$report_full" && -s "$report_full" ]] || fail 'J7_REPORT_MISSING:full'
          if ! node "$private/j7-observe.cjs" schema --mode formal --facts "$facts" --report "$report_full" >"$private/schema.log" 2>&1; then
            cat "$private/schema.log" >&2
            fail 'J7_PROBE_SCHEMA_FORMAL'
          fi
          fact fullProbeExit 0

          # 4b) retryable：同一实例、同一库、同一构建；主报告写妥后、停 full 之前。
          #     先按 CONTRACT 生成闭集 expect（probeSha256 从原报告字节独立复算），再 produce 一次真实调用。
          #     产物固定名 J7-RETRYABLE.json，只在 $RUNNER_TEMP，独立命名上传；主三件目录不许多出文件。
          phase=j7-retryable
          budget_check
          retryable_expect="$private/retryable-expect.json"
          node - "$facts" "$report_full" "$retryable_app" "$retryable_expect" <<'EXPECT_EOF'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const [factsPath, probePath, appPath, outPath] = process.argv.slice(2);
          const facts = new Map();
          for (const line of fs.readFileSync(factsPath, 'utf8').split('\n')) {
            if (!line) continue;
            const tab = line.indexOf('\t');
            if (tab > 0) facts.set(line.slice(0, tab), line.slice(tab + 1));
          }
          const probeBytes = fs.readFileSync(probePath);
          const probe = JSON.parse(probeBytes.toString('utf8'));
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          if (!probe.failureAttribution || !Number.isInteger(probe.failureAttribution.failed && probe.failureAttribution.failed.generation)) {
            process.stderr.write('J7_RETRYABLE_EXPECT_GENERATION\n');
            process.exit(1);
          }
          const expect = {
            schema: 'j7-retryable-expect/1',
            run: { workflow: 'CI', job: facts.get('job'), id: Number(facts.get('runId')), attempt: Number(facts.get('runAttempt')) },
            source: { commit: facts.get('head'), tree: facts.get('tree') },
            build: { buildId: facts.get('buildId'), serverJsSha256: facts.get('serverJsSha256') },
            pg: { versionNum: Number(facts.get('pgServiceVersionNum')), database: facts.get('fullDb'), clusterSha256: facts.get('pgServiceClusterSha256') },
            app: { origin: app.origin, pid: Number(app.pid), startTicks: app.startTicks },
            probeSha256: crypto.createHash('sha256').update(probeBytes).digest('hex').toUpperCase(),
            expectedFailedGeneration: probe.failureAttribution.failed.generation,
          };
          fs.writeFileSync(outPath, JSON.stringify(expect, null, 2) + '\n');
          EXPECT_EOF
          retryable_json="$private/J7-RETRYABLE.json"
          rc=0
          run_bounded "$J7_RETRYABLE_TIMEOUT_S" env \
            J7_ALLOW_WRITES=1 J7_REPO="$ws" J7_STANDALONE_DIR="$ws/.next/standalone" \
            J7_PROBE_DB_URL="${DATABASE_URL:?}" DATABASE_URL="${DATABASE_URL:?}" \
            J7_CRON_SECRET="${CRON_SECRET:?}" J7_RETRYABLE_TIMEOUT_MS="$J7_RETRYABLE_INTERNAL_TIMEOUT_MS" \
            node tests/evidence/j7-retryable.mjs produce --expect "$retryable_expect" --probe "$report_full" --out "$retryable_json" \
            >"$private/retryable.out" 2>"$private/retryable.err" || rc=$?
          if (( rc == 124 )); then
            fail 'J7_RETRYABLE_TIMEOUT'
          fi
          if (( rc == 125 )); then
            fail "J7_BUDGET_EXCEEDED:$phase"
          fi
          if (( rc != 0 )); then
            grep -E '^J7_RETRYABLE_[A-Z0-9_:.,-]{1,160}$' "$private/retryable.err" | head -n 3 >&2 || true
            fail "J7_RETRYABLE_FAILED:$rc"
          fi
          grep -qx 'J7_RETRYABLE_OK' "$private/retryable.out" || fail 'J7_RETRYABLE_MARKER_MISSING'
          [[ "$(basename "$retryable_json")" == 'J7-RETRYABLE.json' ]] || fail 'J7_RETRYABLE_NAME'
          [[ -f "$retryable_json" && ! -L "$retryable_json" ]] || fail 'J7_RETRYABLE_FILE'
          retryable_bytes="$(wc -c < "$retryable_json" | tr -d ' ')"
          (( retryable_bytes > 0 && retryable_bytes <= 1048576 )) || fail "J7_RETRYABLE_SIZE:$retryable_bytes"
          fact retryableSha256 "$(sha256_upper "$retryable_json")"
          node "$private/j7-observe.cjs" retryable --facts "$facts" --evidence-dir "$ws/$evidence_dir" \
            --app "$retryable_app" --report "$retryable_json" >"$private/retryable-gate.log" 2>&1 || {
            cat "$private/retryable-gate.log" >&2
            rcode="$(sed -n 's/^J7_SAFE_FILES_FAIL://p' "$private/retryable-gate.log" | tail -n 1)"
            [[ "$rcode" =~ ^[A-Za-z0-9_:.,-]{1,120}$ ]] || rcode='BINDING_FAILED'
            fail "J7_RETRYABLE_${rcode}"
          }
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            printf 'retryable=1\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'J7_RETRYABLE_BOUND ok=1 anchor=%s sha=%s\n' "$(sha256_upper "$report_full")" "$(sha256_upper "$retryable_json")"
          stop_instance full "$full_port" "$full_pid" || fail "$STOP_CODE"
          full_pid=''

          # 5) 无数据实例：同一 cluster 的唯一空库 e2e_j7_<12hex>，端口 3101。
          phase=j7-nodata
          budget_check
          fresh_db="e2e_j7_$(openssl rand -hex 6)"
          [[ "$fresh_db" =~ ^e2e_j7_[0-9a-f]{12}$ ]] || fail 'J7_DB_NAME_INVALID'
          exists="$(docker exec "$PG_CONTAINER_ID" psql -U postgres -d postgres -tAc \
            "SELECT count(*) FROM pg_database WHERE datname = '$fresh_db'" 2>"$private/db-query.err" | tr -d ' \r\n')" \
            || fail 'J7_DB_QUERY_FAILED'
          [[ "$exists" == 0 ]] || fail 'J7_DB_NAME_COLLISION'
          docker exec "$PG_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE \"$fresh_db\"" >"$private/db-create.log" 2>&1 || fail 'J7_DB_CREATE_FAILED'
          db_created=1
          fact freshDb "$fresh_db"
          fact freshDbCreated true
          pg_version="$PG_VERSION_NUM"
          psql_bounded "$fresh_db" 'SELECT current_database()' "$private/fresh-db-identity.raw" \
            || fail 'J7_FRESH_DB_IDENTITY_MISMATCH'
          [[ "$(tr -d ' \r\n' < "$private/fresh-db-identity.raw")" == "$fresh_db" ]] || fail 'J7_FRESH_DB_IDENTITY_MISMATCH'
          fact freshDbIdentityVerified true
          fresh_url="postgresql://postgres:postgres@localhost:5432/$fresh_db"
          rc=0
          run_bounded "$J7_DB_PUSH_TIMEOUT_S" db_push "$fresh_url" >"$private/db-push.log" 2>&1 || rc=$?
          if (( rc == 125 )); then
            fail "J7_BUDGET_EXCEEDED:$phase"
          fi
          (( rc == 0 )) || fail "J7_DB_PUSH_FAILED:$rc"
          count="$(docker exec "$PG_CONTAINER_ID" psql -U postgres -d "$fresh_db" -tAc \
            'SELECT count(*) FROM "Model3D"' 2>"$private/db-empty.err" | tr -d ' \r\n')" || fail 'J7_FRESH_DB_NOT_MIGRATED'
          [[ "$count" == 0 ]] || fail "J7_FRESH_DB_NOT_EMPTY:$count"
          fact freshDbEmpty true

          start_app "$nodata_port" "$private/server-3101.log" \
            "DATABASE_URL=$fresh_url" "APP_ORIGIN=http://localhost:$nodata_port" "AUTH_URL=http://localhost:$nodata_port"
          nodata_pid=$STARTED_PID
          nodata_alt=$STARTED_ALT
          printf 'J7_APP_START port=%s pid=%s db=%s\n' "$nodata_port" "$nodata_pid" "$fresh_db"
          wait_health "$nodata_port" "$nodata_pid"
          fact nodataPort "$nodata_port"
          fact nodataPid "$nodata_pid"
          fact nodataHealth "$HEALTH_STATUS"
          fact nodataHealthChecks "$HEALTH_CHECKS"
          fact nodataListening true
          observe_port_in_use "$nodata_port" "$nodata_pid" "$nodata_alt"
          rc=0
          run_bounded "$J7_PROBE_TIMEOUT_S" env \
            DATABASE_URL="$fresh_url" J7_MODE=nodata J7_APP_URL="http://localhost:$nodata_port" \
            J7_PROBE_DB_URL="$fresh_url" \
            J7_STANDALONE_DIR="$ws/.next/standalone" J7_REPO="$ws" \
            J7_SOURCE_COMMIT="$head" J7_SOURCE_TREE="$tree" J7_BUILD_ID="$build_id" \
            J7_RUN_ID="${GITHUB_RUN_ID:?}" J7_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:?}" J7_WORKFLOW=CI \
            J7_EXPECT_PG_MAJOR=17 \
            J7_ADMIN_TOTP_SECRET="$totp" \
            J7_PROBE_TIMEOUT_MS=60000 J7_REPORT="$report_nodata" \
            node tests/evidence/j7-attribution-probe.mjs >"$private/probe-nodata.out" 2>"$private/probe-nodata.err" || rc=$?
          if (( rc == 125 )); then
            fail "J7_BUDGET_EXCEEDED:$phase"
          fi
          if (( rc != 0 )); then
            grep -E '^J7_PROBE_FAILED:[A-Za-z0-9_:.,-]{1,160}$' "$private/probe-nodata.err" | head -n 3 >&2 || true
            fail "J7_PROBE_FAILED:nodata:$rc"
          fi
          grep -qx 'J7_PROBE_OK' "$private/probe-nodata.out" || fail 'J7_PROBE_MARKER_MISSING:nodata'
          [[ -f "$report_nodata" && ! -L "$report_nodata" && -s "$report_nodata" ]] || fail 'J7_REPORT_MISSING:nodata'
          fact nodataProbeExit 0

          # 5b) PG 必须仍是起跑时的同一集群/同一版本（中途换容器或重启即拒）。
          read_pg_identity
          [[ "$PG_CLUSTER_SHA" == "$pg_cluster_before" ]] || fail 'J7_PG_CLUSTER_CHANGED'
          [[ "$PG_VERSION_NUM" == "$pg_version_before" ]] || fail 'J7_PG_VERSION_CHANGED'
          stop_instance nodata "$nodata_port" "$nodata_pid" || fail "$STOP_CODE"
          nodata_pid=''

          # 6) 私库回收：只删本步骤成功 CREATE 的那一个库，并核实它真的消失。
          phase=cleanup
          budget_check
          if (( db_created )) && (( ! db_dropped )); then
            drop_rc=0
            run_bounded "$J7_PSQL_TIMEOUT_S" docker exec "$PG_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "DROP DATABASE \"$fresh_db\"" >"$private/db-drop.log" 2>&1 || drop_rc=$?
            if (( drop_rc == 125 )); then fail "J7_BUDGET_EXCEEDED:$phase"; fi
            (( drop_rc == 0 )) || fail 'J7_DB_DROP_FAILED'
            db_dropped=1
            fact freshDbDropped true
            count_rc=0
            gone="$(run_bounded "$J7_PSQL_TIMEOUT_S" docker exec "$PG_CONTAINER_ID" psql -U postgres -d postgres -tAc \
              "SELECT count(*) FROM pg_database WHERE datname = '$fresh_db'" 2>"$private/db-gone.err")" || count_rc=$?
            if (( count_rc == 125 )); then fail "J7_BUDGET_EXCEEDED:$phase"; fi
            (( count_rc == 0 )) || fail 'J7_DB_DROP_VERIFY_FAILED'
            gone="$(printf '%s' "$gone" | tr -d ' \r\n')"
            [[ "$gone" == 0 ]] || fail 'J7_DB_STILL_PRESENT'
            db_gone=1
            fact freshDbGone true
          fi
          printf 'J7_DB name=%s created=%s dropped=%s gone=%s version=%s\n' \
            "$fresh_db" "$db_created" "$db_dropped" "$db_gone" "$pg_version"

          observe_ports_after
          printf 'J7_PORT_OBS after=free ports=3100,3101,3999 probe=ports.cjs+3101\n'

          # 7) 同一构建未被替换（server.js 与 BUILD_ID 前后一致）。
          phase=verify
          budget_check
          [[ "$(sha256_upper .next/standalone/server.js)" == "$server_sha" ]] || fail 'J7_BUILD_CHANGED'
          [[ "$(tr -d '\r\n' < .next/standalone/.next/BUILD_ID)" == "$build_id" ]] || fail 'J7_BUILD_CHANGED'
          fact buildStable true

          # 8) 三份固定安全文件 + 专属上传前的交叉核验（自报之外，重读实物与摘要）。
          phase=complete
          write_cleanup success || fail 'J7_CLEANUP_JSON_FAILED'
          gate_log="$private/gate.log"
          if ! node "$private/j7-observe.cjs" gate --mode formal --facts "$facts" --evidence-dir "$ws/$evidence_dir" \
            --a3-dir "$ws/e2e-evidence" >"$gate_log" 2>&1; then
            cat "$gate_log" >&2
            gate_code="$(sed -n 's/^J7_SAFE_FILES_FAIL://p' "$gate_log" | tail -n 1)"
            [[ "$gate_code" =~ ^[A-Za-z0-9_:.,-]{1,120}$ ]] || gate_code='GATE_FAILED'
            fail "J7_SAFE_FILES_${gate_code}"
          fi
          cat "$gate_log"

          # 8b) 认证绑定回执：只写固定安全字段（无 DSN/密钥/原日志），供独立具名上传链核身份。
          binding_json="$private/J7-RUNNER-BINDING.json"
          node - "$facts" "$retryable_app" "$report_full" "$retryable_json" "$binding_json" <<'BIND_EOF'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const [factsPath, appPath, probePath, retryPath, outPath] = process.argv.slice(2);
          const facts = new Map();
          for (const line of fs.readFileSync(factsPath, 'utf8').split('\n')) {
            if (!line) continue;
            const tab = line.indexOf('\t');
            if (tab > 0) facts.set(line.slice(0, tab), line.slice(tab + 1));
          }
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          const sha = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex').toUpperCase();
          const binding = {
            schema: 'j7-runner-binding/1',
            run: { workflow: 'CI', job: facts.get('job'), id: Number(facts.get('runId')), attempt: Number(facts.get('runAttempt')) },
            source: { commit: facts.get('head'), tree: facts.get('tree'), event: facts.get('event'), ref: facts.get('ref') },
            app: { origin: app.origin, pid: Number(app.pid), startTicks: app.startTicks },
            build: { buildId: facts.get('buildId'), serverJsBytes: Number(facts.get('serverJsBytes')), serverJsSha256: facts.get('serverJsSha256') },
            pg: { versionNum: Number(facts.get('pgServiceVersionNum')), database: facts.get('fullDb'), clusterSha256: facts.get('pgServiceClusterSha256'), containerId: String(process.env.PG_CONTAINER_ID || '') },
            probe: { mainFullSha256: sha(probePath) },
            retryable: { fileSha256: sha(retryPath), fileBytes: fs.statSync(retryPath).size },
            cleanup: { outcome: 'success', phase: 'complete', appStopped: true, probeExited: true },
          };
          fs.writeFileSync(outPath, `${JSON.stringify(binding, null, 2)}\n`, { encoding: 'utf8', mode: 0o600 });
          BIND_EOF
          binding_sha="$(sha256_upper "$binding_json")"
          printf 'J7_RUNNER_BINDING sha256=%s bytes=%s startTicks=%s\n' "$binding_sha" "$(wc -c < "$binding_json" | tr -d ' ')" "$app_start_ticks"

          # 8c) 成功出口移交：只把 upload 步骤读取的两个固定件放到 runner.temp 根，
          #     仅当 complete cleanup 与原 gate 都通过才到达；独占暂存、普通文件、闭集与 SHA
          #     复核、目标已存在即失败，绝不覆盖。失败/超时分支不可达。
          stage_upload_file() { # src name
            local src="$1" name="$2" sha='' bytes='' target=''
            HANDOFF_CODE=''
            [[ -f "$src" && ! -L "$src" ]] || { HANDOFF_CODE="J7_UPLOAD_HANDOFF_MISSING:$name"; return 1; }
            sha="$(sha256_upper "$src")"
            bytes="$(wc -c < "$src" | tr -d ' ')"
            (( bytes > 0 && bytes <= 1048576 )) || { HANDOFF_CODE="J7_UPLOAD_HANDOFF_SIZE:$name"; return 1; }
            target="$RUNNER_TEMP/$name"
            [[ ! -e "$target" && ! -L "$target" ]] || { HANDOFF_CODE="J7_UPLOAD_HANDOFF_EXISTS:$name"; return 1; }
            cp -- "$src" "$handoff_stage/$name" || { HANDOFF_CODE="J7_UPLOAD_HANDOFF_COPY:$name"; return 1; }
            [[ "$(sha256_upper "$handoff_stage/$name")" == "$sha" ]] || { HANDOFF_CODE="J7_UPLOAD_HANDOFF_SHA:$name"; return 1; }
            [[ "$(wc -c < "$handoff_stage/$name" | tr -d ' ')" == "$bytes" ]] || { HANDOFF_CODE="J7_UPLOAD_HANDOFF_BYTES:$name"; return 1; }
            mv -n -- "$handoff_stage/$name" "$target" 2>/dev/null || { HANDOFF_CODE="J7_UPLOAD_HANDOFF_MOVE:$name"; return 1; }
            [[ -f "$target" && ! -L "$target" ]] || { HANDOFF_CODE="J7_UPLOAD_HANDOFF_TARGET:$name"; return 1; }
            [[ "$(sha256_upper "$target")" == "$sha" ]] || { HANDOFF_CODE="J7_UPLOAD_HANDOFF_VERIFY:$name"; return 1; }
            HANDOFF_SHA="$sha"
            HANDOFF_BYTES="$bytes"
            handoff_owned_files+=("$target")
            handoff_owned_shas+=("$sha")
            return 0
          }
          rollback_handoff() {
            local i file sha
            for i in "${!handoff_owned_files[@]}"; do
              file="${handoff_owned_files[$i]}"
              sha="${handoff_owned_shas[$i]}"
              [[ -f "$file" && ! -L "$file" ]] || continue
              [[ "$(sha256_upper "$file")" == "$sha" ]] || continue
              rm -f -- "$file"
            done
            [[ -n "${handoff_stage:-}" ]] && rm -rf -- "$handoff_stage" 2>/dev/null || true
          }
          handoff_stage="$RUNNER_TEMP/.j7-handoff.${GITHUB_RUN_ID:?}.${GITHUB_RUN_ATTEMPT:?}"
          handoff_owned_files=()
          handoff_owned_shas=()
          mkdir -m 700 "$handoff_stage" 2>/dev/null || fail 'J7_UPLOAD_HANDOFF_STAGE'
          if ! stage_upload_file "$retryable_json" 'J7-RETRYABLE.json'; then
            failures+=("$HANDOFF_CODE")
            rollback_handoff
            write_cleanup failure || true
            fail "$HANDOFF_CODE"
          fi
          retryable_stage_sha="$HANDOFF_SHA"
          if ! stage_upload_file "$binding_json" 'J7-RUNNER-BINDING.json'; then
            failures+=("$HANDOFF_CODE")
            rollback_handoff
            write_cleanup failure || true
            fail "$HANDOFF_CODE"
          fi
          binding_stage_sha="$HANDOFF_SHA"
          fact uploadHandoffRetryableSha256 "$retryable_stage_sha"
          fact uploadHandoffBindingPreFinalizedSha256 "$binding_stage_sha"
          printf 'J7_UPLOAD_HANDOFF ok=2 retryableSha=%s bindingPreFinalizedSha=%s\n' "$retryable_stage_sha" "$binding_stage_sha"

          finalized=1
          trap - EXIT
          printf 'J7_RUNNER_OK\n'
          exit 0

      # 专属上传：只列三份已由 gate 交叉核验的安全文件；缺一件即 error，绝不再走 e2e-evidence/** 宽路径。
      # 放在旧广域上传之后，因此不需要改 playwright-report 的任何字节（J7 文件在它之后才产生）。
      # retryable 是独立旁证：单独命名、独立路径，绝不与主三件同目录或同名。
      - name: Upload J7 attribution receipt (exactly three safe files)
        if: ${{ !cancelled() && steps.j7_probe.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: j7-attribution-receipt
          path: |
            e2e-evidence/j7/j7-attribution.json
            e2e-evidence/j7/j7-nodata.json
            e2e-evidence/j7/j7-cleanup.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload J7 retryable receipt (separate named artifact)
        id: j7_retryable_upload
        if: ${{ !cancelled() && steps.j7_probe.outcome == 'success' && steps.j7_probe.outputs.retryable == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: j7-retryable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/J7-RETRYABLE.json
          retention-days: 7
          if-no-files-found: error
      - name: Finalize J7 runner binding (safe fields + upload anchor)
        id: j7_binding_finalize
        if: ${{ !cancelled() && steps.j7_probe.outcome == 'success' && steps.j7_retryable_upload.outcome == 'success' }}
        shell: bash
        env:
          RETRYABLE_ARTIFACT_NAME: j7-retryable-${{ github.run_id }}-${{ github.run_attempt }}
          RETRYABLE_ARTIFACT_ID: ${{ steps.j7_retryable_upload.outputs.artifact-id }}
          RETRYABLE_ARTIFACT_DIGEST: ${{ steps.j7_retryable_upload.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          node - <<'EOF'
          const fs = require('node:fs');
          const file = `${process.env.RUNNER_TEMP}/J7-RUNNER-BINDING.json`;
          const binding = JSON.parse(fs.readFileSync(file, 'utf8'));
          binding.upload = {
            artifactName: process.env.RETRYABLE_ARTIFACT_NAME,
            artifactId: process.env.RETRYABLE_ARTIFACT_ID,
            zipSha256: process.env.RETRYABLE_ARTIFACT_DIGEST || '',
          };
          fs.writeFileSync(file, JSON.stringify(binding, null, 2) + '\n');
          console.log('J7_RUNNER_BINDING_UPLOAD artifactId=' + binding.upload.artifactId + ' zipSha256=' + binding.upload.zipSha256);
          EOF
      - name: Upload J7 runner binding receipt (safe fields only)
        id: j7_binding_upload
        if: ${{ !cancelled() && steps.j7_binding_finalize.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: j7-runner-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/J7-RUNNER-BINDING.json
          retention-days: 7
          if-no-files-found: error

  posix-storage-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # run 44568993782 step 5: the postinstall `prisma generate` died on a TLS ECONNRESET
      # (attemptNumber 1, retriesLeft 2) before any repository test, while the identical frozen
      # install succeeded in the other jobs. Retry the same command once, and only when that
      # prisma generate failure is what ended the first attempt; every other failure returns
      # its own exit code at once, and a second failure is final.
      - name: Install dependencies (frozen lockfile)
        timeout-minutes: 20
        run: |
          set -Eeuo pipefail
          log=/tmp/pnpm-install-1.log
          set +e
          pnpm install --frozen-lockfile 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'PNPM_INSTALL_OK attempt=1'
            exit 0
          fi
          if awk '/prisma generate/ { seen = 1 } seen && /ECONNRESET/ { hit = 1 } END { exit !hit }' "$log"; then
            echo 'PNPM_INSTALL_PRISMA_ECONNRESET_RETRY' >&2
            sleep 10
            pnpm install --frozen-lockfile
            echo 'PNPM_INSTALL_OK attempt=2'
            exit 0
          fi
          echo "PNPM_INSTALL_NOT_RETRIED exit=$rc" >&2
          exit "$rc"
      - name: 存储权限与符号链接安全验收
        run: |
          set +e
          node --import tsx --test \
            --test-reporter=spec \
            --test-reporter=tap \
            --test-reporter-destination=stdout \
            --test-reporter-destination=posix-storage-security.tap \
            tests/prod-env-check.test.ts tests/storage-local.test.ts tests/storage.test.ts
          test_status=$?
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const tap = readFileSync('posix-storage-security.tap', 'utf8');
          // TAP 把标题里的 # 写成 \#。不还原时 #323 会显示通过，闸门却把它当成缺失。
          const unescapeTap = (value) => value.replaceAll('\\#', '#');
          const results = [];
          for (const line of tap.split(/\r?\n/)) {
            const match = line.match(/^\s*(ok|not ok)\s+\d+\s+-\s(.*)$/);
            if (!match) continue;
            const raw = match[2];
            const skipAt = raw.lastIndexOf(' # SKIP');
            if (match[1] === 'not ok') {
              const comment = raw.search(/ # /);
              results.push({ status: 'fail', name: unescapeTap(comment >= 0 ? raw.slice(0, comment) : raw), detail: line.trim() });
            } else if (skipAt >= 0) results.push({ status: 'skip', name: unescapeTap(raw.slice(0, skipAt)), detail: raw.slice(skipAt + 8).trim() });
            else results.push({ status: 'pass', name: unescapeTap(raw), detail: '' });
          }
          const counts = { pass: 0, fail: 0, skip: 0 };
          const rows = [];
          for (const result of results) {
            counts[result.status] += 1;
            rows.push(`${result.status.toUpperCase()}\t${result.name}${result.detail ? `\t${result.detail}` : ''}`);
          }
          const required = [
            'local 驱动：UPLOAD_DIR 缺失 / 相对 / 非规范 / 根目录 / public/.next 下 / 不可写 都拒绝启动，只报变量名不报路径',
            'local 驱动：默认 fs 检查真实目录（可写通过、不存在 / 只读 / 是文件 拒绝）',
            '#323 local 驱动：UPLOAD_DIR 先 realpath 再比 public/、.next/ 前缀（符号链接指进去也拒绝），只报变量名不报路径',
            '不跟随符号链接：目录或文件是符号链接（指向根目录外）时 get/put/delete 都拒绝，外部文件不受影响',
            '根目录本身是符号链接（挂载点）时正常工作：按 realpath 判断',
            'local: put/get/delete, private mode, no overwrite',
            '只读目录拒绝',
            '拒绝覆盖已有对象',
            '拒绝根目录',
            '拒绝不可写目录',
            '注入 realpath 指向 public 时拒绝',
          ];
          const problems = [];
          for (const name of required) {
            const hits = results.filter((result) => result.name === name);
            if (hits.length === 0) problems.push(`ABSENT\t${name}`);
            for (const hit of hits) if (hit.status !== 'pass') problems.push(`${hit.status.toUpperCase()}\t${name}\t${hit.detail}`);
          }
          const record = [
            `platform=${process.platform}`,
            `pass=${counts.pass}`,
            `fail=${counts.fail}`,
            `skip=${counts.skip}`,
            ...rows,
            ...problems,
          ].join('\n') + '\n';
          writeFileSync('posix-storage-security.record.txt', record);
          process.stdout.write(record);
          if (problems.length > 0 || counts.fail > 0) process.exit(1);
          EOF
          gate_status=$?
          set -e
          if [ "$test_status" -ne 0 ] || [ "$gate_status" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: posix-storage-security
          path: |
            posix-storage-security.tap
            posix-storage-security.record.txt
          if-no-files-found: ignore
          retention-days: 14


  mail-evidence:
    runs-on: ubuntu-24.04
    # 81 minutes for capped preparation, PG17 tooling and integration. Reserve time for checkout,
    # frozen install, cleanup and uploads without changing the private namespace deadline.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CI: 'true'
      SMTP_EVIDENCE_REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
      TURNSTILE_SECRET_KEY: '1x0000000000000000000000000000000AA'
      TURNSTILE_VERIFY_URL: http://127.0.0.1:3999/siteverify
      NEXT_PUBLIC_TAWK_PROPERTY_ID: e2eprop
      NEXT_PUBLIC_TAWK_WIDGET_ID: e2ewidget
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Supply pinned BusyBox with crond for cron evidence
        shell: bash
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          bb=/usr/bin/busybox
          deb=/tmp/busybox-static_1.36.1-6ubuntu3.1_amd64.deb
          # Two verified official endpoints on distinct DNS zones; the same deb bytes, size pin
          # and SHA256 pin below still gate the install. Per-endpoint budget keeps the whole
          # download inside this 5-minute step: 2 endpoints x 2 attempts x 30 s max = 120 s.
          urls=(
            https://mirrors.edge.kernel.org/ubuntu/pool/main/b/busybox/busybox-static_1.36.1-6ubuntu3.1_amd64.deb
            https://archive.ubuntu.com/ubuntu/pool/main/b/busybox/busybox-static_1.36.1-6ubuntu3.1_amd64.deb
          )
          sha256=944b2728f53ceb3916cec2c962873c9951e612408099601751db2a0a5d81e0ed
          bb_sha256=dbac288c29ba568459550a2da9e7ae0ded6b1fc728ee9fad3044c44e62d6ac14
          # A dynamic `busybox` package or any installed provider of it would make dpkg refuse
          # to unpack busybox-static. Stop before the download instead of degrading.
          if dpkg-query -W -f='${Status}' busybox 2>/dev/null | grep -q 'install ok installed'; then
            echo 'BUSYBOX_PACKAGE_CONFLICT' >&2
            exit 1
          fi
          if ! providers_raw=$(dpkg-query -W -f='${Package}\t${Status}\t${Provides}\n' '*' 2>/dev/null); then
            echo 'BUSYBOX_PROVIDER_SCAN_FAILED' >&2
            exit 1
          fi
          if ! providers=$(printf '%s\n' "$providers_raw" \
            | awk -F'\t' '$2 == "install ok installed" && NF > 2 && $1 != "busybox-static" && $3 ~ /(^|[, ])busybox([, ]|$|=)/ { print $1 }' \
            | sort -u); then
            echo 'BUSYBOX_PROVIDER_SCAN_FAILED' >&2
            exit 1
          fi
          if [ -n "$providers" ]; then
            echo "BUSYBOX_PROVIDER_CONFLICT $(printf '%s' "$providers" | tr '\n' ' ')" >&2
            exit 1
          fi
          # dpkg must own the file it installs: an unowned or foreign-owned target is a stop.
          if [ -e "$bb" ] || [ -L "$bb" ]; then
            if ! target_owner=$(dpkg -S "$bb" 2>/dev/null); then
              echo 'BUSYBOX_UNMANAGED_TARGET_PRESENT' >&2
              exit 1
            fi
            case "$target_owner" in
              'busybox-static: '*) echo "BUSYBOX_TARGET_ALREADY_MANAGED $target_owner" >&2 ;;
              *) echo "BUSYBOX_TARGET_OWNED_BY_OTHER_PACKAGE $target_owner" >&2; exit 1 ;;
            esac
          fi
          supplied=0
          for url in "${urls[@]}"; do
            if curl -fsSL --proto '=https' --tlsv1.2 \
                 --retry 1 --retry-all-errors --retry-delay 2 \
                 --connect-timeout 10 --max-time 30 \
                 -o "$deb" "$url"; then
              echo "BUSYBOX_SUPPLIED_FROM $url"
              supplied=1
              break
            fi
            echo "BUSYBOX_SUPPLY_ENDPOINT_FAILED $url" >&2
          done
          [ "$supplied" = 1 ] || { echo 'BUSYBOX_SUPPLY_ALL_ENDPOINTS_FAILED' >&2; exit 1; }
          [ "$(stat -c %s "$deb")" = 1008874 ] || { echo 'BUSYBOX_DEB_SIZE_MISMATCH' >&2; exit 1; }
          printf '%s  %s\n' "$sha256" "$deb" | sha256sum -c -
          sudo dpkg -i "$deb"
          [ "$(dpkg-query -W -f='${Status}' busybox-static 2>/dev/null)" = 'install ok installed' ] || { echo 'BUSYBOX_STATIC_NOT_INSTALLED' >&2; exit 1; }
          [ "$(dpkg-query -W -f='${Version}' busybox-static)" = '1:1.36.1-6ubuntu3.1' ] || { echo 'BUSYBOX_VERSION_MISMATCH' >&2; exit 1; }
          # local-smtp's pick() resolves /usr/bin first: prove this exact file is package-owned,
          # a plain root-owned 0755 file, and byte-identical to the reviewed deb payload.
          dpkg -L busybox-static | grep -qx "$bb" || { echo 'BUSYBOX_PACKAGE_PATH_MISSING' >&2; exit 1; }
          dpkg -S "$bb" 2>/dev/null | grep -q '^busybox-static: ' || { echo 'BUSYBOX_PATH_NOT_OWNED_BY_PACKAGE' >&2; exit 1; }
          { [ -f "$bb" ] && [ ! -L "$bb" ]; } || { echo 'BUSYBOX_NOT_REGULAR_FILE' >&2; exit 1; }
          IFS=' ' read -r bb_uid bb_mode <<<"$(stat -c '%u %a' "$bb")"
          [ "$bb_uid" = 0 ] || { echo 'BUSYBOX_OWNER_NOT_ROOT' >&2; exit 1; }
          [ "$bb_mode" = 755 ] || { echo 'BUSYBOX_MODE_NOT_0755' >&2; exit 1; }
          printf '%s  %s\n' "$bb_sha256" "$bb" | sha256sum -c - || { echo 'BUSYBOX_BINARY_SHA_MISMATCH' >&2; exit 1; }
          resolved=$(command -v busybox || true)
          if [ "$resolved" != "$bb" ]; then
            echo "BUSYBOX_PATH_NOTE command -v busybox -> ${resolved:-<none>}; the step uses $bb" >&2
          fi
          "$bb" --list > /tmp/busybox-applets.txt
          grep -qx crond /tmp/busybox-applets.txt
          help=$("$bb" crond --help 2>&1)
          grep -Fq -- '[-fbS]' <<<"$help"
          grep -Fq -- '[-l N]' <<<"$help"
          grep -Fq -- '[-L LOGFILE]' <<<"$help"
          grep -Fq -- '[-c DIR]' <<<"$help"
          grep -Eq -- '[[:space:]]-f[[:space:]]+Foreground' <<<"$help"
          banner=$("$bb" 2>&1 | sed -n '1p')
          case "$banner" in 'BusyBox v1.36.1'*) ;; *) echo "BUSYBOX_VERSION_BANNER_MISMATCH $banner" >&2; exit 1;; esac
          echo "BUSYBOX_CROND_READY $banner"
      - run: pnpm install --frozen-lockfile
      - name: Provision Playwright browser and OS deps (transient mirror + bounded retry)
        shell: bash
        timeout-minutes: 20
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Transient GitHub runner only: point the Ubuntu official sources at the verified
          # HTTPS mirror for this job. Suites/Components/Signed-By stay as shipped; unknown
          # layouts hard-fail instead of being guessed. DNS/hosts/resolv.conf are not touched.
          UBU=/etc/apt/sources.list.d/ubuntu.sources
          [ -f "$UBU" ] || { echo 'APT_SOURCE_LAYOUT_UNKNOWN no-ubuntu.sources' >&2; exit 1; }
          grep -q '^Signed-By:' "$UBU" || { echo 'APT_SIGNED_BY_MISSING' >&2; exit 1; }
          grep -Eq '^URIs:.*((archive|security)\.ubuntu\.com|mirror\+file:)' "$UBU" \
            || { echo 'APT_SOURCE_URIS_UNEXPECTED' >&2; exit 1; }
          if grep -Eq '^[[:space:]]*deb[[:space:]]+http' /etc/apt/sources.list 2>/dev/null; then
            echo 'APT_LEGACY_SOURCES_PRESENT' >&2; exit 1
          fi
          sudo cp -a "$UBU" /tmp/ubuntu.sources.bak
          sudo sed -i -E 's#^URIs:.*#URIs: https://mirrors.edge.kernel.org/ubuntu/#' "$UBU"
          grep -q '^Signed-By:' "$UBU" || { echo 'APT_SIGNED_BY_MISSING_AFTER_REWRITE' >&2; exit 1; }
          grep -q '^Components:' "$UBU" || { echo 'APT_COMPONENTS_MISSING_AFTER_REWRITE' >&2; exit 1; }
          if ! sudo apt-get update -o Acquire::Retries=3 -o Acquire::https::Timeout=30 \
                 -o Acquire::https::Verify-Peer=true -o Acquire::https::Verify-Host=true; then
            sudo cp -a /tmp/ubuntu.sources.bak "$UBU"
            echo 'APT_MIRROR_UPDATE_FAILED' >&2
            exit 1
          fi
          echo 'APT_UBUNTU_MIRROR_READY https://mirrors.edge.kernel.org/ubuntu/'
