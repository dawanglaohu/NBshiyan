name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: 依赖漏洞扫描（high 及以上阻断）
        run: pnpm audit --audit-level high --prod
      - name: 模型体积门槛（普通 1MB，带动画 1.5MB）
        run: node scripts/check-model-size.mjs
      - name: 模型和封面路径必须存在（products.ts）
        run: node scripts/check-model-refs.mjs
      - name: 后台接口必须鉴权
        run: node scripts/check-admin-guard.mjs
      - run: pnpm build
      # 固定 Chrome 版本，避免 runner 自带 Chrome 升级后与 Lighthouse 的 trace 格式不兼容（frame_sequence 报错）
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with: { chrome-version: stable, install-dependencies: true }
      - name: Lighthouse 性能门槛
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          pnpm start > /tmp/next.log 2>&1 &
          npx --yes wait-on@8 --timeout 120000 http://localhost:3000/en http://localhost:3000/en/products
          npx --yes @lhci/cli@0.15.x autorun
