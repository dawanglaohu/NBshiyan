name: security-review
# 改动安全相关路径的 PR，必须有安全复查 App 对最新提交的 APPROVE 才能通过。
# pull_request_target 使用默认分支上的这份文件。PR 修改、删规则或提前 return 不会改变本次判定。
# 只通过 API 读 PR 文件列表和 reviews。不 checkout，不安装，不构建，不执行 PR head 的代码。
# 不把 PR 标题、正文、分支名或文件名拼进 shell。批准后的重跑见 security-review-rerun.yml。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          REVIEWER_APP: ${{ vars.SECURITY_REVIEWER_APP }} # 例：packjoyu-security-reviewer[bot]
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            const sensitive = [/^package\.json$/, /^pnpm-lock\.yaml$/, /^\.github\//, /^src\/middleware\.ts$/,
              /^src\/app\/api\//, /^src\/lib\/server\//, /^security-headers\.ts$/, /^next\.config\.ts$/, /^prisma\//, /^patches\//, /^public\/(draco|basis)\//, /^pnpm-workspace\.yaml$/, /^\.npmrc$/,
              /^scripts\//, /^\.dockerignore$/, /^Dockerfile/, /^deploy\//, /^docker-compose/,
              /^tsconfig.*\.json$/, /^\.gitattributes$/, /^prod-env-check\.ts$/, /^src\/instrumentation\.ts$/,
              /^src\/auth\.ts$/, /^src\/lib\/admin\//, /^src\/lib\/edge\//, /^src\/lib\/contracts\//, /^src\/app\/admin-enroll\//, /^vercel\.json$/,
              /^\.env\.example$/, /(^|\/)\.gitattributes$/,
              /^next\.config\.(js|mjs|cjs|mts|cts)$/, /^middleware\.(js|mjs|cjs|ts|mts|cts)$/, /^src\/middleware\.(js|mjs|cjs|mts|cts)$/,
              /^src\/app\/admin\//, /^src\/app\/media\//, /^src\/components\/admin\//, /^src\/components\/seo\/JsonLd\.tsx$/, /^src\/lib\/site-settings\//];
            const hit = files.flatMap(f => [f.filename, f.previous_filename].filter(Boolean)).filter(p => sensitive.some(r => r.test(p)));
            if (!hit.length) { core.info('未改动安全路径，跳过'); return; }
            core.info('安全路径：' + hit.join(', '));
            const app = process.env.REVIEWER_APP;
            if (!app) core.setFailed('未配置仓库变量 SECURITY_REVIEWER_APP');
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number });
            const ok = reviews.some(r => r.user?.login === app && r.state === 'APPROVED' && r.commit_id === pr.head.sha);
            if (!ok) core.setFailed(`需要 ${app} 对最新提交 ${pr.head.sha.slice(0,7)} 的安全复查批准`);
