<style>
/* ===== design-file chrome ===== */
body{margin:0;background:#DDD8CF;font-family:var(--font);color:#1C1C1C}

.cap{font:600 14px/1.4 var(--font);margin:0 0 10px;color:#3a362f}
.cap small{font-weight:500;color:#6b655c}
.row{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap}
.frame{background:var(--bg);color:var(--ink);overflow:hidden;box-shadow:0 2px 0 #0002;position:relative}
.d{width:1440px}.m{width:390px}.m360{width:360px}
.note{position:absolute;right:8px;font:600 11px/1.3 var(--font);background:#2B6CB0;color:#fff;padding:3px 7px;border-radius:6px;z-index:5;max-width:260px}
body.render .note-ext{display:none}
/* ===== page tokens (theme C default, .theme-premium = B) ===== */
:root{--accent-text:#C2381A;--ok:#2F7D4F;--focus-ring:var(--accent-text);--consent-h:0px;--fab-clearance:84px}
.theme-premium{--accent-text:var(--gold);--focus-ring:var(--gold);--btn-ink:#121214}
.frame :focus-visible,.focus-demo{outline:2px solid var(--focus-ring);outline-offset:3px}
.wrap{max-width:var(--container);margin:0 auto;padding:0 40px}
.m .wrap,.m360 .wrap{padding:0 20px}
a{color:inherit}
.hdr{display:flex;align-items:center;justify-content:space-between;height:72px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:20px;text-decoration:none}
.logo b{color:var(--accent)}
.nav{display:flex;gap:28px;font-weight:600;font-size:15px}.nav a{text-decoration:none;min-height:44px;display:flex;align-items:center}
.m .nav,.m360 .nav{display:none}
.burger{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:18px}
.m .burger,.m360 .burger{display:block}
.crumbs{font-size:14px;color:var(--ink-2);padding:18px 0 0;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumbs span[aria-current]{color:var(--ink);font-weight:600;display:inline-flex;align-items:center;min-height:44px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;padding:16px 0 64px;align-items:center}
.m .hero,.m360 .hero{grid-template-columns:1fr;gap:24px;padding:8px 0 40px}
h1{font-size:var(--fs-display);line-height:1.05;letter-spacing:-.02em;margin:0 0 20px;font-weight:800;overflow-wrap:anywhere;hyphens:auto}
.m h1{font-size:36px}.m360 h1{font-size:32px}
.lead{font-size:18px;line-height:1.6;color:var(--ink-2);margin:0 0 28px;max-width:60ch}
.m .lead,.m360 .lead{font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:var(--r-pill);font:700 16px var(--font);text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform var(--dur-instant) var(--ease-out),opacity var(--dur-fast)}
.btn:active{transform:scale(var(--scale-press))}
.btn-p{background:var(--accent);color:#fff}
.theme-premium .btn-p{color:#121214}
.btn-s{border-color:var(--ink);color:var(--ink);background:transparent}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.m .ctas .btn,.m360 .ctas .btn{flex:1 1 100%}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:14px;color:var(--ink-2)}
.viewer{aspect-ratio:4/3;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);position:relative;display:grid;place-items:center;overflow:hidden}
.viewer svg{width:62%}
.vbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;justify-content:space-between}
.chip{min-height:44px;padding:0 16px;border-radius:var(--r-pill);background:var(--bg);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font:600 14px var(--font);color:var(--ink)}
.chip.ac{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{padding:64px 0;border-top:1px solid var(--line)}
.m section,.m360 section{padding:40px 0}
h2{font-size:var(--fs-h2);line-height:1.15;margin:0 0 28px;letter-spacing:-.01em;font-weight:800}
.m h2,.m360 h2{font-size:26px;margin-bottom:20px}
h3{font-size:var(--fs-h3);margin:0 0 8px;font-weight:700}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.m .why,.m360 .why{grid-template-columns:1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:22px}
.card p{margin:0;color:var(--ink-2);line-height:1.55;font-size:15px}
.ico{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,transparent);display:grid;place-items:center;margin-bottom:14px;color:var(--accent-text);font-weight:800}
/* specs */
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.m .spec-grid,.m360 .spec-grid{grid-template-columns:1fr;gap:20px}
.keyspecs{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.m360 .keyspecs{grid-template-columns:1fr}
.keyspecs div{padding:16px 18px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.keyspecs dt{font-size:13px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.keyspecs dd{margin:0;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.keyspecs dd small{font-size:14px;font-weight:600;color:var(--ink-2)}
.opt{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;font-size:15px}
.opt th,.opt td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}

.certs small{color:var(--ink-2);font-size:13px}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;counter-reset:s;list-style:none;padding:0;margin:0}
.m .steps,.m360 .steps{grid-template-columns:1fr}
.steps li{counter-increment:s;padding-top:52px;position:relative}
.m .steps li,.m360 .steps li{padding:0 0 0 52px;min-height:40px}
.steps li:before{content:counter(s);position:absolute;top:0;left:0;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.theme-premium .steps li:before{color:#121214}
.steps p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.5}
/* faq */
.faq details{border-bottom:1px solid var(--line)}
.faq summary{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-weight:700;font-size:17px;cursor:pointer;list-style:none}
.faq summary:after{content:"+";font-size:24px;color:var(--accent-text);transition:transform var(--dur-base) var(--ease-inout)}
.faq details[open] summary:after{transform:rotate(45deg)}
.faq p{margin:0 0 18px;color:var(--ink-2);line-height:1.6}
/* links */
.rel{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;list-style:none;padding:0;margin:0}
.m .rel,.m360 .rel{grid-template-columns:1fr}
.rel a{display:flex;justify-content:space-between;align-items:center;min-height:64px;padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);text-decoration:none;font-weight:700;transition:transform var(--dur-fast) var(--ease-out)}
.rel a:hover{transform:translateY(-2px)}
.rel a span{color:var(--accent-text)}
.reading a{display:inline-flex;align-items:center;min-height:44px;font-weight:700;color:var(--accent-text);text-underline-offset:4px}
.ctaband{background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:44px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.theme-premium .ctaband{background:var(--surface);color:var(--ink);border:1px solid var(--gold)}
.m .ctaband,.m360 .ctaband{flex-direction:column;align-items:stretch;padding:28px 20px}
.ctaband h2{margin:0 0 8px}.ctaband p{margin:0;opacity:.8}
.foot{padding:40px 0 calc(40px + var(--fab-clearance));font-size:14px;color:var(--ink-2);border-top:1px solid var(--line);margin-top:64px}
.foot a{display:inline-flex;min-height:44px;align-items:center;margin-right:20px}
.sticky{position:absolute;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--line);display:none;backdrop-filter:blur(8px)}
.m .sticky,.m360 .sticky{display:block}.sticky .btn{width:100%}
.fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:50%;background:#25D366;display:none;place-items:center;color:#fff;font-weight:800;box-shadow:var(--shadow)}
.m .fab,.m360 .fab{display:grid}
/* 503 */
.err{min-height:720px;display:grid;place-items:center;text-align:center;padding:40px 20px}
.m .err{min-height:760px}
.err .code{font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--accent-text);margin-bottom:16px}
.err h1{font-size:44px}.m .err h1{font-size:30px}
.err p{color:var(--ink-2);font-size:17px;line-height:1.6;max-width:46ch;margin:0 auto 28px}
.err .ctas{justify-content:center}
.err .ill{width:140px;margin:0 auto 24px}
.status{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);margin-top:20px}
</style></head>

 const ks=specHTML(l,spec,t),ce=certHTML(l,spec,t);
 return `<div class="frame ${size} ${theme}" lang="${l}">
 <div class="wrap"><header class="hdr"><a class="logo" href="#">Pack<b>Joy</b>U</a><nav class="nav">${t.nav.map(x=>`<a href="#">${x}</a>`).join('')}</nav><button class="burger" aria-label="Menu">☰</button></header>
 <nav class="crumbs" aria-label="Breadcrumb"><a href="#">${t.home}</a>›<a href="#">${t.products}</a>›<span aria-current="page">${c.h1}</span></nav>
 <div class="hero"><div><h1>${c.h1}</h1><p class="lead">${c.lead}</p>
  <div class="ctas"><a class="btn btn-p ${focus?'focus-demo':''}" href="#">${t.quote} →</a><a class="btn btn-s" href="#">${t.custom}</a></div></div>
  <div class="viewer" role="img" aria-label="${c.h1}">${BOX(theme?'#D4AF6A':'var(--accent)')}<div class="vbar"><span class="chip">↻ ${t.rotate}</span><button class="chip ac">${t.open}</button></div></div></div>
  ${n(90,'H1 = #188 H1 · server-rendered · NO fade-in on H1/hero. Poster = next/image priority; 3D canvas mounts on top client-side.')}
 </div>
 <div class="wrap">
 <section><h2>${t.why}</h2><div class="why">${c.why.map((w,i)=>`<div class="card reveal"><div class="ico">${i+1}</div><h3>${w[0]}</h3><p>${w[1]}</p></div>`).join('')}</div></section>
 <section><h2>${t.specs}</h2><div class="spec-grid"><div>${ks}${ce}${!ks&&!ce?`<h3 class="subh">${t.options}</h3>${optT(c)}`:''}</div>${ks||ce?`<div><h3 class="subh">${t.options}</h3>${optT(c)}</div>`:''}</div>
 </section>
 <section><h2>${t.how}</h2><ol class="steps">${c.how.map(s=>`<li class="reveal"><h3>${s[0]}</h3><p>${s[1]}</p></li>`).join('')}</ol></section>
 ${faq?`<section class="faq" style="position:relative"><h2>${t.faq}</h2>${c.faq.map((q,i)=>`<details ${i==0?'open':''}><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}${n(0,'FAQ: hidden until Ryan finalizes (#209 §1/§3). Answers with TBD are dropped.')}</section>`:''}
 <section><h2>${t.related}</h2><ul class="rel">${c.rel.map(r=>`<li><a href="${r[0]}">${r[1]}<span>→</span></a></li>`).join('')}</ul></section>
 <section class="reading"><h2>${t.reading}</h2><a href="${c.read[0]}">${c.read[1]} →</a></section>
 <div class="ctaband"><div><h2>${t.ctaT}</h2><p>${t.ctaP}</p></div><a class="btn btn-p" href="#">${t.quote} →</a></div>
 </div>
 <footer class="foot"><div class="wrap">${t.foot.map(x=>`<a href="#">${x}</a>`).join('')}<div>© PackJoyU</div></div></footer>
 <div class="fab" aria-hidden="true">WA</div>
 <div class="sticky"><a class="btn btn-p" href="#">${t.quote} →</a></div>
 </div>`;
}
function optT(c){return `<table class="opt"><tbody>${c.opt.map(o=>`<tr><th scope="row">${o[0]}</th><td>${o[1]}</td></tr>`).join('')}</tbody></table>`}
const E={en:{c:'503 · TEMPORARILY UNAVAILABLE',h:'Temporarily unavailable',p:'Temporarily unavailable, please try again later.',r:'Try again',h2:'Browse products'},
 ru:{c:'503 · ВРЕМЕННО НЕДОСТУПНО',h:'Временно недоступно',p:'Временно недоступно, пожалуйста, попробуйте позже.',r:'Попробовать снова',h2:'Смотреть продукцию'}};
function e503(l,size){const e=E[l];return `<div class="frame ${size}" lang="${l}"><div class="wrap"><header class="hdr"><a class="logo" href="#">Pack<b>Joy</b>U</a><button class="burger" aria-label="Menu">☰</button></header></div>
 <main class="err"><div><div class="ill">${BOX('var(--line)')}</div><div class="code">${e.c}</div><h1>${e.h}</h1><p>${e.p}</p>
 <div class="ctas"><button class="btn btn-p">↻ ${e.r}</button><a class="btn btn-s" href="/${l}/products">${e.h2}</a></div></div></main></div>`}
const F=[
 ['d-en','Desktop 1440 · EN · theme C · partial specs (size, MOQ, sample, certs only)',()=>page({})],
 ['d-ru','Desktop 1440 · RU · theme C · partial specs',()=>page({l:'ru'})],
 ['d-wine-b','Desktop 1440 · EN · Wine boxes · theme B (gift/wine) · all spec fields filled',()=>page({cat:'wine',theme:'theme-premium',spec:SPEC_FULL,focus:true})],
 ['m-en','Mobile 390 · EN · partial specs · sticky CTA + FAB above --fab-clearance',()=>page({size:'m',faq:false})],
 ['m-ru','Mobile 390 · RU · partial specs',()=>page({l:'ru',size:'m',faq:false})],
 ['m360-ru','Mobile 360 · RU (longest strings) · NO specs → key-spec block + certs hidden, options table only',()=>page({l:'ru',size:'m360',spec:null,faq:false})],
 ['e503','503 · EN/RU · desktop 1440 + mobile 390 · noindex',()=>`<div class="row">${e503('en','d')}</div><div class="row" style="margin-top:40px">${e503('ru','m')}${e503('en','m')}</div>`]];
const only=location.hash.slice(1);if(only)document.body.classList.add('render');
document.getElementById('board').innerHTML=F.filter(f=>!only||f[0]===only).map(f=>`<div id="${f[0]}"><p class="cap">${f[1]}</p><div class="row">${f[2]()}</div></div>`).join('');
</script>
