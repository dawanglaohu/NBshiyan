<!doctype html><html lang="en"><head><meta charset="utf-8"><title>PackJoyU — 3D customizer and product landing (Fixes #102)</title>
<link rel="stylesheet" href="tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#FBF8F3;--ink:#1C1C1C;--ink-2:#5A5650;--line:#E8E2D8;--accent:#FF5A36;--sun:#FFD166}
*{box-sizing:border-box}body{margin:0;background:#E9E4DB;font-family:Manrope,system-ui,sans-serif;color:var(--ink);padding:40px}

@container (max-width:500px){.g3,.g4{grid-template-columns:1fr}.g4.k{grid-template-columns:1fr 1fr}}

.theme-premium{background:#121214;color:#F2E9D8}.theme-premium .card{background:#1B1B1F;border-color:#2C2A27}.theme-premium .desc,.theme-premium .lead{color:#BFB6A6}
.theme-premium .eyebrow,.theme-premium .link{color:#D4AF6A}.theme-premium .btn{background:#D4AF6A;color:#121214}.theme-premium .ph{background:repeating-linear-gradient(45deg,#1F1E22 0 12px,#232226 12px 24px);color:#8E8676}
.theme-premium .tag{border-color:#3A352D;color:#D4AF6A}
.kpi{border-top:2px solid var(--ink);padding-top:14px}.kpi b{font-size:40px;display:block}.kpi span{font-size:14px;color:var(--ink-2)}

.split{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}@container (max-width:500px){.split{grid-template-columns:1fr;gap:24px}}
.steps{counter-reset:s;display:grid;gap:14px;padding:0;margin:0;list-style:none}.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;font-size:15px;line-height:1.5}
.steps li:before{content:counter(s,decimal-leading-zero);font-weight:800;color:var(--accent);min-width:28px}
.cert{display:flex;flex-wrap:wrap;gap:10px}.cert span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:24px;padding-bottom:4px}.filters span{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;background:#fff}
.filters .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.masonry{columns:3;column-gap:20px}@container (max-width:500px){.masonry{columns:1}}.masonry .card{break-inside:avoid;margin-bottom:20px}
.quote{font-size:15px;font-style:italic;color:var(--ink-2);margin:0}.flag{font-size:12px;font-weight:700;color:var(--ink-2)}
.cta{background:var(--ink);color:#fff;border-radius:24px;padding:40px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.cta h3{margin:0;font-size:28px;max-width:680px}@container (max-width:500px){.cta{padding:24px}.cta h3{font-size:22px}}
.ru{border-top:1px dashed var(--line)}
</style></head><body>
<style>
.bc{font-size:13px;color:var(--ink-2);margin-bottom:12px}.bc a{color:var(--ink-2)}
table.spec{width:100%;border-collapse:collapse;font-size:15px}table.spec th,table.spec td{text-align:left;padding:12px 0;border-bottom:1px solid var(--line);vertical-align:top}table.spec th{width:38%;color:var(--ink-2);font-weight:600}
.theme-premium table.spec th,.theme-premium table.spec td{border-color:#2C2A27}.theme-premium table.spec th{color:#BFB6A6}
details{border-bottom:1px solid var(--line);padding:14px 0}summary{font-weight:700;cursor:pointer}details p{color:var(--ink-2);margin:8px 0 0;font-size:15px}
.theme-premium details{border-color:#2C2A27}.theme-premium details p{color:#BFB6A6}
.meta{font:12px ui-monospace,monospace;background:#fff;border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;color:var(--ink-2);margin-bottom:20px;word-break:break-word}
.theme-premium .meta{background:#1B1B1F;color:#BFB6A6;border-color:#D4AF6A}
.cz{display:grid;grid-template-columns:1fr 400px;min-height:760px;position:relative}@container (max-width:500px){.cz{grid-template-columns:1fr;min-height:0}}
.stage{position:relative;background:radial-gradient(circle at 50% 45%,#fff,#F1EBE1);display:grid;place-items:center;min-height:420px}
.stage .ph{width:60%;aspect-ratio:1;border-radius:20px}
.hint{position:absolute;left:50%;top:20px;transform:translateX(-50%);background:#1C1C1Ccc;color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;white-space:nowrap}
.tapov{position:absolute;inset:0;display:grid;place-items:center;background:#1C1C1C33}.tapov span{background:#fff;border-radius:999px;padding:12px 20px;font-weight:700;white-space:nowrap}
.panel{border-left:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:22px;background:#fff}@container (max-width:500px){.panel{border-left:0;border-top:1px solid var(--line);padding:20px}}
.panel h4{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw i{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);display:block}.sw i.on{box-shadow:0 0 0 2px var(--accent)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;font-size:14px;color:var(--ink-2)}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dims label{font-size:12px;color:var(--ink-2)}.dims div{border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:700}
.share{display:flex;gap:8px}.share code{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btn.sm{padding:10px 16px;font-size:14px}
.fab{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px}.fab b{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;box-shadow:0 6px 18px #0003}.fab b.a{background:var(--accent)}
.cookie{position:absolute;left:20px;bottom:20px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:13px;display:flex;gap:10px;align-items:center;max-width:420px;box-shadow:0 6px 18px #0001}
@container (max-width:500px){.cookie{left:10px;right:76px;bottom:10px;max-width:none;flex-wrap:wrap}.fab{right:10px;bottom:10px}}
.theme-premium .btn.ghost{background:transparent}
.rm{font-size:12px;color:var(--ink-2);background:#FFF4E0;border-radius:10px;padding:10px 12px}

</head><body>
<h1 class="doc">设计稿 · 3D 定制器 / 产品落地页（Fixes #102）</h1>
<p class="note">每块左 1440 桌面、右 390 手机；虚线下为俄语。落地页文案、slug、title、description 取自 src/lib/seo/categoryMeta.ts（PR #106，俄语为待 Ryan 校对草稿）；结构按 docs/seo-product-pages.md。规格/FAQ 内容为示意（MOQ 未定，不写数字）。工厂页已在 #107，本稿不重复。</p>
<div id="pages"></div>

<template id="t-cz">
<div class="cz"><div class="stage"><div class="hint">{{c.hint}}</div><div class="ph">{{c.model}}</div>{{tap}}
<div class="fab"><b class="a">Quote</b><b>Chat</b><b>↑</b></div>
<div class="cookie">{{c.cookie}} <a class="btn sm">{{c.accept}}</a> <a class="btn sm ghost">{{c.settings}}</a></div></div>
<aside class="panel"><div class="bc">Home / Products / {{c.cat}}</div><h3 style="margin:0;font-size:24px">{{c.title}}</h3>
<div><h4>{{c.color}}</h4><div class="sw"><i class="on" style="background:#C8A27A"></i><i style="background:#fff"></i><i style="background:#1C1C1C"></i><i style="background:#FF5A36"></i><i style="background:#6B1F2A"></i><i style="background:#D4AF6A"></i><i style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)" title="Pantone"></i></div></div>
<div><h4>{{c.logo}}</h4><div class="drop">{{c.drop}}<br><small>SVG · PNG · PDF ≤ 10 MB</small></div></div>
<div><h4>{{c.size}}</h4><div class="dims"><span><label>L</label><div>300 mm</div></span><span><label>W</label><div>200 mm</div></span><span><label>H</label><div>100 mm</div></span></div></div>
<div><h4>{{c.share}}</h4><div class="share"><code>packjoyu.com/s/7Kx2Qa</code><a class="btn sm ghost">{{c.copy}}</a></div></div>
<a class="btn" style="justify-content:center">Get a quote</a><div class="rm">{{c.rm}}</div></aside></div>
</template>

<template id="t-lp">
<section class="sec {{theme}}"><div class="bc">Home / Products / {{p.crumb}}</div>
<div class="meta">URL /{{loc}}/products/{{p.slug}}<br>&lt;title&gt; {{p.title}}<br>description: {{p.desc}}</div>
<div class="split"><div><h1 style="font-size:46px;line-height:1.1;margin:0 0 16px">{{p.h1}}</h1><p class="lead">{{p.intro}}</p><a class="btn">Get a quote</a> <a class="btn ghost" style="{{gh}}">{{p.cz}}</a></div><div class="ph" style="aspect-ratio:1">posters/{{p.poster}}.webp + 3D</div></div></section>
<section class="sec {{theme}}" style="padding-top:0"><div class="split" style="align-items:start"><div><h2 style="font-size:30px">{{p.specH}}</h2>{{p.spec}}</div>
<div><h2 style="font-size:30px">{{p.useH}}</h2><div class="tags" style="margin-bottom:28px">{{p.uses}}</div><h2 style="font-size:30px">FAQ</h2>{{p.faq}}</div></div></section>
<section class="sec" style="padding-top:{{rp}}"><h2 style="font-size:28px">{{p.relH}}</h2><div class="grid g3">{{p.rel}}</div></section>
</template>
