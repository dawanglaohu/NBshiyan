# TLS terminator for SRH, internal network only. Never published, never reachable from the host or the internet.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  client_max_body_size 64k;
  upstream srh { server srh:80; keepalive 8; }
  server {
    listen 8443 ssl;
    server_name redis-rest;
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.3;
    # The app only uses POST /pipeline (ratelimit + IndexNow de-dup)
    location = /pipeline {
      limit_except POST { deny all; }
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://srh;
    }
    location / { return 404; }
  }
}
